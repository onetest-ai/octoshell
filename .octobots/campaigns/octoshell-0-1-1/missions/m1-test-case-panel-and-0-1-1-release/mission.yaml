name: M1 - Test-case panel and 0.1.1 release
status: executing
description: 'A test case (`<campaign>/tests/m<n>/TC-NNN_*.md`, M4''s TC format contract) gets its own rendered panel, the same kind of form campaigns, missions, tasks and bugs have: a header (id, title, a status dropdown, kind, last run date with a link that opens the evidence RUN file), a Covered criteria section (each covered AC''s id and text, linking to the mission panel), the Markdown body rendered by the notes panel''s sanitized renderer (react-markdown + remark-gfm + rehype-sanitize), and an Open source file button. It is a read view plus a status dropdown; the body is edited in the source file. The dropdown writes status exactly as the pack''s set-test-status.js does (frontmatter line edits only, atomic write, body byte-identical, pass/fail/blocked write last_run {date} with no evidence), through a TypeScript port of the script''s line edit in packages/board with byte-parity tests against the shipped script, and it never writes over a status an agent wrote since the panel last rendered. A single click on a TC in the sidebar, or on a TC row in the mission panel (user decision 4), opens the panel instead of the raw file. A legacy TC with frontmatter can be set from the dropdown (decision 5). Ends with the 0.1.1 release: the CHANGELOG fix and 0.1.1 entry, the version bump in a standalone release commit, the VSIX built from it and verified black-box. M6 B1 (status-coloured Tests node and mission-group icons) is already on the campaign branch feat/octoshell-0-1-1 (PR #172, merge 9c7d17af) and reaches main with the campaign -> main PR; it is not redone. The pack is not changed (stays v57, byte-identical).'
