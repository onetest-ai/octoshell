notes: |-
  ## Planning notes (tech-lead, 2026-10-06; revised after the plan review the same day)

  Planned from the real code on feat/octoshell-0-1-1 (M6 B1 merged at 9c7d17af, PR #172) and the real boards (octoshell's own, solo read only).

  ### What exists (cite file:line)
  - TestCase entity and reader: packages/board/src/test-cases.ts:24-38 (TestCase), :72 parseTestCase (id from the filename, title from frontmatter else H1 else filename, status unknown when absent), :123-182 TestCaseReader (stat-cached; an external write shows on the next listing). Coverage: :185 computeCoverage. Nothing in packages/board writes a TC today (:3-4).
  - packages/board/src/tc-io.ts:105 rewriteFrontmatter re-dumps the whole YAML block. It is NOT the script's edit (it drops comments and reorders keys), so the dropdown must not use it.
  - The pack's writer: apps/vscode-extension/resources/octobots-pack/skill/mission-planner/scripts/set-test-status.js: --date/--evidence refused for draft/ready :85, path rule :100-106, symlink refusal :109-113, bounded no-follow read :117, line edits :128-194 (status/last_run replaced in place; last_run replaced wholesale :190-193), re-parse and compare :212-227, no-op idempotence :220-224 (for pass/fail/blocked a same-status call still re-dates last_run), atomic temp+rename :229-238, UTC default date :96. It has no compare-and-swap.
  - The T6.2 review shapes the script refuses or edits narrowly: packages/board/test/scripts-cli-scenarios.test.ts:1823-1843.
  - Host: board-host.ts:110-131 tests read API, no TC write. rpc-dispatcher.ts:116-118 and protocol/rpc-contract.ts:177-180,238-242 the three read-only tests:* RPCs.
  - Tree: campaigns-tree.ts testCaseItem runs OPEN_TEST_FILE_COMMAND on the absolute path; testFileToOpen (:57-67) is the guard; testFileArgFromWebview (:74). campaigns-tree.ts imports vscode, so board-host.ts must not import the guard from it: the guard moves to a VS Code-free host module and campaigns-tree.ts re-exports it. src/extension.ts:286-289 registers the guarded octoshell.openTestFile.
  - Panels: entity-panel-manager.ts:13 Kind = campaign|mission|task|bug; :172-184 refreshEntity's kind ternary; :270-284 open (one panel per key, reveal on re-open); :295-296 every panel refreshes on entities:changed; :318 openTestFile action. src/extension.ts:203-231 one serializer per view type; package.json:38-43 onWebviewPanel activation events; panel-restore-activation.test.ts collects exported *_VIEW_TYPE constants. protocol/host-events.ts:10 BindMessage kinds; chat-entry.tsx:26-44 Bound and resolveBound (:35).
  - Webview: mission-view.tsx:103-113 (and task-view.tsx:62, bug-view.tsx:84) the Status row; mission-tests.tsx TC rows post openTestFile; tests-ui.tsx:9-26 TestStatusBadge; notes-block.tsx:15-18 imports react-markdown/remark-gfm/rehype-sanitize and :33-58 MD_COMPONENTS (module-private: T1.3 extracts it into a shared renderer used by both).
  - Refresh path: the board watcher rebuilds on a write to tests/m<n>/*.md (M4-AC6) and BoardHost.reconcile emits entities:changed, which refreshes the tree and every open panel.
  - Graph payload: packages/graph/src/board.ts:12 imports BoardModel from @octoshell/board, so the octograph payload bundles board code reachable from BoardModel.

  ### Decision: how the host writes status (tech-lead, 2026-10-06)
  Chosen: (a) a TypeScript port of set-test-status.js's non-migrate line edit in packages/board, with byte-parity tests that run the shipped script.
  Weighed:
  - (b) spawning the bundled script: the extension host is Electron, so it needs process.execPath with ELECTRON_RUN_AS_NODE (a first for this repo; today the host only execFiles git and npm), a process per click, and errors mapped from stderr text. Above all, the stale-write guard (M1-AC4) needs a compare-and-swap the script does not have: done outside the script it is a wider read-check-spawn race, and done inside it is a pack payload change, which obliges a whole-pack bump to v58 (.agents/knowledge/architecture/pack-version-is-one-unit.md) and a reinstall prompt in every workspace.
  - (a) costs a second implementation, the dual-implementation pattern this repo already runs for tc-io (validate-tc-parity.test.ts) and plan-review (plan-review-parity.test.ts with fixtures/plan-review-cases.json). Drift is caught by (1) a parity vitest that runs the shipped script on one copy and the TS on another over every real TC and every status different from the file's own, asserting the script refused zero real pairs, and (2) a shared case fixture (packages/board/test/fixtures/tc-status-cases.json) run over both. The pack is not edited, so no bump.
  Shape: a pure edit (text, status, date | null) -> {text, changed} | refusal, identical to the script INCLUDING a same-status call (it re-dates last_run for a run status, as the script does), in a new module packages/board/src/tc-status.ts; plus a file writer with an option that makes requested == current a no-op (the host uses it: a re-pick writes nothing). The writer: same path rule, lstat symlink refusal, its own bounded no-follow reader (inside tc-status.ts), expect check, edit, temp file + chmod, final re-read, rename. Only the non-migrate path is ported.
  Tree-shaking (rule 8): tc-status.ts's top level is limited to literals, regex literals and function declarations (no array spread, no `new Set(ident)`, no `new RegExp`, no top-level calls, no Object.freeze) or marks them /* @__PURE__ */; tc-io.ts, test-cases.ts and board-model.ts are not edited. Rio checked with the payload's own esbuild that such a module adds no bytes; `graph-payload --verify` gates it. If the bytes change anyway, the 57 hash is not rewritten silently (M1-AC11).

  ### Decision: what a dropdown change records
  No evidence. A dropdown pass/fail/blocked writes `last_run: {date: <today UTC>}`, byte-identical to `set-test-status.js <tc> <status> --date <today UTC>` with no --evidence; the panel then shows the date with `no evidence` and a hint says a run pick replaces any earlier evidence link. Why: the contract defines evidence as a repo-relative RUN-file path; a word like "manual" would render as a broken link. The date is UTC like the script's default.

  ### Decision: stale-write protection and refusals (M3 B1/B2 lessons)
  The webview never sends file text. tests:setStatus carries {path, status, base: {status, lastRun}} where base is what the panel rendered. The host re-reads the file, refuses with {ok: false, reason: "stale", current} when status or last_run differ from base, computes the edit from the bytes it just read, writes the temp file (mode kept), re-reads, and renames only if the bytes did not move. The window between that re-read and the rename is the script's own and is accepted; there is no lock file. A stale refusal re-renders on current with an inline role=status notice that stays until the user's next pick. A non-stale refusal (symlink, unparseable, write error) is shown inline the same way; nothing is written and no notification is raised. The dropdown is disabled while a call is in flight.

  ### Decision: legacy TCs (user decision 5)
  A legacy TC with frontmatter is settable: the pick writes status (and last_run) exactly like the script and leaves kind and mission absent. While kind or mission is absent the panel shows `legacy test case: kind and mission not recorded; set-test-status.js <file> --migrate adds them` (panel content, campaign decision 12 of direct-dispatch-process).

  ### Contracts (for T1.2 / T1.3)
  - tests:get {path} -> TestCaseDetail | null: {tc: TestCase, body: {kind: "markdown", text} | {kind: "plain", text} | {kind: "too-large"}, campaignId, missionId | null, mission: {id, title, status} | null (null = no mission matches the folder: "mission M<n> not found"), criteria: [{ac, text | null}] (null = the mission has no such AC), evidence: {path, exists} | null, legacy: boolean (kind or mission absent from the frontmatter), writable: {ok: true} | {ok: false, reason: "no-frontmatter" | "unparseable" | "symlink" | "too-large"}}. null for a path the guard rejects or a file that is gone.
  - tests:setStatus {path, status: draft|ready|pass|fail|blocked, base: {status: draft|ready|pass|fail|blocked|unknown, lastRun | null}} -> {ok: true, changed, tc} | {ok: false, reason: "stale", current: TestCase} | {ok: false, reason: "refused", message}.
  - UI messages: openTestCase {path} (board-relative; sidebar and mission panel), openTestEvidence {path} (the TC's path; the host reads the evidence from the file). openTestFile and openMission are reused.
  - Panel: `export const TEST_CASE_VIEW_TYPE = "octoshell.testCase"`, panel key testCase:<board-relative path>, title `TC-NNN: <title>`; bind {kind: "testCase", id: <path>}.
  - Boundary: src/protocol and src/webview take only types from @octoshell/board (the status vocabulary is a local zod enum).

  ### Out of scope
  Editing the body or any field other than status in the panel; --migrate from the panel; any pack change.

  ## QA verification (qa-engineer, T1.5, 2026-10-06, branch qa/octoshell-0-1-1-m1-t5 from feat/octoshell-0-1-1-m1 0aae9786)

  Verdict: PARTIAL, no product failure. tests/m1: 6 PASS (TC-001, 002, 003, 009, 010, 011), 0 FAIL, 6 BLOCKED (TC-004..TC-008 and TC-012: live Extension Development Host / installed-VSIX halves are manual and pending the user; automated halves of all of them passed). No bug filed. Run file `.octobots/campaigns/octoshell-0-1-1/tests/m1/runs/RUN-2026-10-06-001.md`, evidence `tests/m1/evidence/`, hand-off `tests/m1/manual/F5-checklist.md`. Records: copies of this repo's board (98 real TCs) and solo's uwb board (116 legacy TCs), octobots-0.1.1.vsix built from the branch head (tree equals release commit 9eae7ad8, sha256 f5d05f29c2cec9d4a930cf3aae963d69024dcfdc30ab7745e4ae2b143facdbc2), octobots-0.1.0.vsix rebuilt from ea432393. Solo read only: git status, HEAD and the sha256 manifest of its .octobots identical before and after.

