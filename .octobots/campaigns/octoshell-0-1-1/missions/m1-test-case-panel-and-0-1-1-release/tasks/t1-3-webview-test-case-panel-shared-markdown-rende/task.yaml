name: 'T1.3 - Webview: test-case panel, shared markdown renderer, single click from the sidebar tree'
status: draft
role: js-dev
description: |-
  The test-case panel and the click behaviour. Starts after T1.2 (it consumes the T1.2 contract); M6 B1 is already on the campaign branch (9c7d17af). Scope:
  - Shared renderer: extract notes-block.tsx's ReactMarkdown + remark-gfm + rehype-sanitize setup and MD_COMPONENTS (:15-58) into a new src/webview/markdown.tsx used by BOTH NotesBlock and the new view (one renderer, not a copy; NotesBlock's behaviour unchanged).
  - View: new src/webview/test-case-view.tsx (React + Tailwind theme-token classes only; only type imports from @octoshell/board). Loads tests:get {path}. Header: id, title, the status word + codicon (reuse tests-ui.tsx TestStatusBadge), kind (`none` when null), last run (date with an evidence link posting openTestEvidence {path: <TC path>}; plain text marked `not found` when evidence.exists is false; the date with `no evidence` and no link when last_run has no evidence; `never run` when absent). Status row: the same row as mission-view.tsx:103-113 / task-view.tsx:62 / bug-view.tsx:84 (visible uppercase label Status, the same select classes, aria-label Status); options draft, ready, pass, fail, blocked; `unknown` shown as the current, disabled option when the file has no status; a hint that a pass/fail/blocked pick records today's date and replaces any earlier evidence link. Legacy (decision 5): the dropdown stays enabled and, while detail.legacy, an inline note reads `legacy test case: kind and mission not recorded; set-test-status.js <file> --migrate adds them`. Covered criteria rows: ac id, text, a link posting openMission {id: missionId} (a cancelled mission links too); `not a criterion of <M>` with codicon-warning in warning tone and no link when text is null; `none listed` when covers is empty; `mission M<n> not found` shown once, with no criterion links, when mission is null. Body: markdown through the shared renderer; plain text (pre-wrapped, not rendered) for kind plain; `too large to show; Open source file` for too-large. An Open source file button (posts openTestFile {path}). A pick calls tests:setStatus {path, status, base: {status, lastRun}} with the values it rendered, with the dropdown disabled while the call is in flight; success re-renders with no notice and no notification; {reason: stale} re-renders on current and shows an inline role=status notice that the status changed outside the panel and was not saved, which stays until the user's next pick; {reason: refused} shows its message inline (role=status), nothing else. writable.ok false disables the dropdown and ties the reason to it with aria-describedby (no-frontmatter adds the hint `set-test-status.js <file> --migrate`). Every spine event re-fetches tests:get; null shows `This test case no longer exists` with no dropdown.
  - Wiring: protocol/host-events.ts BindMessage kind (:10) and chat-entry.tsx Bound/resolveBound (:26-44, :35) gain `testCase` (id = board-relative path); protocol/ui-messages.ts openTestCase {path} and openTestEvidence {path}; entity-panel-manager.ts: Kind `testCase`, `export const TEST_CASE_VIEW_TYPE = "octoshell.testCase"` (exported so panel-restore-activation.test.ts collects it), openTestCase(path) (joins under the board with testFileArgFromWebview, guarded by testFileToOpen; one panel per path, reveal on re-open, title `TC-NNN: <title>`), refreshEntity's kind ternary (:172-184) posts a testCase payload, refresh on entities:changed as the other panels do (:295), openTestCase and openTestEvidence actions (evidence via board.testEvidencePath -> editor.openFile); src/extension.ts a serializer for the view type (beside :203-231) and a command octoshell.openTestCase whose argument goes through the same join and guard; package.json activationEvents gains onWebviewPanel:octoshell.testCase; campaigns-tree.ts testCaseItem's command becomes octoshell.openTestCase with TestCase.path; mission-tests.tsx TC rows post openTestCase instead of openTestFile (user decision 4; MissionView/chat-entry pass the new callback). octoshell.openTestFile stays registered and is used by the panel's button.
  Out of scope: editing the body or any non-status field; --migrate; any board or pack change. Downstream: T1.4 (release contents), T1.5 (live F5 QA).
acceptance_criteria:
  - text: 'apps/vscode-extension/test/test-case-view.test.tsx (real-rpc fixture over a copy of the tracked board): the panel for campaigns/direct-dispatch-process/tests/m6/TC-004_sidebar-tests-node-counts.md shows TC-004, its title, a Status row (visible label, select named Status) whose value, status word, codicon, kind and last-run date equal the values read from that file''s frontmatter in the test (never pinned from HEAD), a last-run link posting openTestEvidence with the TC path, a Covered criteria row M6-AC3 with M6''s AC3 text whose link posts openMission with M6''s id, a <table> whose body has 6 rows, Objective and Expected Final State headings and no `covers:` text, and the run-pick hint; Open source file posts openTestFile with the TC path. After a successful pick of pass, the panel shows pass, today''s UTC date with `no evidence` and no link, and no notice; the dropdown is disabled while the call is in flight'
    done: false
  - text: 'same file: picking pass sends tests:setStatus with {path, status: pass, base: {status, lastRun}} equal to what the panel rendered; when the file was changed to fail on disk first, the panel shows fail and the role=status not-saved notice, the file still holds fail, and the notice stays after a later spine event until the next pick; a refused result shows its message inline (role=status) and no notification; a fixture derived from solo''s uwb m1 TC-003 shows unknown as a disabled current option with the dropdown enabled, kind none, never run, M1-AC2 and M1-AC5, the legacy --migrate note, and `not a criterion of M1` for M1-AC99; derived malformed (unparseable frontmatter) shows id from the filename, title from the H1, unknown, none, `none listed` and a disabled dropdown whose aria-describedby names the reason; no-frontmatter shows the whole file as plain text and the --migrate hint; over 4 MiB shows `too large to show; Open source file`; a tests/m9 copy shows `mission M9 not found` once and no criterion links; a cancelled-mission TC (derived from solo uwb m5 TC-001) renders with the dropdown enabled and links posting openMission; after the TC file is deleted and a spine event fires, the panel shows `This test case no longer exists` and no dropdown; a body derived from solo''s uwb m1 TC-006 renders `<id of first SCHEDULED match` literally, and a body with <script> and <img src=x onerror=...> creates no script or img element'
    done: false
  - text: 'apps/vscode-extension/test/test-case-panel.test.ts: openTestCase(path) creates one panel of view type octoshell.testCase titled `TC-004: ...`, a second call reveals it (one createWebviewPanel call); the panel posts a testCase spine event on entities:changed; the serializer adopts a restored panel with state {kind: testCase, id: <path>}; the command octoshell.openTestCase with a `..` path, an absolute path outside the board, a TC symlink resolving outside the board or a non-TC file opens no panel; apps/vscode-extension/test/panel-restore-activation.test.ts passes with TEST_CASE_VIEW_TYPE exported and onWebviewPanel:octoshell.testCase declared'
    done: false
  - text: 'apps/vscode-extension/test/campaigns-tree-tests.test.ts: a TC leaf''s command is octoshell.openTestCase with arguments [TestCase.path] (not octoshell.openTestFile), and M6 B1''s status-coloured Tests node and mission-group icon assertions still pass; apps/vscode-extension/test/mission-tests-panel.test.tsx: clicking a TC row posts openTestCase {path: TestCase.path} (user decision 4) and never openTestFile'
    done: false
  - text: 'apps/vscode-extension/test/notes-block.test.tsx passes unchanged with NotesBlock rendering through the extracted src/webview/markdown.tsx; apps/vscode-extension/test/test-case-view-tokens.test.ts fails on a colour literal (#rgb, #rrggbb, rgb(, rgba(, hsl(, a named colour in a style attribute) in src/webview/test-case-view.tsx or src/webview/markdown.tsx and passes on the shipped files; apps/vscode-extension/test/contract.test.ts lists test-case-view.tsx in its hand-written file list (:28-40) and passes (every method it calls is in the contract)'
    done: false
