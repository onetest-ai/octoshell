notes: |
  ## QA verification

  Reviewer: qa-engineer, 2026-10-06, on c4c4fc51 (PR #175). Verdict: PASS.

  Mapped TCs (tests/m1/README.md map: TC-003 for M1-AC3/AC4, TC-009 for M1-AC7 host side), run as written over a cp -R board copy with OCTOBOTS_BOARD_COPIES (direct vitest, not turbo):
  - TC-003: tests-detail-rpc.test.ts 24/24 pass (detail on real TC-004, legacy/unparseable/no-frontmatter/too-large/m9/cancelled shapes, write parity with set-test-status.js, stale refusal, host no-op, legacy write). PASS.
  - TC-009 (T1.2's host-side share; test-case-panel.test.ts and the openTestCase step belong to T1.3 and do not exist yet): tests-detail-rpc guard cases, test-evidence-guard.test.ts 8/8, open-test-file-webview.test.ts 3/3 green unchanged. PASS for that share.
  - Also green: contract.test.ts 12, conventions.test.ts 7, rpc-dispatcher.test.ts 40.
  TC frontmatter not touched (T1.5).

  Black-box through BoardHost + real dispatcher, on fresh copies (own board and solo):
  - (a) Stale: tests:get on real direct-dispatch-process m6 TC-004 (blocked; base taken from the detail), then the installed set-test-status.js wrote fail; tests:setStatus pass with the old base returned {ok:false, reason:stale, current.status:fail, lastRun 2026-10-05}; bytes unchanged, 0 entities:changed. A re-read base then wrote pass with exactly 1 event.
  - (b) Solo legacy uwb m1 TC-003: legacy true, status unknown, kind null, both ACs with text; pick pass wrote only status and last_run {date: today}; kind and mission stay absent; 1 event.
  - (c) Solo uwb m5 TC-001: mission resolves with status cancelled, M5-AC1 text present, writable ok.
  - (d) Guard: a '..' path, a '..'-escaping path, an absolute outside path, an absolute in-board path, an in-board symlinked TC pointing outside, campaign.yaml, tests README.md and a misplaced TC-*.md all returned null / {ok:false, reason:refused}; tree hash (contents + symlinks) identical before and after; the outside file untouched.

  Gate on c4c4fc51: pnpm build, typecheck, lint, test (board 840, graph 655, extension 1231), coverage all exit 0; graph-payload --verify current (byte-identical). Solo git status, HEAD and .octobots content hash unchanged. PR #175 checks green on the head commit.

  Observation (non-blocking): an absolute path to an in-board TC is refused by design (paths are board-relative).
