name: 'T1.2 - Host: tests:get and tests:setStatus RPCs with the stale-write and evidence guards'
status: done
role: js-dev
description: 'Host side of the test-case panel, no UI. Needs T1.1. (1) Path guard: move testFileToOpen and testFileArgFromWebview unchanged from campaigns-tree.ts (:47-74) into a new VS Code-free host module (e.g. src/host/test-file-guard.ts) and re-export them from campaigns-tree.ts, so board-host.ts can use them without importing vscode; add a pure evidenceFileToOpen(repoRoot, evidence) there (returns the absolute path only when the repo-relative evidence resolves, after realpath, to a regular file inside the workspace folder, the board root''s parent; else null). (2) BoardHost (board-host.ts, next to the tests read API at :110-131): getTestCaseDetail(path), setTestStatus(path, status, base) and testEvidencePath(path). Every path argument is TestCase.path (board-relative), joined under the board root with testFileArgFromWebview and accepted only through testFileToOpen. getTestCaseDetail returns the contract in mission notes § Contracts: tc, body (markdown text after the frontmatter block; the whole file as plain text when no frontmatter block can be found; too-large over MAX_TC_BYTES), campaignId, missionId and mission {id, title, status} | null (the campaign''s mission whose testCoverage(id).mission equals tc.mission; no new board export needed; a cancelled mission still matches), criteria [{ac, text | null}] for tc.covers in order, evidence {path, exists} | null, legacy (kind or mission absent from the frontmatter), writable; or null when the guard rejects the path or the file is gone. setTestStatus calls T1.1''s writeTestCaseStatus with expect = base, skipIfCurrent: true and date = this.now() as UTC YYYY-MM-DD, then reconcile() (one entities:changed) only when the file changed; a stale or refused result, and a same-status no-op, write nothing and emit nothing. testEvidencePath(path) reads last_run.evidence from the TC on disk (never from the webview) and passes it through evidenceFileToOpen. (3) RPC: tests:get {path} and tests:setStatus {path, status: draft|ready|pass|fail|blocked, base: {status: draft|ready|pass|fail|blocked|unknown, lastRun | null}} in protocol/rpc-contract.ts (a local zod enum; protocol takes only types from @octoshell/board) and rpc-dispatcher.ts. (4) Boundary test: strengthen apps/vscode-extension/test/conventions.test.ts (:145-152) so a value import (not `import type`) from @octoshell/board in src/protocol or src/webview fails. Out of scope: the panel, panel manager, UI messages, tree command, webview (T1.3). Downstream: T1.3 (consumes the contract), T1.5.'
acceptance_criteria:
  - text: 'apps/vscode-extension/test/tests-detail-rpc.test.ts, over a copy of the tracked board: tests:get on campaigns/direct-dispatch-process/tests/m6/TC-004_sidebar-tests-node-counts.md returns tc.status, tc.kind, tc.covers and evidence.path equal to the values read from that file''s frontmatter in the test (never constants pinned from HEAD), criteria [{ac M6-AC3, text equal to M6''s third acceptance criterion}], missionId equal to M6''s id, evidence.exists true, writable {ok: true}, legacy false, and a markdown body whose first non-blank line is the `# TC-004` heading (no frontmatter line); for fixtures derived from solo''s uwb m1 TC-003 it returns: the legacy file -> status unknown, kind null, both ACs, legacy true, writable ok; with unparseable frontmatter -> id from the filename, title from the H1, covers [], writable {ok: false, reason: unparseable}; with no frontmatter block -> a plain body holding the whole file, writable no-frontmatter; padded over 4 MiB -> body too-large, writable too-large; copied into tests/m9 -> mission null; a covers id beyond the mission''s AC count -> text null; a TC of a cancelled mission (derived from solo uwb m5 TC-001) -> mission.status cancelled and its criteria texts'
    done: true
  - text: 'same file: tests:setStatus pass with base equal to the file returns {ok: true, changed: true}, leaves the file byte-equal to `set-test-status.js <tc> pass --date <the injected clock''s UTC day>` on a second copy, and emits entities:changed once; ready on a file holding draft equals `set-test-status.js <tc> ready` (no --date); with base.status ready while the file holds fail it returns {ok: false, reason: stale, current.status: fail}, the file''s bytes are unchanged and no event is emitted; re-sending the file''s current status (pass on a pass file) returns {ok: true, changed: false} with bytes and mtime unchanged and no event (the documented host no-op); on the legacy TC-003 fixture a pass writes status and last_run and leaves kind and mission absent'
    done: true
  - text: 'same file: tests:get and tests:setStatus with a path containing `..`, an absolute path, a TC symlink resolving outside the board, a mission.yaml, a tests README.md, and a TC-*.md outside campaigns/<c>/tests/ return null / {ok: false, reason: refused} and leave every file of the scratch repo byte-identical (hashes before and after)'
    done: true
  - text: 'apps/vscode-extension/test/test-evidence-guard.test.ts: evidenceFileToOpen returns the absolute path for a repo-relative regular file inside the workspace (the real RUN-2026-10-06-001.md on the copy) and null for a missing file, a directory, a path with `..`, an absolute path, and a symlink resolving outside the workspace; testEvidencePath reads the evidence from the TC on disk (changing the file changes the answer); the guard module imports nothing from vscode, and campaigns-tree.ts still exports testFileToOpen and testFileArgFromWebview (open-test-file-webview.test.ts green unchanged)'
    done: true
  - text: apps/vscode-extension/test/contract.test.ts gains schema tests (tests:setStatus accepts base.status unknown and rejects status unknown or any non-settable word; tests:get requires a string path), and with test/rpc-dispatcher.test.ts stays green (every RpcMethod has a handler and a schema); apps/vscode-extension/test/conventions.test.ts fails on a value import from @octoshell/board in src/protocol or src/webview and passes on the shipped tree
    done: true
