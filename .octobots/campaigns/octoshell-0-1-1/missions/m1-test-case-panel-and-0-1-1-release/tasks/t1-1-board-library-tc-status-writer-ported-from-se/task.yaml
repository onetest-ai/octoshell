name: 'T1.1 - Board library: TC status writer ported from set-test-status.js, byte parity with the script'
status: draft
role: js-dev
description: 'Port the non-migrate path of the pack''s set-test-status.js (apps/vscode-extension/resources/octobots-pack/skill/mission-planner/scripts/set-test-status.js:100-238) to TypeScript in a NEW module packages/board/src/tc-status.ts, exported from src/index.ts. Two layers: (1) a pure edit, (text, status, date | null) -> {ok: true, text, changed} | {ok: false, reason, message}, identical to the script for every input including a same-status call (which, for pass/fail/blocked, re-dates last_run as the script does): the status line replaced in place or appended; for pass/fail/blocked a `last_run: {date: D}` line replacing any previous last_run entry wholesale, inserted after status; draft/ready leave last_run alone; no evidence is ever written; CRLF/BOM/comments/key order kept; the re-parse-and-compare safety check of :212-227; refusal on no frontmatter or unparseable frontmatter. (2) A file writer, writeTestCaseStatus(boardRoot, relPath, {status, date, expect?, skipIfCurrent?}): the script''s path rule (<campaign>/tests/m<n>/TC-*.md under the board), lstat refusal of a symlinked TC, m<n> or tests folder, its OWN bounded no-follow reader inside tc-status.ts (MAX_TC_BYTES, FIFO refused), the optional `expect: {status, lastRun}` check against the file as just read (mismatch -> {ok: false, reason: "stale", current}), skipIfCurrent (requested == current status -> {ok: true, changed: false}, nothing written; documented as the host''s deviation from the script), the edit, then a temp file in the same folder with the file''s mode, a final re-read (bytes moved -> "stale", temp removed, nothing written), then rename; the temp file is removed on any failure. The window between the final re-read and the rename is the script''s own and accepted. Tree-shaking (campaign rule 8, delta 10): the top level of tc-status.ts holds only literals, regex literals and function declarations (no array spread, no `new Set(ident)`, no `new RegExp`, no top-level calls, no Object.freeze), or marks such expressions /* @__PURE__ */; it may import from tc-io.ts (splitFrontmatter, parseFrontmatter, MAX_TC_BYTES) but tc-io.ts, test-cases.ts and board-model.ts are NOT edited. Do not use rewriteFrontmatter (tc-io.ts:105). Parity runtime: the real-board parity run spawns the script once per (TC, status) pair (about 430+ spawns on CI''s tracked board, more with the solo copy); run them asynchronously with bounded concurrency and give each test an explicit timeout. Out of scope: --migrate, any host/RPC/webview code (T1.2, T1.3), any change to the pack script. Downstream: T1.2 (host write path), T1.3 (the dropdown), T1.5 (parity TCs) - this is the only code that writes a TC file, so a defect here is persisted into users'' boards.'
acceptance_criteria:
  - text: 'packages/board/test/tc-status-parity.test.ts: for every TC-*.md under a tests/m<n>/ folder of each real board (trackedBoardCopies(), plus every board in OCTOBOTS_BOARD_COPIES) and each status s in draft, ready, pass, fail and blocked that differs from the file''s current status, the writer on one copy and the shipped script on a second copy (`node <pack>/skill/mission-planner/scripts/set-test-status.js <tc> <s> --date 2026-10-06` for pass/fail/blocked; `set-test-status.js <tc> <s>` with no --date or --evidence for draft/ready, since the script refuses --date there, :85) yield byte-identical files; the test asserts the script refused ZERO real (TC, status) pairs (a refusal fails the test with the list), no count is hard-coded and at least one TC per board is compared; spawns run with bounded concurrency under an explicit per-test timeout; green with OCTOBOTS_BOARD_COPIES pointing at cp -R copies of octoshell''s and solo''s .octobots'
    done: false
  - text: 'a shared case fixture packages/board/test/fixtures/tc-status-cases.json (like fixtures/plan-review-cases.json) is run by the same parity file over the script and the pure edit, each case with every settable status: the T6.2 review shapes of scripts-cli-scenarios.test.ts:1823-1843 (a nested `status:`, a `status:` inside a block scalar, a comment after status, a quoted "status" key, an anchored status aliased by another key, a flow-mapping frontmatter), a duplicate key, empty frontmatter, comment-only frontmatter, no trailing newline on the last frontmatter line, a list-form last_run, trailing blank and comment lines after last_run, `status:` with no value, CRLF line endings, a leading BOM, a last_run with an extra `note:` key, a block-form last_run, last_run before status, no status key, a quoted status value, no frontmatter, unparseable frontmatter (inputs derived from this repo''s tests/m6/TC-004_sidebar-tests-node-counts.md and solo''s uwb m1 TC-003_set-ranging-mode-persists.md); for each, the pure edit''s bytes equal the script''s, or both refuse, and the fixture records which cases the script refuses so a change in that list fails the test'
    done: false
  - text: 'packages/board/test/tc-status-write.test.ts: a symlinked TC file, m<n> folder or tests folder, a path that is not <campaign>/tests/m<n>/TC-*.md, a file over MAX_TC_BYTES and a FIFO are refused with nothing written; on success the temp file is gone and the file mode is kept; when the rename fails (read-only folder) no temp file is left and the TC is unchanged; with skipIfCurrent, requesting the file''s current status (including pass when the file already holds pass) returns changed: false and leaves bytes and mtime unchanged, and without it the result equals the script''s (pass re-dates last_run); expect {status: ready} against a file holding fail returns reason stale with current.status fail and writes nothing; bytes changed between the temp write and the rename (an injected hook at the final re-read) return stale, write nothing and leave no temp file'
    done: false
  - text: tc-status.ts is exported from packages/board/src/index.ts; git diff shows no change to packages/board/src/tc-io.ts, test-cases.ts or board-model.ts; tc-status.ts's top level holds only literals, regex literals, imports and function declarations (or /* @__PURE__ */-marked expressions); after a root `pnpm build`, `pnpm --filter @octoshell/vscode-extension graph:payload:write` leaves resources/octobots-pack/graph/octograph.mjs and scripts/graph-payload-versions.json unchanged (git diff empty) and `node apps/vscode-extension/scripts/graph-payload.mjs --verify` exits 0, or the task stops and reports to the user instead of rewriting the 57 hash; tc-status.ts line coverage is at least 90% in the board coverage run
    done: false
