  - AC2 MET (release commit). 9eae7ad8 `chore(ext): release 0.1.1`: `git show --stat` lists 1 file, apps/vscode-extension/package.json, 1 insertion and 1 deletion (`"version": "0.1.0"` to `"0.1.1"`); the body lists the changes since 0.1.0 and per-package tests (tokenomics 102, board 840, vscode-extension 1274, graph 655) and coverage; this run's green re-run of lint/build/typecheck/test/coverage reproduced the same counts (coverage board branch reads 84.97 here, 84.98 in the body: rounding).
  - AC3 MET (VSIX). Rebuilt here from the branch head: `pnpm install && pnpm build && pnpm --filter @octoshell/vscode-extension package` exit 0, 73 files, octobots-0.1.1.vsix 768794 bytes, sha256 f5d05f29c2cec9d4a930cf3aae963d69024dcfdc30ab7745e4ae2b143facdbc2; `git status` after packaging shows only .octobots board files; T1.4's pre-built VSIX unzips to an identical tree. TC-012 steps 1-7 pass: `diff -r` of extension/resources/octobots-pack against the 0.1.0 VSIX (rebuilt from ea432393, the original file is absent) is empty (PACK-IDENTICAL), shipped-skills.json.br cmp identical (STORE-IDENTICAL), version 0.1.1, `onWebviewPanel:octoshell.testCase` present, assets only the referenced JS, CSS and codicon font, workflow grep 12 hits all on the allow-list. The builder's own self-check output was not in these notes; this block is the record. Run: `.octobots/campaigns/octoshell-0-1-1/tests/m1/runs/RUN-2026-10-06-001.md` (TC-012).
