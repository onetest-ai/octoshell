    done: false
  - text: octobots-0.1.1.vsix is built by `pnpm --filter @octoshell/vscode-extension package` from a tree whose `git diff <release commit> HEAD -- apps packages` is empty, packaging changes no tracked file (git status shows only .octobots board files), and the builder's self-check of .octobots/campaigns/octoshell-0-1-1/tests/m1/TC-012_release-0-1-1-vsix-verification.md steps 1-7 passes (including extension/resources/octobots-pack and extension/resources/shipped-skills.json.br identical to the 0.1.0 VSIX's); the output is in this task's notes
    done: false
  - text: 'after the user approves installing 0.1.1 into VS Code, packStatus of octoshell''s own checkout stays upToDate: true with no reinstall prompt (the pack is unchanged), recorded in this task''s notes'
    done: false
