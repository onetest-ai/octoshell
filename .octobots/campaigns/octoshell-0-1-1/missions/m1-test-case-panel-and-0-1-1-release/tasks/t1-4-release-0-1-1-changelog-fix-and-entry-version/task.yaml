description: 'Cut 0.1.1 the way M6 T6.6 cut 0.1.0 (.octobots/campaigns/direct-dispatch-process/missions/m6-test-cases-are-first-class-on-the-board/tasks/t6-6-release-0-1-0-and-verify-the-vsix/task.yaml is the model). Needs T1.1-T1.3 merged into feat/octoshell-0-1-1, which already contains M6 B1 (PR #172, 9c7d17af). (1) A docs commit to apps/vscode-extension/CHANGELOG.md: replace the muddled sentence at lines 12-14 ("If you still have such files, they were already migrated away by an earlier version, and a copy in git history is the only way back.") with a conditional one, e.g. "If any release from a192780c through 0.0.51 ran in your workspace, it deleted each workflow.md it found, and git history holds the only copy."; add a `## 0.1.1` entry above 0.1.0: the test-case panel (header, covered criteria, rendered body, Open source file; the dropdown writes status like set-test-status.js and records last_run with the date only, no evidence; it never overwrites a status changed outside the panel; legacy TCs can be set and are pointed at --migrate), a single click on a TC in the sidebar or the mission panel now opens the panel (the raw file is one click away), the status-coloured Tests node and mission-group icons (M6 B1), and that the pack is unchanged at v57 so no reinstall prompt. (2) The standalone release commit `chore(ext): release 0.1.1` changing only apps/vscode-extension/package.json (version 0.1.0 -> 0.1.1); body: changes since 0.1.0, per-package tests passed and coverage from a green re-run. (3) Build the VSIX with `pnpm install && pnpm build && pnpm --filter @octoshell/vscode-extension package` from a tree where `git diff <release commit> HEAD -- apps packages` is empty (a later fix means a rebuild). (4) Self-check it against tests/m1/TC-012_release-0-1-1-vsix-verification.md before handing to QA (T1.5 executes TC-012 black-box and records it). Out of scope: marketplace publishing beyond the existing package-vsix flow; any code change (a failure goes back to the owning task as a board bug); any pack change. Downstream: T1.5, the campaign -> main PR (which carries B1 to main).'
