name: 'B1 - qa-env.test.ts probe-group checks flake on CI: a fixed 200 ms wait races the reaping of the orphaned probe'
status: done
severity: minor
description: 'packages/board/test/qa-env.test.ts (added in direct-dispatch-process M5 T5.4): after qa-env.mjs exits on SIGINT/SIGTERM, the tests at lines ~250-251 and ~273-274 wait a fixed 200 ms and then assert the probe''s process group is gone (expect(() => process.kill(-pid, 0)).toThrow()). On a loaded CI runner the orphaned probe shell can still be an unreaped zombie in that group at 200 ms, so kill(-pid, 0) succeeds and the assertion fails. Seen on the push run 37456867923 of feat/octoshell-0-1-1-m1-t1 (bf77cfa1); the pull_request run on the same SHA passed and a re-run of the failed job passed. Test-only: qa-env.mjs behaved correctly (exit 130/143 asserted first).'
steps_to_reproduce: 'CI push run 37456867923, job ''build'', test ''qa-env.mjs probe (exit 4, command not run) > exits 128+n, not by the default signal disposition, when interrupted right after the probe spawns'': AssertionError expected [Function] to throw an error at line 274.'
expected: 'The group-gone assertions poll (e.g. up to 5 s, every 50 ms) until kill(-pid, 0) throws ESRCH, instead of a fixed 200 ms sleep; both places (the probe-timeout test near line 250 and the post-spawn signal test near line 273). The test still fails if the group genuinely survives (prove by mutation: drop the killProbe call). Loop the file under CPU load 30x with 0 failures.'
actual: Fixed 200 ms wait; intermittent CI failure.
rca: 'Cause: after qa-env.mjs exits on a signal, the two probe-group tests slept a fixed 200 ms and then asserted kill(-pid, 0) throws; on a loaded runner the orphaned probe shell can still be an unreaped zombie in the group, so the assertion fails although qa-env behaved correctly (exit 130/143 was already asserted). Fix (PR #174, fbffad36, test-only): a shared waitForGroupGone(pid, 5000) polls every 50 ms until kill(-pid, 0) throws ESRCH; both tests assert it, keep the marker check, and get an explicit 30 s timeout so a real survivor fails on the assertion, not the vitest timeout. Evidence: mutation (removing killProbe from the early signal handler) turns both tests red (''expected false to be true''); 30 loops of the file under 32 CPU hogs, 0 failures (~8 s per run vs 5.8 s unloaded); board suite 828/828, lint clean, both CI runs on #174 green. Reviewed and landed by the orchestrator (test-only, verified by mutation and load).'
environment: GitHub Actions ubuntu runner; feat/octoshell-0-1-1-m1-t1 bf77cfa1; 2026-10-06
