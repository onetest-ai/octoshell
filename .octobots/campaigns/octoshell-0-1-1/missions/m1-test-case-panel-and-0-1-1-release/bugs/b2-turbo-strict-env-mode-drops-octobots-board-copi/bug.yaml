name: B2 - turbo strict env mode drops OCTOBOTS_BOARD_COPIES, so pnpm test and CI never read the real-board copies
status: done
severity: major
description: 'Found by the T1.2 review. turbo 2.0.6 runs tasks in strict env mode and turbo.json declares no passThroughEnv, so OCTOBOTS_BOARD_COPIES (the direct-dispatch-process Test conventions rule 2 variable that points real-board vitests at copies of solo/octoshell) never reaches vitest under `pnpm test` / `pnpm coverage`. Evidence: with OCTOBOTS_BOARD_COPIES set to a nonexistent path, `pnpm turbo run test` still passed 24/24 while direct vitest failed with ENOENT. So every real-board-copy check run through the root scripts silently fell back to the tracked board only; checks run with direct vitest (most QA runs) were real.'
steps_to_reproduce: OCTOBOTS_BOARD_COPIES=/nonexistent pnpm test -> green; OCTOBOTS_BOARD_COPIES=/nonexistent pnpm --filter @octoshell/board exec vitest run test/plan-review-parity.test.ts -> ENOENT.
expected: turbo.json passes OCTOBOTS_BOARD_COPIES through to test and coverage tasks (globalPassThroughEnv or per-task passThroughEnv), so `OCTOBOTS_BOARD_COPIES=/nonexistent pnpm test` fails the same way direct vitest does; a regression test or script check asserts the variable is declared; CI (unset) behaviour unchanged.
actual: The variable is silently dropped under turbo.
rca: 'Cause: turbo 2.0.6 strict env mode filters undeclared env vars out of task environments; turbo.json declared none, so OCTOBOTS_BOARD_COPIES (and OCTOBOTS_TOKENOMICS_COPY, OCTOBOTS_REAL_CCUSAGE) never reached vitest under pnpm test. Fix (PR #176): turbo.json globalPassThroughEnv lists the three test inputs; the coverage scripts call vitest/pnpm --filter directly and already inherited the env. Evidence: before, OCTOBOTS_BOARD_COPIES=/nonexistent pnpm test passed 6/6 tasks; after, it fails with ENOENT lstat ''/nonexistent'' like direct vitest; with a cp -R copy of solo, pnpm test runs tc-status-parity ''OCTOBOTS_BOARD_COPIES[0]'' (116 TCs, 580 pairs, 0 refusals); guard test conventions.test.ts ''turbo.json env passthrough'' (3 tests) red before, green after; CI unchanged (variable unset) and green. Impact on earlier campaigns: QA runs that used direct vitest did read the copies; any check run only through pnpm test/turbo with copies set silently used the tracked board only. Landed by the orchestrator (config-only, verified red/green).'
environment: turbo 2.0.6, feat/octoshell-0-1-1-m1, 2026-10-06
