notes: |-
  ## User decisions (2026-10-05)

  1. **Workflow support is removed from octoshell ENTIRELY**: pack, board library and extension. Old `workflows/` folders are ignored by the model; validate.js, validateBoard and doctor.js give a non-fatal warning. Files are never touched (no activation-time migration, no auto-delete).
  2. **Tests pairing is a WARNING ONLY.** validate warns when a mission has no linked tests/m<n>/ or has ACs not covered by test cases. It is never an error and never blocks `set-status.js ... done`.
  3. **Plan review is ENFORCED in both the script and the UI.** set-status.js AND the extension's status dropdown (BoardHost.setStatus) refuse to move a mission to `active` until a BA + tech-lead plan-review sign-off is recorded (shape defined in M5 AC1). Override: `--force` on the script, a confirm dialog in the UI. (Refined by decisions 9-11 on 2026-10-05: a legacy heading-only record is accepted with a warning, reviewers are matched by role token, and only moves into `executing` are gated. The script override is `--force=<reason>` and a refusal exits 3.)
  4. **Campaign-level branches get their own campaign-level cost row** in tokenomics, not split across missions. A branch containing the campaign slug without -m<n> (feat/<slug>, chore/<slug>-plan, campaign/<slug>) belongs to the campaign row; an explicit `branches:` declaration on the campaign also counts. The precedence and the row shape are M1-AC5.
  5. **Release is 0.1.0** (extension) with workflow pack v57. Owned by M6-AC8 / T6.6.
  6. **Defaults for the remaining questions:** rename the "Install Workflow Pack" command title to "Install Octobots Pack" (command id kept); test lanes are declared in an `AGENTS.md § Test lanes` section; qa-env.mjs ships as a config-driven DB guard script; mission-input.js is retired.
  7. **2026-10-05: test cases get first-class board representation (M6)**: parsed into a TestCase entity by the board library, shown in the sidebar tree, the mission panel (with AC coverage) and the campaign panel, with QA results written back to each TC's status.
  8. **2026-10-05: doctor.js config-dir advice.** doctor.js stops recommending `CLAUDE_CONFIG_DIR=<repo>/.claude` (the root M1 calls legacy) and treats ~/.claude/projects as the default (M1-AC8).
  9. **2026-10-05: legacy plan-review records are ACCEPTED WITH A WARNING.** A `## Plan review (...)` section that has no column-0 `Reviewers:` or `Verdict:` line counts when its heading names both reviewers, and set-status.js warns that those two lines are missing. Solo's uwb `## Plan review (Alex + Rio, 2026-10-02)` is therefore accepted, not refused. The exact rule is M5-AC1.
  10. **2026-10-05: reviewers are matched by ROLE TOKEN.** A `Reviewers:` line must hold the tokens `ba` and `tech-lead`. The persona names Alex and Rio count only inside a legacy heading (decision 9), never on a `Reviewers:` line. `## Plan review overridden (...)` never counts as a review.
  11. **2026-10-05: only moves INTO `executing` are gated** (`active`, `in progress` and `running` map to it), from any other stored status. Moves to awaiting approval, done, failed, draft or cancelled are never gated, including draft -> done and draft -> failed. executing -> executing is a no-op and is not gated.
  12. **2026-10-05: no new extension messages for warnings.** Workflow-folder, TC-format and tests-pairing warnings appear only in validate.js and doctor.js output: no Problems-panel entry, notification or output-channel line in the extension. The legacy plan-review warning (decision 9) is set-status.js output only. The plan-review confirm dialog on the status dropdown (decision 3) is a different thing and stays, and so does M6's AC coverage view (decision 7), which shows an uncovered AC in warning style inside the mission panel as board content, not as a message.
  13. **2026-10-05: installPack warns before overwriting a locally changed skill.** A pack skill (or a retired one, such as workflow-designer) is locally changed when its SKILL.md `version:` is not an integer (solo's `57-local`) or its bytes match none of the files the pack shipped for that version. Before any write the install asks in a modal (Overwrite / Keep my changes / Cancel). Keep installs everything else and leaves those skills as they are, and the activation prompt stops asking until the pack version or the kept file changes. Owned by M2 (AC9, AC10; T2.5).

  Confirmed defaults (2026-10-05): decision 8 stands (already M1-AC8), and solo's two `57-local` forks (mission-execution, mission-completion-gate) are this campaign's operating manual until M2 ships their upstreamed form.

  ## Branching

  - Campaign branch: `feat/direct-dispatch-process`. Missions merge into it, never straight to main; one campaign -> main PR at the end.
  - Mission branches: `feat/direct-dispatch-process-m<n>`. Task branches: `feat/direct-dispatch-process-m<n>-t<k>`.
  - Branch names drive tokenomics attribution. After M1 ships, the campaign-level branch (`feat/direct-dispatch-process`) lands on this campaign's own campaign row (slug contained, no -m<n>, six missions: M1-AC5 step 6); this campaign dogfoods that.

  ## Order and landing

  M1 (tokenomics + the single 56->57 pack bump; T1.4 lands first inside M1) -> M2 (pack direct dispatch, workflow pack removal) -> M3 (extension + board library drop workflows) -> M4 (tests folder convention, warning-only pairing, TC format contract) -> M5 (plan review enforcement, agent-ops guards, lanes) -> M6 (test cases first-class on the board; needs M3 and M4; ends with the release task T6.6). No VSIX is cut until M6 is done (package-vsix.yml is workflow_dispatch only).

  Release (M6-AC8, T6.6): a standalone commit `chore(ext): release 0.1.0 with workflow pack v57` touching only apps/vscode-extension/package.json, body listing the changes since 0.0.51, per-package verification counts, and the removed commands (octoshell.newWorkflow, deleteWorkflow, openWorkflowById) whose keybindings now report 'command not found'. Verify inside the VSIX before publishing: campaign AC2 grep, the 57 markers, absence of workflow-designer, presence of qa-env.mjs, scan-parked.js, add-tests.js, set-test-status.js and tc-io.mjs. After publishing, re-run "Octobots: Install Octobots Pack" in octoshell's own checkout and in every dev workspace that accepted the install prompt from an M1-M5 build: those hold an intermediate v57-labelled pack, and packStatus compares integers only, so 0.1.0 will not re-prompt them.

  ## Plan review (Alex + Rio, 2026-10-05)

  Reviewers: ba (Alex), tech-lead (Rio)
  Verdict: approved with nits

  Plan by Rio (tech-lead) on 2026-10-05 from the real code (octoshell main d1c83cc, solo chore/tokenomics-collector-home-projects f3a0a8f4). Reviewed against the real code and the real octoshell and solo data. Alex (ba): approve-with-fixes (6 blocking, 14 should-fix, 6 nits). Rio (tech-lead): approve-with-fixes (5 blocking, 10 should-fix, 3 nits). All fixes applied to the board the same day, with validate.js OK on 39 entities. The user answered the five open questions on 2026-10-05 (decisions 9-13). Rio folded them in the same day: M5 AC1/AC2, T5.1/T5.2, M5 TC-001..005 and TC-013; M2 AC9/AC10, T2.5 and M2 TC-013..015; campaign AC1, AC2 and AC5; M6 AC8 and TC-011. This record has the strict shape of M5-AC1 (column-0 Reviewers: with ba and tech-lead, Verdict: approved with nits), so it satisfies the final rule with no legacy warning (checked with the rule spike on 2026-10-05).

  ## Real-data notes for QA

  - Workflow folders: 5 in octoshell (octograph m3..m7 workflows/build-and-gate), 6 in solo (sensor-assignment-uplift m2 workflows/m2-execution has runs.jsonl; five session-replay-track-store-and-read-api missions). 0 documents entries point into a workflows/ folder in either board. Neither board has a workflow.json, so any workflow.json case is UNREACHABLE on real data.
  - runs.json shape (solo .octobots/tokenomics/runs.json): rows identify themselves by work_item_ref (`<campaign>/<Mn>`), work_item_level (always "story" today), parent_ref (the campaign) and _octobots.{mission_id, campaign, branches}; there is no `campaign` or `mission` field. `unattributed` is a bucket object {segments, turns, branches[], tokens, cost_api_equivalent_usd}, not an array (490 segments today). Segments in raw/segments.jsonl carry segment_id, session_id, branch, turns.
  - Campaign-row records (2026-10-05): feat/edge-ops-ui (28 segments; edge-ops-ui has 10 missions) and campaign/emulator-arena-loop (1; emulator-arena-loop has 7 missions) are unattributed today and contain their campaign slug. chore/uwb-ranging-plan (5) does not contain its slug and needs a declared campaign tokenomics.branches. campaign/sensor-assignment-uplift (7) is NOT unattributed: sensor-assignment-uplift M1 declares it in tokenomics.branches, so it stays on that mission row. No real branch matches more than one campaign slug. uwb has mission rows M1-M4 and M6 only (M5 is cancelled, no row).
  - Transcripts: ~/.claude/projects/-Users-arozumenko-Development-auqanautica holds 3 top-level sessions (117 jsonl incl. subagents): 011deac1 (the live planning session, still growing), 138ca3b0 and 39d8025a, all home-only. Solo's repo-local <repo>/.claude/projects/<slug> holds 6 other sessions (276MB) that today's extension already reads, so a non-zero solo report alone proves nothing. Octoshell's repo-local root also holds other projects' slug dirs (-Users-arozumenko-Development-analysta, -private-tmp, ...): the record that proves only the own slug is read. In a worktree, the collector reads the legacy root of the MAIN checkout, never the worktree's.
  - solo uwb: m1 has 11 ACs and neither its README map nor any TC frontmatter covers M1-AC11; m2 has 10 ACs and M2-AC10 is covered by neither; m6 has no README and no TCs. uwb m3's README names M4-AC6 (another mission's AC id) in its assumptions prose. uwb TC files use legacy frontmatter (`requirements:`, `type:`, no `status`/`kind`/`mission`); e.g. m1 TC-003_set-ranging-mode-persists.md has `requirements: [M1-AC2, M1-AC5]`.
  - Parked tests: octoshell has exactly 1 (packages/graph/test/vault-calibration.test.ts:10 describe.skipIf, allowed). Solo edgeserver/tests has 0 today; the real history record is `git -C $SOLO archive f2e7812d^ edgeserver/tests` -> test_m6_solve_over_the_wire_e2e.py:474 `pytest.xfail(` (with a reason string). packages/graph/bin/octograph.mjs:30 `process.exit(` is the false-positive trap for a naive `xit(` pattern.
  - Skill forks (2026-10-05, sha256 against `git show 800c62c^:` of the pack): solo's mission-planner, knowledge-explorer and workflow-designer (`version: 56`) are byte-identical to the shipped v56 files, and mission-execution and mission-completion-gate are `version: 57-local`. Octoshell's own .claude/skills (v56) are identical to the shipped v56 files. Git history recovers exactly one SKILL.md per pack version for every version from 18 to 56, so the shipped-skill hash table can be backfilled.
  - UI cases cannot be driven by Playwright MCP (VS Code is Electron; no @vscode/test-electron harness): they are unit tests over the real board copies plus manual Extension Development Host (F5) sessions with screenshots, recorded as manual.

  ## Test conventions (every TC and QA task)

  1. A TC that runs a vitest suite runs `pnpm --filter <pkg> exec vitest run <package-relative path> --reporter=verbose` and expects at least 1 test passed in that file; the owning task's AC names the file (repo-relative). `pnpm --filter <pkg> test -- <name>` is never used: the extension's `--passWithNoTests` exits 0 when no file matches.
  2. Vitests that need real boards read `OCTOBOTS_BOARD_COPIES` (colon-separated `.octobots` directories). When it is unset (CI), they copy the repo's own `.octobots/` into a temp dir, so they still run real data and still pass at least one test. QA points it at `cp -R` copies of solo and octoshell.
  3. QA harnesses are committed plain-node scripts under `apps/vscode-extension/scripts/qa/`, each owned by a task and smoke-tested by a vitest: tokenomics-report.mjs (T1.2), install-pack.mjs (T2.3), dump-ids.mjs (T3.3), dump-tests.mjs (T6.1). There is no `.qa/` directory.
  4. Result words map to TC status: PASS -> pass, FAIL -> fail, BLOCKED -> blocked, UNREACHABLE -> blocked with the reason in the RUN file. A manual (F5) execution is noted as manual in the RUN file; its status is still pass, fail or blocked. (M4's TC format contract.)
  5. Every tokenomics command passes `--project-dir`: agent shells reset the cwd between calls, and a bare rollup.mjs writes octoshell's own runs.json. Each collect run that is compared starts from an empty raw/segments.jsonl (collect.mjs merges into the existing file).
  6. TC shell is portable (BSD/macOS): awk, not GNU sed extensions. The body of a TC without its frontmatter is `awk 'c>=2{print} /^---$/{c++}' <file>`.
  7. set-status.js is `set-status.js <parent-dir> "<exact title>" <state>`; for a mission the parent is the campaign dir. doctor.js --json prints `{root, packVersion, findings:[{level, area, msg, fix}]}`. Once M5 lands, moving a mission into executing without a plan review needs `--force=<reason>` (accepted in any argv position), and a refusal exits 3.
  8. Every task that changes packages/board (T1.3, T3.3, T4.2, T5.2, T6.1): after a root `pnpm build`, run `pnpm --filter @octoshell/vscode-extension graph:payload:write`, and if the bytes changed, rewrite the 57 hash in apps/vscode-extension/scripts/graph-payload-versions.json as a visible diff line in the same PR.
