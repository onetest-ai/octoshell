name: Direct dispatch process
status: draft
target: apps/vscode-extension/resources/octobots-pack v57 + extension 0.1.0
description: Ship the process solo proved on the uwb-ranging campaign as the product default. Missions run by orchestrator-dispatched sub-agents; workflow support is removed entirely (pack, board library, extension); two declared test lanes and no parked tests; every mission paired with functional test cases that the gate runs live against pre-existing data, and those test cases are first-class on the board; a BA + tech-lead plan review is enforced before build (script and UI); generalised agent-ops guards; a pack update that reconciles locally changed skills with an agent (the octobots-doctor skill) instead of overwriting them; a tokenomics collector that reads where Claude Code actually writes transcripts and gives campaign-level branches their own cost row.
