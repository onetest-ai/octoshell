  ## Pending user confirmation (decision-13 recheck, 2026-10-05)

  Applied provisionally with the recommended answer; each can flip if the user disagrees, and the board text that changes is named.
  - Q1: while an escalation is open, the whole skill waits (no partial install). M7-AC7, AC8, TC-013 step 3, TC-015.
  - Q2: the policy-conflict list is model or role; review or fix round limits; coverage threshold; what blocks a merge; who may merge or approve, and into which branch; actions that need the user's OK first (deleting, pushing, migrating or seeding a database, anything with an external effect); a safety guard; and 'when unsure whether a difference is policy, escalate'. Lane commands made concrete for the project are not a conflict. M7-AC7, T7.6.
