  - text: 'Given the shipped VSIX, when its extension/ tree and pack are grepped for `Workflow(`, workflow.js, add-workflow, sync-meta, add-run, mission-input, workflow-designer and octoshell.newWorkflow, then the only hits are: the validate/doctor ''no longer read'' warning text; the legacy-folder paragraph in the skills; tokenomics'' wf_ transcript reader; the installer''s RETIRED_SKILLS/RETIRED_FILES lists and its shipped-skill hash table (src/host/shipped-skill-hashes.json, whose workflow-designer entries let installPack tell a locally changed retired skill from a shipped one; M2-AC9) compiled into dist/extension.js; and the disposing `octoshell.workflow` panel serializer (verified by M6-AC8 / T6.6)'
