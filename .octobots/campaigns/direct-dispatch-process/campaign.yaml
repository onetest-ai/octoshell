notes: |-
  ## User decisions (2026-10-05)

  1. **Workflow support is removed from octoshell ENTIRELY**: pack, board library and extension. Old `workflows/` folders are ignored by the model; validate.js, validateBoard and doctor.js give a non-fatal warning. Files are never touched (no activation-time migration, no auto-delete). (Refined by 13(d): an agent running octobots-doctor may remove one folder after the user says yes to that folder.)
  2. **Tests pairing is a WARNING ONLY.** validate warns when a mission has no linked tests/m<n>/ or has ACs not covered by test cases. It is never an error and never blocks `set-status.js ... done`.
  3. **Plan review is ENFORCED in both the script and the UI.** set-status.js AND the extension's status dropdown (BoardHost.setStatus) refuse to move a mission to `active` until a BA + tech-lead plan-review sign-off is recorded (shape defined in M5 AC1). Override: `--force` on the script, a confirm dialog in the UI. (Refined by decisions 9-11 on 2026-10-05: a legacy heading-only record is accepted with a warning, reviewers are matched by role token, and only moves into `executing` are gated. The script override is `--force=<reason>` and a refusal exits 3.)
  4. **Campaign-level branches get their own campaign-level cost row** in tokenomics, not split across missions. A branch containing the campaign slug without -m<n> (feat/<slug>, chore/<slug>-plan, campaign/<slug>) belongs to the campaign row; an explicit `branches:` declaration on the campaign also counts. The precedence and the row shape are M1-AC5.
  5. **Release is 0.1.0** (extension) with workflow pack v57. Owned by M6-AC8 / T6.6.
  6. **Defaults for the remaining questions:** rename the "Install Workflow Pack" command title to "Install Octobots Pack" (command id kept); test lanes are declared in an `AGENTS.md § Test lanes` section; qa-env.mjs ships as a config-driven DB guard script; mission-input.js is retired.
  7. **2026-10-05: test cases get first-class board representation (M6)**: parsed into a TestCase entity by the board library, shown in the sidebar tree, the mission panel (with AC coverage) and the campaign panel, with QA results written back to each TC's status.
  8. **2026-10-05: doctor.js config-dir advice.** doctor.js stops recommending `CLAUDE_CONFIG_DIR=<repo>/.claude` (the root M1 calls legacy) and treats ~/.claude/projects as the default (M1-AC8).
  9. **2026-10-05: legacy plan-review records are ACCEPTED WITH A WARNING.** A `## Plan review (...)` section that has no column-0 `Reviewers:` or `Verdict:` line counts when its heading names both reviewers, and set-status.js warns that those two lines are missing. Solo's uwb `## Plan review (Alex + Rio, 2026-10-02)` is therefore accepted, not refused. The exact rule is M5-AC1.
  10. **2026-10-05: reviewers are matched by ROLE TOKEN.** A `Reviewers:` line must hold the tokens `ba` and `tech-lead`. The persona names Alex and Rio count only inside a legacy heading (decision 9), never on a `Reviewers:` line. `## Plan review overridden (...)` never counts as a review.
  11. **2026-10-05: only moves INTO `executing` are gated** (`active`, `in progress` and `running` map to it), from any other stored status. Moves to awaiting approval, done, failed, draft or cancelled are never gated, including draft -> done and draft -> failed. executing -> executing is a no-op and is not gated.
  12. **2026-10-05: no new extension messages for warnings.** Workflow-folder, TC-format and tests-pairing warnings appear only in validate.js and doctor.js output: no Problems-panel entry, notification or output-channel line in the extension. The legacy plan-review warning (decision 9) is set-status.js output only. The plan-review confirm dialog on the status dropdown (decision 3) is a different thing and stays, and so does M6's AC coverage view (decision 7), which shows an uncovered AC in warning style inside the mission panel as board content, not as a message.
  13. **2026-10-05, revised the same day: a locally changed pack skill is RECONCILED BY AN AGENT, not just overwritten or kept.** Locally forked skills are a valid practice (solo's 57-local forks delivered a campaign), so a pack update merges a deviation instead of picking a side. (a) Detection: a pack or retired skill is deviated when its SKILL.md matches no hash in the shipped-skill store for its version, or its version label is not a pack version; `<N>+local` marks a skill already reconciled against v<N> and counts as up to date while N is the pack version. (b) Only SKILL.md is protected; the rest of a skill's directory always installs. The install asks Reconcile (default) / Overwrite / Keep mine, applies Overwrite and Keep at once, and for Reconcile stages base.md, local.md, upstream.md and RECONCILE.md under `.octobots/pack-updates/v<N>/<skill>/`, leaves the live skill untouched and writes a pending record. The extension never starts an agent and never copies a prompt. A non-interactive install records Reconcile. (c) The pack's SessionStart hook (primer.mjs) tells the next agent session, in one line, to run the `octobots-doctor` skill while a primer finding exists (pending reconciles first, then leftover workflows/ folders, the legacy config dir and, from M5, missing test lanes; tests-pairing and legacy plan-review are acted on from validate.js / set-status.js output instead), skipping findings the user acknowledged; doctor.js and validate.js list pending reconciles. The decision logs are committed; the staged inputs are not. (d) `octobots-doctor` is the agent's manual for pack and board health: its main duty is the 3-way merge with a decision log, policy conflicts escalated to the user (the whole skill waits for the answer: confirmed by the user 2026-10-05, decision-13 recheck Q1), the `<N>+local` marker and clearing the pending record; it also handles leftover workflows/ folders (removed only with the user's OK) and the config-dir advice, and M4/M5 extend it for tests pairing, lanes and legacy plan-review records. (e) Real-data cases on copies of solo's two forks, including one escalated conflict. Owned by M7 (AC1-AC8). The first version of this decision (a warn-first Overwrite / Keep my changes modal, M2 AC9/AC10) was superseded the same day.

  Confirmed defaults (2026-10-05): decision 8 stands (already M1-AC8), and solo's two `57-local` forks (mission-execution, mission-completion-gate) are this campaign's operating manual until M2 ships their upstreamed form.

  ## Branching

  - Campaign branch: `feat/direct-dispatch-process`. Missions merge into it, never straight to main; one campaign -> main PR at the end.
  - Mission branches: `feat/direct-dispatch-process-m<n>`. Task branches: `feat/direct-dispatch-process-m<n>-t<k>`.
  - Branch names drive tokenomics attribution. After M1 ships, the campaign-level branch (`feat/direct-dispatch-process`) lands on this campaign's own campaign row (slug contained, no -m<n>, seven missions: M1-AC5 step 6); this campaign dogfoods that.

  ## Order and landing

  M1 (tokenomics + the single 56->57 pack bump; T1.4 lands first inside M1) -> M2 (pack direct dispatch, workflow pack removal) -> M7 (pack updates reconcile locally changed skills; the octobots-doctor skill; needs M2's retire lists, harness, validate/doctor passes and upstreamed skills) -> M3 (extension + board library drop workflows) -> M4 (tests folder convention, warning-only pairing, TC format contract) -> M5 (plan review enforcement, agent-ops guards, lanes) -> M6 (test cases first-class on the board; needs M3 and M4; ends with the release task T6.6, which also needs M7). M7 is numbered 7 because it was added after M3-M6 were planned; it runs second-to-third, and M4 and M5 extend the octobots-doctor skill it ships. octobots-doctor is v57 payload under the same single bump: no task bumps the pack again. No VSIX is cut until M6 is done (package-vsix.yml is workflow_dispatch only).

  Release (M6-AC8, T6.6): a standalone commit `chore(ext): release 0.1.0 with workflow pack v57` touching only apps/vscode-extension/package.json, body listing the changes since 0.0.51, per-package verification counts, and the removed commands (octoshell.newWorkflow, deleteWorkflow, openWorkflowById) whose keybindings now report 'command not found'. Verify inside the VSIX before publishing: campaign AC2 grep, the 57 markers, absence of workflow-designer, presence of qa-env.mjs, scan-parked.js, add-tests.js, set-test-status.js and tc-io.mjs. After publishing, re-run "Octobots: Install Octobots Pack" in octoshell's own checkout and in every dev workspace that accepted the install prompt from an M1-M5 or M7 build: those hold an intermediate v57-labelled pack, and packStatus compares integers only, so 0.1.0 will not re-prompt them. A skill reconciled to `57+local` against an intermediate build is not re-staged by that re-run either (57+local counts as current for v57), so never install a dev build into solo: solo's forks are reconciled once, against 0.1.0.

