  ## Rule 9 addendum (T7.1, 2026-10-05)

  The shipped-skill store (apps/vscode-extension/resources/shipped-skills.json.br) is binary (`-text`). When two branches both ran `shipped-skills.mjs --write`, resolve a merge conflict by taking either side and re-running `--write` on the merged tree (append-only, reads git history), never by hand. CI's `pnpm build` runs `--verify`, so a SKILL.md change without `--write` fails CI. A local `pnpm package` bypasses build (T6.6 guards it).

