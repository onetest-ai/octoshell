  - runs.json shape (solo .octobots/tokenomics/runs.json): rows identify themselves by work_item_ref (`<campaign>/<Mn>`), work_item_level (always "story" today), parent_ref (the campaign) and _octobots.{mission_id, campaign, branches}; there is no `campaign` or `mission` field. `unattributed` is a bucket object {segments, turns, branches[], tokens, cost_api_equivalent_usd}, not an array (490 segments today). Segments in raw/segments.jsonl carry segment_id, session_id, branch, turns.
