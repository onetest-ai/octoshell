name: M6 - Test cases are first-class on the board
status: done
description: Test cases become a board concept, not just files. The board library parses .octobots/campaigns/<c>/tests/m<n>/TC-*.md into a TestCase entity per M4's TC format contract (frontmatter id, title, mission, covers, kind, status, optional last_run). The extension shows a Tests node per campaign grouped by mission with status counts, a Tests section and AC coverage view on the mission panel, and a test summary on the campaign panel (uncovered ACs highlighted in warning style). QA writes results back to each TC's status through set-test-status.js, so the board reflects the run. Legacy TC files without the new frontmatter still list, as status `unknown`, with a one-line migrate suggestion. Ends with the 0.1.0 release (T6.6). Depends on M3 (workflow removal) and M4 (tests folder convention, add-tests.js, TC format contract, tc-io.mjs); the release (T6.6) also needs M7 (the reconcile installer and octobots-doctor ship in the same VSIX).
acceptance_criteria:
  - text: '@octoshell/board parses .octobots/campaigns/<c>/tests/m<n>/TC-*.md into TestCase { id, title, mission, covers, kind, status, lastRun?, path } per M4''s TC format contract (status draft|ready|pass|fail|blocked, `unknown` when absent; lastRun from last_run {date, evidence}); only TC-*.md files are parsed (README.md, runs/, evidence/ are not); exposes listTestCases(campaign[, mission]) and per-mission AC coverage computed from frontmatter covers (or requirements); the YAML entity model and ids are unchanged'
    done: true
  - text: A malformed TC (unparseable frontmatter, unknown status or kind, id not matching the filename) is reported by validate (validateBoard and validate.js) as a warning, never an error, and is still listed; a legacy TC with no status/kind/mission frontmatter (solo's uwb campaign) lists with status `unknown`, accepts `requirements` as the alias of `covers`, derives mission from the m<n> folder, and gets a one-line migrate suggestion naming set-test-status.js --migrate
    done: true
  - text: The extension sidebar shows a `Tests` node under each campaign (when it has TCs), grouped by mission, each group labelled with counts by status (e.g. `m2 · 32 · 30✓ 1✗ 1 blocked`); expanding lists the TCs with a status icon; clicking a TC opens its file
    done: false
  - text: The mission panel has a Tests section listing the mission's TCs with status, and an AC coverage view mapping each mission AC to its covering TCs, with uncovered ACs highlighted in warning style (never error style); a mission with no tests shows an empty state with the add-tests.js hint
    done: false
  - text: 'The campaign panel shows a test summary across all missions: totals by status (incl. unknown) and the count of uncovered ACs, with each mission''s row linking to its mission panel'
    done: false
  - text: '`set-test-status.js <tc-file> <status> [--evidence <path>] [--date <YYYY-MM-DD>]` (status: draft|ready|pass|fail|blocked) updates only the frontmatter status and last_run {date, evidence} (body byte-identical), is idempotent, and exits 2 on an invalid status (including `unknown`) or a non-TC path; `set-test-status.js <tc-file> --migrate [<status>]` takes no status by default, adds the missing frontmatter to a legacy file (id from the filename, title from the H1, mission from the folder, covers from requirements) and sets status `unknown` unless a status is given, body byte-identical; the gate''s QA phase and the last QA task skill text call it for every TC they run, mapping PASS -> pass, FAIL -> fail, BLOCKED and UNREACHABLE -> blocked; the extension picks the write up through the watcher''s normal debounced rebuild (M4-AC6) with no reload loop'
    done: true
  - text: pnpm lint/build/typecheck/test/coverage are green and coverage:pack passes; graph payload regenerated with the 57 hash rewritten in a visible diff line; pack validate.js and packages/board validate.ts emit identical TC messages (parity test); the extension gains no runtime dependency
    done: true
  - text: 'Given the 0.1.0 VSIX built from feat/direct-dispatch-process after T6.1-T6.5 (release commit `chore(ext): release 0.1.0 with workflow pack v57`, touching only apps/vscode-extension/package.json): grepping its extension/ tree for `Workflow(`, workflow.js, add-workflow, sync-meta, add-run, mission-input, workflow-designer and octoshell.newWorkflow hits only the validate/doctor ''no longer read'' text, the legacy-folder paragraph, tokenomics'' wf_ reader, the installer''s RETIRED_SKILLS/RETIRED_FILES lists, extension/resources/shipped-skills.json.br (the shipped-skill store) and the disposing octoshell.workflow serializer; the mission-execution SKILL.md section headed `## No \`Workflow\` tool, no \`workflow.js\`` (its heading and the lines in it that name workflow.js); the release notes extension/changelog.md naming the removed command octoshell.newWorkflow; it contains qa-env.mjs, scan-parked.js, add-tests.js, set-test-status.js, tc-io.mjs, skill/octobots-doctor/SKILL.md, pack-reconcile.mjs and resources/shipped-skills.json.br, and every pack marker reads 57; installing its pack into a copy of solo''s .claude with the default Reconcile stages exactly mission-execution and mission-completion-gate (base source workspace-git, v56) and leaves them byte-identical, and with Overwrite (`--local-changes=overwrite`; M7-AC3) removes workflow-designer and the 7 retired scripts, keeps create-team.js, and gives packStatus upToDate: true with no deviations; one fresh agent running octobots-doctor on a further git copy of solo staged by that pack reconciles both forks to `57+local` with the dispatch, lane, no-xfail and macOS-timeout anchors kept, the § Dispatch rules numbered without duplicates and no rule stated twice (the 0.1.0 text includes M5''s dispatch rules, which overlap solo''s), an ESCALATED entry being a BLOCKED (on the user''s answer) only when its two sides really differ in `diff base.md upstream.md` and a FAIL otherwise; validate.js reports no tests-pairing warning on any of this campaign''s seven missions; scan-parked.js on octoshell exits 0 with 0 unsigned hits; pnpm lint/build/typecheck/test/coverage are green'
