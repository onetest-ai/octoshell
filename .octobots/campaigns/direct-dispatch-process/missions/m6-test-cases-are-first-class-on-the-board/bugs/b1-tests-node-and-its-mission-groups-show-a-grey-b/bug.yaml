name: B1 - Tests node and its mission groups show a grey beaker instead of a status colour
status: done
severity: minor
description: Reported by the user from the installed 0.1.0 extension. In the sidebar, the campaign's `Tests` node and every per-mission group (e.g. `m1 · 11 · 11✓`, `m3 · 10 · 8✓ 2 blocked`) show a plain grey beaker (campaigns-tree.ts:142 and :152, `new vscode.ThemeIcon("beaker")` with no colour). Only the TC leaves carry a status colour, so at a glance an all-passing group and a group with blocked tests look identical.
steps_to_reproduce: Install octobots-0.1.0.vsix, open octoshell, expand the direct-dispatch-process campaign and its Tests node.
expected: 'The Tests node and each mission group carry a status-coloured icon from the worst status inside them, using VS Code theme colours only (no hardcoded colours): any fail -> failed/red (testing.iconFailed); else any blocked -> warning/orange; else all pass -> passed/green (testing.iconPassed); else (draft/ready/unknown only, or a mix without fail/blocked) -> neutral. The leaves keep their current icons. The label and tooltip stay as they are. This is board content (an icon), not a new warning message, so campaign decision 12 is respected.'
actual: Grey beaker on the Tests node and every group, regardless of status.
rca: 'Root cause: CampaignsTree built the Tests node and every mission group with a colourless ThemeIcon("beaker"), so the icon carried no status. Fix: aggregateStatus(counts) in src/protocol/test-status.ts (fail > blocked > all-pass > neutral) drives a theme-coloured beaker (testing.iconFailed / list.warningForeground / testing.iconPassed / plain); label and tooltip unchanged. Deviation from the bug''s expected ("leaves keep their current icons"): blocked LEAVES moved from testing.iconSkipped (grey) to list.warningForeground so a blocked leaf and a blocked group match, per the user''s "blocked should be orange". QA: precedence mutation (blocked before fail) turns 2 tests red; real main board renders m1/m2/m4 green, m3/m5/m6/m7 and the Tests node orange; build, typecheck, lint, test and PR #172 checks all green.'
environment: octobots 0.1.0 (main e9921532), VS Code, 2026-10-06
