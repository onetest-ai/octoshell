name: T6.6 - Release 0.1.0 and verify the VSIX
status: done
description: 'Runs after T6.5 (the release is cut from the QA-passed tree). Scope: a standalone commit `chore(ext): release 0.1.0 with workflow pack v57` that changes only apps/vscode-extension/package.json (version 0.1.0); its body lists the changes since 0.0.51, per-package verification counts (tests passed per package, coverage numbers) and the removed commands octoshell.newWorkflow, octoshell.deleteWorkflow and octoshell.openWorkflowById, whose keybindings now report ''command not found''. Build the VSIX with apps/vscode-extension/scripts/package-vsix.mjs and verify it per mission AC8 via tests/m6/TC-011_release-vsix-verification.md, executed black-box by a qa-engineer dispatch and recorded with set-test-status.js. After publishing, re-run ''Octobots: Install Octobots Pack'' in octoshell''s own checkout and in every dev workspace that accepted an install prompt from an M1-M5 build (packStatus compares integers only, so 0.1.0 will not re-prompt a workspace already labelled 57). Out of scope: publishing to the marketplace beyond the existing package-vsix flow; any code change (a failure goes back to the owning task as a board bug). Downstream: the campaign -> main PR; campaign AC1, AC2, AC4, AC7.'
acceptance_criteria:
  - text: 'a standalone commit `chore(ext): release 0.1.0 with workflow pack v57` changes only apps/vscode-extension/package.json (version 0.1.0), and its body lists the changes since 0.0.51, per-package verification counts and the three removed commands with the ''command not found'' keybinding note'
    done: true
  - text: tests/m6/TC-011_release-vsix-verification.md is executed against the VSIX built from that commit and records status pass with last_run pointing at its RUN file (mission AC8)
    done: true
  - text: 'after publishing, ''Octobots: Install Octobots Pack'' has been re-run in octoshell''s own checkout and in each dev workspace that held an intermediate v57 install; each is listed in this task''s notes with packStatus upToDate: true'
    done: true
  - text: The campaign-AC2 VSIX grep allowlist explicitly names mission-execution/SKILL.md's heading '## No `Workflow` tool, no `workflow.js`' (or the heading is reworded and skill-conventions.test.ts updated in the same PR) (input from the M2 T2.3 review)
    done: true
  - text: The VSIX is built so that scripts/package-vsix.mjs:38-44 (which runs both update-prices.mjs scripts) leaves tracked files unchanged, or the refreshed prices are committed deliberately in their own commit before the release commit; and the package path runs shipped-skills.mjs --verify (package-vsix.mjs bypasses the build script today) (input from the T7.1 review)
    done: true
  - text: The release verification asserts the VSIX contains extension/resources/shipped-skills.json.br and that it decompresses and passes shipped-skills.mjs --verify against the packaged pack (input from the T7.2 review)
    done: true
  - text: 'The VSIX is packaged from a clean webview build: media/assets holds only the files media/index.html references plus committed assets (vite emptyOutDir:false otherwise leaves stale hashed bundles, e.g. an older one still containing workflow-diagram code, which a working-copy package would ship and which the campaign-AC2 grep would hit); proven by listing the VSIX''s extension/media/assets (input from the T3.1 review)'
    done: true
  - text: 'The 0.1.0 release notes state that 0.0.51 (and earlier, since a192780c) deleted any legacy workflows/<slug>/workflow.md on every activation (migrateLegacyWorkflows: runs.jsonl derived from its ## Runs section, then the file permanently removed), and that 0.1.0 no longer touches workflows/ at all (input from the T3.2 review)'
    done: true
