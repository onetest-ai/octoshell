notes: |-
  ## QA verification

  2026-10-06, qa-engineer, black-box. Run file: `.octobots/campaigns/direct-dispatch-process/tests/m6/runs/RUN-2026-10-06-002.md`; evidence `tests/m6/evidence/T66-*`.

  TC-011 PASS (set-test-status.js, last_run -> RUN-2026-10-06-002). The VSIX was rebuilt from release commit ea432393 (`pnpm install && pnpm build && pnpm --filter @octoshell/vscode-extension package`): octobots-0.1.0.vsix, 760855 bytes, no tracked file changed by packaging. Solo was read only (git status, HEAD and the 3242-file sha256 manifest of .claude + .octobots identical before and after).

  - AC1 PASS: the release commit changes only apps/vscode-extension/package.json (0.1.0); the body lists the changes since 0.0.51, 102/800/1176/655 tests passed (re-run green) and the three removed commands with the 'command not found' note.
  - AC2 PASS: TC-011 executed against that VSIX, status pass, last_run -> RUN-2026-10-06-002.
  - AC3 NOT RUN, pending the user: re-installing the pack in octoshell's own checkout and the dev workspaces is not part of QA.
  - AC4 PASS: the allow-list names the `## No Workflow tool, no workflow.js` section; its heading and the lines naming workflow.js (3 hits) classify against it, with the changelog's `octoshell.newWorkflow` line.
  - AC5 PASS: package-steps.mjs runs graph-payload --verify and shipped-skills --verify (log: 'shipped-skills store is current.'); git status after packaging shows only .octobots board files.
  - AC6 PASS: extension/resources/shipped-skills.json.br is in the VSIX; `shipped-skills.mjs --verify` against the PACKAGED pack exits 0 (a tampered copy exits 1); the 5 packaged SKILL.md bodies match the store's v57 entries.
  - AC7 PASS: extension/media/assets holds index-CkgWM0sJ.css and index-D4Ct9_oO.js (referenced by index.html) and codicon-B16ygVZF.ttf (referenced by the CSS); no stale bundle.
  - AC8 PASS: CHANGELOG states 0.0.51 and earlier deleted legacy workflows/<slug>/workflow.md on every activation and 0.1.0 no longer touches workflows/.

  Step 5 note for the user: the micro-test agent escalated two real two-sided policy conflicts (mission-execution's land-step full-suite rule; the completion gate's green rule and parked scan). Both live forks stay 57-local until you answer. That is correct behaviour (M7 ruling 2026-10-05), not a defect; it also means the TC's `57+local` was not reached in the micro-test.

  Status stays `executing` because AC3 is the user's.

  ## AC3: pack re-install (orchestrator, 2026-10-06)

  The user approved installing the 0.1.0 pack into octoshell's own checkout (the release VSIX is a local build; no marketplace publish was part of this task). Installed from the VSIX built at release commit ea432393 (apps/vscode-extension/octobots-0.1.0.vsix, unpacked) with the default Reconcile: node apps/vscode-extension/scripts/qa/install-pack.mjs . --pack-root <vsix>/extension/resources/octobots-pack. Result: before upToDate false (v56), after upToDate true, upToDateExceptLocal true, pendingReconcile [], no deviations (octoshell's skills were unedited). All 5 pack SKILL.md files read version: 57; mission-planner/scripts now carries add-tests.js, plan-review.mjs, set-test-status.js, tc-io.mjs; mission-execution/scripts carries qa-env.mjs and scan-parked.js. A backup of the previous .claude, .octobots/hooks and .octobots/tokenomics is in the session scratchpad (selfinstall/claude-before.tgz).
  Workspaces: octoshell (upToDate true). No other dev workspace held an intermediate v57 install: every M1-M7 QA install went into scratch clones/copies, never a real workspace (solo was read-only throughout).
  doctor.js after the install: one warn, 5 leftover workflows/ folders in the octograph campaign (no longer read since v57; octobots-doctor removes a folder only with a per-folder yes from the user), and a note that no status line is configured.
