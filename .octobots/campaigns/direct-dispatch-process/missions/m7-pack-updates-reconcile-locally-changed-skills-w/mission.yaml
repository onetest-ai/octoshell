  ## Risks

  - Behavioural cases are non-deterministic and cost tokens (3 cases x 5 reps plus 2 x 3 reps on 200-560-line files). The escalation case is the safety property and must be 5/5; a miss files a bug against the skill wording.
  - A workspace that declined the hooks never sees the primer: the completion message says so, and doctor.js/validate.js still list the pending entries.
  - `git clone --shared` QA copies break if solo prunes unreachable objects while they exist; solo itself is never written.


