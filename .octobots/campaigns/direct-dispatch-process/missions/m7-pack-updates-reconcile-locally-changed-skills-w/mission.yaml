  ## Overwrite scope (T7.3 review ruling, 2026-10-05)

  'Overwrite' replaces exactly the deviated skills the prompt lists, after saving each as overwritten-local.md. A RECONCILED skill (<N>+local whose reconciled-from equals the current pack file) is not a deviation and is never listed, so no install choice overwrites it. Once it becomes reconciled-older (a later pack build), it is listed again, and that is the sense in which AC3's 'never overwritten except by overwrite' holds. Skills newer than the pack are untouched by every choice.

