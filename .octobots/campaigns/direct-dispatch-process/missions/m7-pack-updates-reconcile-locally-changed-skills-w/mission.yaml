name: M7 - Pack updates reconcile locally changed skills with an agent
status: done
description: Campaign decision 13 (revised, 2026-10-05). A pack skill a workspace changed locally is reconciled by an agent instead of being overwritten. The extension detects deviated skills (by SKILL.md only; the skill's other pack files always install) against a store of every SKILL.md the pack ever shipped, asks Reconcile (default) / Overwrite / Keep mine, applies Overwrite and Keep at once, and for Reconcile stages base/local/upstream plus a brief under .octobots/pack-updates/v<N>/<skill>/ and writes a pending record; it never starts an agent. The pack's SessionStart hook tells the next agent session to run the new octobots-doctor skill, which does the 3-way merge with a decision log, escalates policy conflicts to the user, marks the result `<N>+local` and clears the record; doctor.js and validate.js list what is pending. octobots-doctor is the agent's manual for pack and board health generally (leftover workflows/ folders, config-dir advice; M4 and M5 extend it). Proven on copies of solo's two real 57-local forks, including a no-churn case and an escalated conflict. Lands after M2 (needs its retire lists, QA harness, validate/doctor passes and upstreamed skills) and before M3.
acceptance_criteria:
  - text: 'Given a workspace whose .claude/skills holds a skill from OCTOBOTS_SKILLS or RETIRED_SKILLS, its SKILL.md is classified by one rule per runtime (skill-marker.ts in the host; skill-marker.mjs in the pack, imported by doctor.js, validate.js and pack-reconcile.mjs) that reads the frontmatter only (the first `version:` and `reconciled-from:` lines) and hashes the file as sha256 with CRLF normalised to LF. It is DEVIATED when its version is (a) neither an integer nor `<N>+local` (reason `label`; solo''s `57-local`), (b) an integer N whose hash is none of those the store lists for (skill, N) (reason `content`), (c) an integer N up to the pack version for which the store lists nothing for that skill (reason `unknown-version`), or (d) `<N>+local` with N below the pack version, or with N equal to it but `reconciled-from:` not the sha256 of the pack''s current SKILL.md for that skill (reason `reconciled-older`). `<N>+local` with N equal to the pack version AND reconciled-from equal to that sha256 is RECONCILED, not deviated. A version (`N`, `N-local` or `N+local`) above the pack version is `newer`: listed in newer: [skill], never in deviations, and left untouched by every install choice. packStatus reports deviations [{skill, version, reason, retired, sha256}], reconciled, pendingReconcile, newer and upToDateExceptLocal: upToDate is true when every skill is at the pack version with a stored hash or RECONCILED and every other payload is current; upToDateExceptLocal is true when deviations (pending, kept or unchosen) and newer skills are the only reasons upToDate is false; a `57-local` or `57+local` skill counts as present, and a missing octobots-doctor (new in v57) does not make installed false. The store is ONE brotli-compressed JSON, apps/vscode-extension/resources/shipped-skills.json.br, {versions: {"<N>": {"<skill>": ["<sha256>"]}}, order: ["<sha256>"], bodies: {"<sha256>": "<text>"}}, holding every SKILL.md the pack shipped from v18 on (workflow-designer and v18''s `octobots` included); it is only appended to, so intermediate v57 builds stay recognised; .gitattributes marks it `-text`. test/skill-marker-parity.test.ts drives both rules from one case table (`57`, `57-local`, `57+local`, `57+local` with reconciled-from, trailing spaces, a CRLF file, no version line, a `version:` line only in the body) and asserts identical {label, n, kind, reconciledFrom, sha256}'
    done: false
  - text: 'Given a deviated skill, its base is the first of: (1) the stored body whose sha256 the SKILL.md frontmatter names in `reconciled-from:` (source `reconciled-from`); (2) the newest commit in the workspace''s own git history of .claude/skills/<skill>/SKILL.md whose normalised blob sha256 is in the store (source `workspace-git`; git runs with a timeout of at most 2 s, and absent git, a directory that is not a repository or an ignored .claude skip the rule); (3) the EARLIEST stored body for (skill, N), N being the leading integer of the version label (source `declared`); (4) among the stored bodies for that skill with version <= N (all of them when the label has no leading integer), the one with the fewest changed lines against the local file (source `closest`, called approximate in RECONCILE.md), and when N is known and no stored body has version <= N, rule 5; (5) none, and RECONCILE.md says the merge is two-way. Rule 4 never picks a base newer than the declared version. On a copy of solo, rule 2 gives the shipped v56 files of commit 7de91fef (mission-execution 9af2c928b8310ddd..., mission-completion-gate 008de10a952f5afe...); rule 4 alone would give v50 and v51, which is why it comes after rules 2 and 3'
    done: false
  - text: 'Given deviated skills, when installPack(src, root, {localChanges, store}) runs with "reconcile" (the default, also used by any non-interactive install), then each deviated skill''s SKILL.md is byte-identical afterwards, while every other file the pack ships in that skill''s directory installs as for an undeviated skill and the RETIRED_FILES inside it are removed (detection and reconcile concern SKILL.md only; files the pack never shipped, e.g. create-team.js, are kept; a locally edited script is overwritten as today, confirmed by the user 2026-10-05 (decision-13 recheck Q5)); a retired deviated skill''s directory is left whole, since its upstream is deletion; a RECONCILED skill installs the same way, so its SKILL.md is never overwritten except by "overwrite". .octobots/pack-updates/v<N>/<skill>/ holds base.md (absent under base rule 5), local.md, upstream.md (absent for a retired skill) and RECONCILE.md naming the skill, both versions, the base source and the steps, plus, when the entry it replaces left open ESCALATED entries in its DECISIONS.md, those questions under `Carried over from v<old>:`; .octobots/pack-updates/.gitignore ignores everything except itself, each DECISIONS.md and each UPSTREAM-CANDIDATES.md (so the logs are committed where .octobots/ is tracked); .octobots/pack-updates/pending.json holds {packVersion, skills: [{skill, action: "reconcile", localVersion, localSha256, base: {version, sha256, source} | null, upstreamSha256 | null, retired, dir}], kept: [{skill, packVersion, sha256}]}, `dir` being relative to the workspace root with `/`; every other skill installs; the result has pending: [skill]. "overwrite" first saves each replaced SKILL.md as overwritten-local.md in its v<N>/<skill>/ folder (confirmed by the user 2026-10-05 (decision-13 recheck Q4)), then replaces them (a retired one is deleted), removes their pending entries and deletes base.md, local.md, upstream.md, RECONCILE.md and merged.md from their staging folders; "keep" does the same without saving or replacing and records kept. A second install with the same pack and unchanged local files changes no byte under .octobots/pack-updates/; a changed local SKILL.md re-stages that skill and updates its one entry; a newer pack version, or a later build of the same version whose current SKILL.md differs from an unresolved entry''s upstreamSha256, re-stages that entry and deletes those input files from its old folder; the installer drops the entry of a skill that is no longer deviated. The installer never deletes a DECISIONS.md, UPSTREAM-CANDIDATES.md or overwritten-local.md, and removes a staging folder only when it holds none of them. pending.json''s shape is defined once by apps/vscode-extension/test/fixtures/pending-cases.json (valid, kept-only, empty, malformed, a rule-5 entry with base null, a retired entry with upstreamSha256 null): pack-updates.ts, primer.mjs''s twin and the pack''s mission-planner/scripts/pending-io.mjs (imported by doctor.js, validate.js and pack-reconcile.mjs) parse every case to identical {packVersion, reconcile: [skill], kept: [skill]}; a malformed file adds no primer finding (the primer exits 0 with its normal output), is one doctor.js {level: "warn", area: "pack"} finding and one validate.js warning, and installPack replaces it from its own results'
    done: false
  - text: 'Given the Install Octobots Pack command or Install on the activation prompt, when deviated skills exist, then before any write a modal `showWarningMessage` shows the message `Octobots: <n> pack skill(s) in this workspace were changed locally.`, a detail with one line per skill in the text of M7 notes § Prompt text, and the buttons `Reconcile` (first, the default), `Overwrite` and `Keep mine` plus VS Code''s Cancel; Cancel or Escape installs nothing; the extension never starts an agent and never copies a prompt. After Reconcile the completion message names the staged skills and says the next agent session will be asked to run octobots-doctor, adding that the SessionStart hook is off when it is not registered. The activation prompt is not shown while the only differences are newer skills and deviations that are pending or kept for this pack version with an unchanged sha256, and is shown again for a new pack version, a changed sha256 or a new deviation; the Install command always asks'
    done: false
  - text: 'Given apps/vscode-extension/scripts/qa/install-pack.mjs <workspace> [--pack-root <dir>] [--local-changes=reconcile|overwrite|keep] [--pack-version <n>], then the default is reconcile, it prints {before, deviations, result (incl. pending and kept), after}, and it writes `<n> skill(s) need reconcile` to stderr when n > 0; --pack-version overrides the pack version for detection and staging (QA only, to exercise a later version); --pack-root replaces the pack only: detection and base recovery always read apps/vscode-extension/resources/shipped-skills.json.br (installPack takes the store as its own parameter)'
    done: false
  - text: 'Given a workspace, when hooks/primer.mjs runs (SessionStart or PreCompact), then while any primer finding exists that .octobots/doctor-acks.json does not acknowledge, its additionalContext adds ONE line, in the text of M7 notes § Primer line, telling the agent to run the octobots-doctor skill before or alongside the user''s task. M7''s primer findings, in this order: pending reconciles (the skills and .octobots/pack-updates/v<N>/; never acknowledgeable), leftover workflows/ folders (counted under .octobots/campaigns/*/workflows and .octobots/campaigns/*/missions/*/workflows only), and CLAUDE_CONFIG_DIR set to <project>/.claude (M1-AC8); M5 T5.5 adds the lanes finding (an AGENTS.md read only). Tests-pairing gaps and legacy plan-review records are NOT primer findings: octobots-doctor acts on them from validate.js and set-status.js output. With no unacknowledged finding the primer adds nothing. The checks are file and environment reads only (no git, no network, no child process). doctor-acks.json is {acknowledged: [{finding, path, date}]}, committed, written by octobots-doctor (confirmed by the user 2026-10-05 (decision-13 recheck Q3)). doctor.js --json reports {level: "warn", area: "pack", msg: "pack reconcile pending: <skill> (v<N>), ...", fix: "run the octobots-doctor skill"} and validate.js on any entity in the workspace prints one `warning: pack reconcile pending: <skill> (v<N>)` line per entry with its exit code unchanged; both still list acknowledged findings. doctor.js''s version-agreement check classifies skills with the shared rule: pending, kept, RECONCILED and newer skills are excluded from ''skills disagree'' and reported as one line naming their state, so a kept `version: 56` content fork at pack 57 yields no `fail`. This is agent context and script output, not an extension message (decision 12 is unaffected)'
    done: false
  - text: 'The v57 pack ships skill/octobots-doctor/SKILL.md (`version: 57`) and skill/octobots-doctor/scripts/pack-reconcile.mjs, OCTOBOTS_SKILLS and doctor.js list 5 skills, and the skill says: run doctor.js --json and validate.js and act on their findings; act only on the staging folders pending.json names (a superseded folder''s open questions are read from the new RECONCILE.md''s `Carried over from v<old>:`; an ESCALATED entry in a folder no entry names is history and is never asked again); for each pending reconcile, read RECONCILE.md and the three inputs and decide per change (local only: keep; upstream only: take; both the same: take; both different: conflict), where making an upstream generic rule concrete for this project (e.g. its lane commands) is not a conflict; a conflict is a POLICY conflict when the two sides prescribe different values for the same decision: model or role; review or fix round limits; coverage threshold; what blocks a merge; who may merge or approve, and into which branch; actions that need the user''s OK first (deleting, pushing, migrating or seeding a database, anything with an external effect); or a safety guard; a local restatement of a base value counts as local''s position when upstream changes that value; when unsure whether a difference is policy, escalate (list confirmed by the user 2026-10-05 (decision-13 recheck Q2)); resolve a non-policy conflict with stated reasoning; ESCALATE a policy conflict to the user and leave the whole live SKILL.md untouched until every escalation of that skill is answered (confirmed by the user 2026-10-05 (decision-13 recheck Q1)); never merge by lines; write merged.md and DECISIONS.md (sections Kept local, Taken from upstream, Conflicts; entries `- RESOLVED: <rule>: <reason>` and `- ESCALATED: <rule>: local <...>; upstream <...>; question <...>`; when upstream equals the base apart from its version marker, the single line `No upstream change since the base apart from the version marker; local kept as is.`); optionally UPSTREAM-CANDIDATES.md listing `- <rule>: <why it generalises>`, only rules from Kept local; install merged.md as the live SKILL.md with `version: <N>+local` and `reconciled-from: <upstream sha256>`; write nothing outside that skill''s directory, its staging folder and .octobots/doctor-acks.json; always escalate a retired skill; when the user answers, rewrite the entry as `- RESOLVED (user, <YYYY-MM-DD>): <rule>: <answer>`, finish the merge and run done; a session that finds an open ESCALATED entry asks its question again and does not merge again; tell the user in its reply which skills it reconciled, the DECISIONS.md path of each, and every ESCALATED question verbatim. `pack-reconcile.mjs list` prints the entries; `pack-reconcile.mjs done <skill>` exits 3 with the reason unless a DECISIONS.md with no open ESCALATED entry exists and, for a pack skill, the live marker is `<N>+local` with reconciled-from equal to upstream.md''s sha256, or, for a retired skill, its directory under .claude/skills is gone (a kept copy lives on under a name outside OCTOBOTS_SKILLS and RETIRED_SKILLS), and otherwise removes the entry; done on a skill with no pending entry exits 0, prints `no pending reconcile for <skill>` and changes nothing. pack-reconcile.mjs resolves the workspace from its own file location (or --root <dir>), never from the current directory, takes `retired` from the pending entry and names no skill; octobots-doctor/SKILL.md names no retired skill outside its legacy-folder paragraph. For leftover workflows/ folders it reports them and deletes one only after the user says yes to that folder; for doctor''s config-dir finding it explains the ~/.claude/projects default (M1-AC8) and never sets CLAUDE_CONFIG_DIR=<repo>/.claude; when the user declines to act on a workflows/, config-dir or lanes finding, it records {finding, path, date} in .octobots/doctor-acks.json (confirmed by the user 2026-10-05 (decision-13 recheck Q3))'
    done: false
  - text: 'Given copies of solo staged by the M7 install, when a fresh agent runs octobots-doctor (5 reps per case, each on its own copy): (real) against the M7-branch pack, the live mission-execution and mission-completion-gate read `version: 57+local` with reconciled-from equal to upstream.md''s sha256, keep the dispatch, test-lane, no-xfail and macOS-timeout anchors of campaign notes § Real-data notes, number the § Dispatch rules without duplicates (upstream''s fix), account in DECISIONS.md for every change between base.md and upstream.md, leave solo''s CLAUDE.md and AGENTS.md byte-identical, clear the pending entries, leave .octobots/campaigns unchanged, list in any UPSTREAM-CANDIDATES.md only Kept local rules, and a re-install stages nothing, reports both reconciled and leaves both SKILL.md files byte-identical at `57+local`; (no churn) against the pre-M2 v57 file (800c62c, the v56 text plus the marker) as upstream, DECISIONS.md holds only the no-upstream-change line and the live file differs from local.md only in its version and reconciled-from lines; (escalation) against a synthetic upstream whose mission-completion-gate says an xfail that states a reason counts as green (solo''s fork added `0 xfailed`, which base v56 lacks) and appends one section, DECISIONS.md has an ESCALATED entry for the xfail rule and takes the section, the live SKILL.md is byte-identical, the pending entry remains and `pack-reconcile.mjs done mission-completion-gate` exits 3 (5/5); (answered, 3 reps on escalated copies) without an answer the agent asks again and changes nothing, and with the user''s answer it rewrites the entry as RESOLVED (user, <date>), installs `57+local`, done clears the entry and the primer no longer names pack-updates (3/3). In the real case DECISIONS.md maps every hunk of `diff base.md upstream.md` to an entry, names the four anchor rules, and says the DSN guard lives in CLAUDE.md and was not touched'
    done: false
documents:
  - label: M7 functional test cases
    target: .octobots/campaigns/direct-dispatch-process/tests/m7/README.md
tokenomics:
  effort_days: 4
  size_tshirt: L
  complexity_score: 19
notes: |-
  ## Planning notes (Rio, 2026-10-05)

  Why a mission of its own, not M2: the reconcile is a separate capability with its own eight ACs, a new skill, a hook change and four behavioural micro-tests, about 4 days on top of M2's 2.5; folded into M2 it would give a 10-task mission whose gate reviews two unrelated features at once. It cannot run before M2: it extends the RETIRED_SKILLS/RETIRED_FILES lists and the install-pack.mjs harness that T2.3 creates, the validate.js/doctor.js passes T2.4 rewrites, and its real-data case needs the upstreamed v57 mission-execution and mission-completion-gate that T2.1/T2.2 ship. It runs before M3 so that M5 can add its lanes finding and M4/M5 can extend octobots-doctor. Same campaign branch, one tree: sequential, never parallel to M3. Pack payload under the single v57 bump (M1 T1.4); intermediate v57 builds are appended to the store, never replaced, and a `57+local` skill whose reconciled-from is an earlier v57 build is re-staged (AC1 d), so M4-M6's skill changes still reach a reconciled workspace.
  Between M2 and M7 a dev build overwrites a deviated skill, as today's installer does. Nothing is released before M6, and QA runs on copies only.
  Order inside M7: T7.1 (store) -> T7.2 (detection, base recovery, packStatus) -> T7.3 (install staging) -> (T7.4 prompt | T7.5 primer/doctor/validate | T7.6 skill in parallel) -> T7.7 QA. Critical path T7.1 -> T7.2 -> T7.3 -> T7.6 -> T7.7. T7.5 and T7.6 both touch doctor.js (T7.5 the pack finding and version agreement, T7.6 the skill list at :63): whichever merges second rebases.

  ## The store and detection

  - apps/vscode-extension/resources/shipped-skills.json.br: one brotli-compressed JSON {versions, order, bodies} with every SKILL.md body the pack shipped since v18 (124 distinct bodies today, about 2.9 MB raw, 59.7 KB compressed at quality 11; measured 2026-10-05 with Node's built-in zlib; it grows by one body per SKILL.md change). It ships in the VSIX next to the pack, never installed into a workspace. Generated by apps/vscode-extension/scripts/shipped-skills.mjs: `--write` appends from the git history of resources/octobots-pack/skill/*/SKILL.md plus the current files and is the only mode that reads git; `--verify` reads no git and exits 1 naming the file when a current pack SKILL.md is not indexed under OCTOBOTS_PACK_VERSION or a stored body's normalised sha256 differs from its key; `--verify` runs in the extension's `build` script beside graph-payload --verify (package-vsix.yml checks out shallow). Every SKILL.md change from now on is followed by `--write` with the store committed (campaign notes § Test conventions rule 9). This replaces the first re-plan's per-file bodies from v50 (about 317 KB as the VSIX compresses them): all bodies are stored, so rule 3 never lacks a body.
  - Detection reads only SKILL.md's frontmatter and hash, through the one shared rule of AC1, in OCTOBOTS_SKILLS then RETIRED_SKILLS order. Builds from unmerged or rebased branches (29 blobs outside HEAD's history today) are not in the store, so a workspace that installed one shows a `content` deviation: acceptable, and the reconcile resolves it.
  - Only SKILL.md is protected. Every other file in a deviated or reconciled skill's directory installs as usual, RETIRED_FILES are removed and unshipped files kept: freezing a directory would leave mission-planner's scripts (doctor.js, validate.js, set-status.js) and mission-execution's qa-env.mjs and scan-parked.js at the old version. Locally edited scripts keep being overwritten in v57; script reconcile is a follow-up (confirmed by the user 2026-10-05 (decision-13 recheck Q5)).

  ## Base recovery

  Rules (1)-(5) of AC2. Why this order (spike reconcile-spike/base-rules.mjs, run on solo 2026-10-05): rule 2 gives solo's true base exactly (the v56 files committed in 7de91fef, the commit before the forks landed in f2e7812d; solo tracks .claude/skills on purpose, while octoshell ignores .claude, so rule 2 never applies there). Closest-by-diff alone picks v50 and v51 (240 vs 252 changed lines for mission-execution), because the forks rewrote the very sections that changed between v50 and v56. Rule 3 takes the EARLIEST body for the declared version: a `57-local` fork is at most as new as v57's first build, and once M2's upstreamed v57 is in the store it is closer by diff to solo's fork than the true base, so a nearest-by-diff choice would hide every upstream change as 'no change'. Rule 4 is bounded by the declared version for the same reason. When unsure, the older base is the safe side: it over-reports upstream changes for the agent to review rather than silently dropping them. Rule 1 makes a reconciled skill's next update exact.

  ## Staging and the pending record

  - Layout: `.octobots/pack-updates/v<N>/<skill>/{base.md, local.md, upstream.md, RECONCILE.md}`; the agent adds merged.md, DECISIONS.md and optionally UPSTREAM-CANDIDATES.md; Overwrite adds overwritten-local.md. `.octobots/pack-updates/.gitignore` (written by the installer, so no user .gitignore is touched) is `*`, `!.gitignore`, `!*/`, `!*/*/DECISIONS.md`, `!*/*/UPSTREAM-CANDIDATES.md`: the decision logs are committed with the `57+local` skill they explain where .octobots/ is tracked (in octoshell, which ignores /.octobots/, nothing there is visible to git), while the inputs, merged.md, overwritten-local.md and pending.json stay local. The installer never deletes a log or overwritten-local.md; folders are per version, so nothing collides.
  - `pending.json` is the only record: entries keyed by skill, at most one each; Keep is recorded there too, so the hook, doctor.js and the activation prompt read one file. Its shape is the fixture file of AC3, parsed identically by three readers.
  - RECONCILE.md is the brief: the skill, local version and sha, base version and source (and 'approximate' for rule 4, 'two-way' for rule 5), upstream version, any `Carried over from v<old>:` questions, and 'run the octobots-doctor skill; do not edit the live SKILL.md by hand'. A retired skill's brief says upstream deleted it and the decision (keep it as a project skill under a new directory name, or delete it) is the user's.

  ## Prompt text

  The modal is shown by installOctobotsPack before the hooks and tools questions. VS Code adds Cancel. For solo:
      message: Octobots: 2 pack skill(s) in this workspace were changed locally.
      detail:  Installing the Octobots pack v57 would replace or delete these skills:
               • mission-execution: version 57-local (not a pack version)
               • mission-completion-gate: version 57-local (not a pack version)
               Reconcile: install everything else and stage these skills in .octobots/pack-updates/v57/; your next agent session merges them with the octobots-doctor skill.
               Overwrite: replace them with the pack's files.
               Keep mine: install everything else and leave these skills as they are.
               Cancel: install nothing.
      buttons: Reconcile | Overwrite | Keep mine (and Cancel)
  Other line forms: content `• <skill>: version <N> (differs from the pack's v<N> file)`; unknown-version `• <skill>: version <N> (not a file the pack shipped)`; reconciled-older `• <skill>: version <N>+local (reconciled against an earlier pack file)`; a retired skill adds `; retired in v57, so Overwrite deletes it` inside the parentheses. Built by a pure deviationPrompt(deviations, packVersion) so a vitest asserts it word for word. Completion message after Reconcile: `Staged <skills> for reconcile in .octobots/pack-updates/v57/. The next agent session will be asked to run the octobots-doctor skill.`, plus ` The SessionStart hook is off, so ask your agent to run octobots-doctor.` when the hook is not registered. That is the install result message that exists today, not a new warning surface (decision 12).

  ## Primer line

      Octobots health: run the octobots-doctor skill before or alongside the user's task. Pending pack reconciles: <skill>, <skill> (.octobots/pack-updates/v<N>/). Leftover workflows/ folders: <n>. CLAUDE_CONFIG_DIR is set to <project>/.claude.
  Each sentence after the first is present only when its finding holds and is not acknowledged; the line is absent when none is. M5 T5.5 appends `AGENTS.md declares no test lanes.` in the same form.

  ## octobots-doctor scope

  The primer line (AC6) triggers the skill for every primer finding, reconciles first (refinement 2: 'when doctor-actionable items exist, especially pending reconciles'). M7 ships what exists by M7: pending reconciles (main duty), leftover workflows/ folders (M2's warning; delete only with a per-folder yes; decision 1 as refined by 13(d)), and doctor's config-dir finding (M1-AC8). Tests-pairing (M4) and legacy plan-review records (M5) are NOT primer findings: running M4-AC2's pairing rule at every session start would be a third implementation of it, and a done mission's gap can only be fixed by writing tests for finished work. octobots-doctor acts on them when validate.js or set-status.js prints them, with the paragraphs M4 T4.3 and M5 T5.3 add. The lanes finding is a primer finding added by M5 T5.5 (an AGENTS.md read). A user who declines a finding acknowledges it in .octobots/doctor-acks.json (confirmed by the user 2026-10-05 (decision-13 recheck Q3)), so the primer stops naming it while doctor.js and validate.js still list it. Follow-ups outside this campaign: acting on TC-format warnings with set-test-status.js --migrate (M6's tool); acting on scan-parked.js hits; offering to register the hooks when doctor finds them off; reconciling locally edited pack scripts (confirmed by the user 2026-10-05 (decision-13 recheck Q5)).

  ## Spikes (2026-10-05, scratchpad reconcile-spike/)

  - base-rules.mjs on solo: rule 2 -> 7de91fef v56 (both skills); rule 3 -> the first v57 build (800c62c); closest over v50+ -> v50 / v51.
  - git merge-file local/base/upstream: with the pre-M2 v57 file as upstream the only conflict is the version line (the no-churn case); with a synthetic upstream that changes the Model tiering bullet, merge-file reports no conflict there and writes the new first line above the fork's old continuation lines: a contradictory paragraph. Hence AC7's 'never merge by lines'.
  - Store size: all 124 shipped SKILL.md bodies as one JSON, brotli quality 11 -> 59,718 bytes.

  ## Plan review of the re-plan (2026-10-05)

  - First pass, Alex (ba): changes requested (2 blocking, 6 should-fix, 5 nits), all applied the same day: the primer triggers on actionable findings (B1), the escalation round trip and TC-015 (B2), the planted conflict moved to the xfail rule solo added (S1), the real case maps every upstream hunk (S2), `unknown-version` and `newer` (S3), the retired-skill done condition (S4), logs never deleted and committed (S5), a release-pack reconcile in M6-AC8 / TC-011 (S6).
