name: T7.3 - installPack stages reconciles and records the choice
status: draft
role: js-dev
description: |-
  Depends on T7.2 (same files). Scope:
  - octobots-skill.ts installPack: opts.localChanges "reconcile" | "overwrite" | "keep" (default "reconcile") and opts.store, returns pending[] and kept[]; staging layout, pending.json, RECONCILE.md brief (with `Carried over from v<old>:`), overwritten-local.md on Overwrite, the .gitignore that ignores all but itself and the decision logs, and the idempotency and never-delete-a-log rules of mission AC3 and M7 notes § Staging; only SKILL.md is protected: under reconcile and keep, and for a reconciled skill, the pack's other files in that skill's directory install as usual, RETIRED_FILES inside it are removed and unshipped files are kept; a retired deviated skill's directory is left whole and gets no upstream.md;
  - a pure module apps/vscode-extension/src/host/pack-updates.ts reading and writing pending.json (one entry per skill, stable key order, no rewrite when nothing changed), the fixture file apps/vscode-extension/test/fixtures/pending-cases.json, and its pack twin mission-planner/scripts/pending-io.mjs;
  - install-pack.mjs: --local-changes=reconcile|overwrite|keep (default reconcile), --pack-version <n>, the store always from apps/vscode-extension/resources/shipped-skills.json.br whatever --pack-root says, the {before, deviations, result, after} JSON and the stderr line (mission AC5); update T2.3's octobots-skill.test.ts case to pass overwrite.
  Out of scope: the modal (T7.4), the hook and doctor/validate (T7.5), the skill (T7.6). Downstream: T7.4-T7.6 read pending.json.
acceptance_criteria:
  - text: 'apps/vscode-extension/test/pack-install-reconcile.test.ts proves on temp workspaces with a `57-local` mission-execution, a `57-local` mission-planner (holding the retired scripts and create-team.js) and a changed retired workflow-designer: reconcile leaves both SKILL.md files byte-identical, installs every other pack file of those directories byte-identical to the pack (mission-execution''s scripts/ present, mission-planner''s scripts current), removes the retired scripts, keeps create-team.js, leaves workflow-designer''s whole directory byte-identical, writes the staging files and pending.json of mission AC3 (no upstream.md for the retired one), installs the rest and returns pending; a `57+local` SKILL.md reconciled against the current pack file is byte-identical after a re-install; overwrite saves overwritten-local.md, replaces/deletes, drops the entries and deletes the input files; keep records kept, stages nothing and deletes the input files; overwrite and keep on a skill whose folder holds a DECISIONS.md with an open ESCALATED entry leave that DECISIONS.md byte-identical; no option = reconcile; a second identical install changes no byte under .octobots/pack-updates/ (mtimes and bytes compared); an edited local SKILL.md updates its one entry; a later pack version (packVersion 58) and a later build of 57 (a changed pack SKILL.md) each re-stage the entry, delete the old input files and keep the old DECISIONS.md, and the new RECONCILE.md carries its open questions under `Carried over from v57:`; an entry whose skill is no longer deviated is dropped; `git check-ignore` ignores base.md, overwritten-local.md and pending.json and not DECISIONS.md (mission AC3)'
    done: false
  - text: apps/vscode-extension/test/pending-io-parity.test.ts parses every case of test/fixtures/pending-cases.json with pack-updates.ts and pending-io.mjs and asserts identical {packVersion, reconcile, kept}, and installPack over the malformed case replaces it from its own results (mission AC3); apps/vscode-extension/test/qa-install-pack.test.ts runs install-pack.mjs with the default, --local-changes=overwrite, =keep, --pack-version 58 and a --pack-root copy without a store on a temp workspace holding a `57-local` skill and asserts {before, deviations, result, after} and the stderr line (mission AC5); `pnpm test` and `pnpm coverage:pack` are green
    done: false
  - text: Retiring a skill whose directory holds files the pack never shipped (e.g. .claude/skills/workflow-designer/my-notes.md) keeps those files in place, removes only the files the pack shipped for that skill, and reports the kept paths in the install result; apps/vscode-extension/test/octobots-skill.test.ts proves it (input from the M2 T2.3 review, 2026-10-05)
    done: false
  - text: installPack computes ONE git deadline per install (Date.now() + GIT_BUDGET_MS from pack-deviations.ts) and passes it as opts.gitDeadline to every recoverBase call, so rule-2 git blocks the extension host at most 2 s per install; and when the shipped-skill store is missing or unreadable, installPack writes NOTHING and reports 'shipped-skill store missing' instead of falling back to overwriting; both proven in apps/vscode-extension/test/octobots-skill.test.ts (input from the T7.2 review)
    done: false
