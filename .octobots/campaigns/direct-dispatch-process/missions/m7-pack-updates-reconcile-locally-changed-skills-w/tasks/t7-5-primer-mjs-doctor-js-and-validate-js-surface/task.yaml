name: T7.5 - primer.mjs, doctor.js and validate.js surface pending reconciles and health findings
status: draft
role: js-dev
description: 'Depends on T7.3 (pending.json contract and pending-io.mjs). Scope: resources/octobots-pack/hooks/primer.mjs appends the one line of M7 notes § Primer line (pending reconciles first, then leftover workflows/ folders under campaigns/*/workflows and campaigns/*/missions/*/workflows, then CLAUDE_CONFIG_DIR=<project>/.claude), skipping findings .octobots/doctor-acks.json acknowledges (pending reconciles excepted), by file and environment reads only; a malformed pending.json adds no finding and never breaks the primer''s output; its pending.json reader is a hand-duplicated twin of pack-updates.ts, driven by the same fixture file as primer.mjs''s other twins. mission-planner/scripts/doctor.js gains the {level: warn, area: pack} finding with the exact msg and fix of mission AC6 (and one warn for a malformed pending.json), and its version-agreement check uses skill-marker.mjs and pending-io.mjs so pending, kept, RECONCILED and newer skills are excluded from ''skills disagree''; validate.js prints the pending lines for any entity inside the workspace, exit code unchanged. doctor.js and validate.js still list acknowledged findings. primer.mjs is pack payload under the single v57 bump: its marker stays 57. Out of scope: the skill text (T7.6); the lanes finding (M5 T5.5). Downstream: M7 TC-008, TC-009.'
acceptance_criteria:
  - text: 'apps/vscode-extension/test/octobots-primer.test.ts pipes SessionStart and PreCompact JSON into primer.mjs with CLAUDE_PROJECT_DIR at temp workspaces holding: two pending reconcile entries plus a workflows/ folder (output contains exactly `Octobots health: run the octobots-doctor skill before or alongside the user''s task. Pending pack reconciles: mission-execution, mission-completion-gate (.octobots/pack-updates/v57/). Leftover workflows/ folders: 1.`), a kept-only record with no workflows/ folder (no line), workflows/ folders only (the line names the count, not pack-updates), the same folders acknowledged in doctor-acks.json (no line), a pending entry acknowledged in doctor-acks.json (still named), CLAUDE_CONFIG_DIR=<workspace>/.claude only (the line names it), a malformed pending.json (normal output, exit 0, no reconcile sentence), and nothing (no line); the twin check covers the pending.json reader over test/fixtures/pending-cases.json (mission AC6)'
    done: false
  - text: 'packages/board/test/scripts-cli-scenarios.test.ts covers doctor.js --json reporting exactly one {level: "warn", area: "pack", msg: "pack reconcile pending: mission-execution (v57), mission-completion-gate (v57)", fix: "run the octobots-doctor skill"} finding, none without entries, one warn for a malformed pending.json, no `fail` for a kept `version: 56` content fork at pack 57, and validate.js printing one `warning: pack reconcile pending: <skill> (v57)` line per entry with an unchanged exit code (mission AC6); `pnpm coverage:pack` passes'
    done: false
