notes: |
  ## QA verification

  Verdict: PASS. PR #131 (head 42edf37), CI build green on both runs. Records: 5-run primer timing, solo clone (auqanautica, shared clone, original git status unchanged), octoshell copy, scratch fixtures.

  AC1 (octobots-primer.test.ts, 50 passed verbose): black-box on solo clone after default install (2 x 57-local forks pending, 6 workflows/ folders): primer exit 0, valid hook JSON, exactly one health line: "Octobots health: run the octobots-doctor skill before or alongside the user's task. Pending pack reconciles: mission-execution, mission-completion-gate (.octobots/pack-updates/v57/). Leftover workflows/ folders: 6." Acking all 6 workflows paths drops the workflows sentence only; acking a pending skill still names it; CLAUDE_CONFIG_DIR=<ws>/.claude is named, and {finding:"config-dir"} (no path) drops it. Safety: malformed pending.json, >256 KiB pending.json (308 KB) and symlinked pending.json outside the workspace all give no reconcile sentence, exit 0; FIFO at doctor-acks.json returns in 50 ms; nothing to report gives no line. Octoshell copy (nothing pending, 5 workflows folders): "Leftover workflows/ folders: 5." with no reconcile.

  AC2 (scripts-cli-scenarios.test.ts, 76 passed verbose; pnpm coverage:pack passes): doctor.js --json on solo gives exactly one {level:warn, area:pack, msg:"pack reconcile pending: mission-execution (v57), mission-completion-gate (v57)", fix:"run the octobots-doctor skill"} and no fail, packVersion 57. A skill bumped to version 58 with no pending.json is noted as "newer: 58", no fail; kept version 56 fork gives no fail, also after a re-install with keep. validate.js on a solo entity prints one "warning: pack reconcile pending: <skill> (v57)" per entry, exit 0. Octoshell copy: no pack warn.

  Primer timing (solo, 5 runs, ms): 22.2 22.9 23.1 23.6 25.5, median 23.1.

  Ack contract (doctor-acks.json, relative to .octobots/): {finding:"workflows", path:"campaigns/<c>/workflows" | "campaigns/<c>/missions/<m>/workflows"} and {finding:"config-dir"} (no path). Pending reconciles are never hidden by acks.

  Full gate: pnpm build, typecheck, lint, test, coverage:pack all exit 0 (board 405, tokenomics 102, extension 846, graph 653 tests passed; no skips reported; no campaign-view flake).

  Non-blocking: doctor's workflows count is per slug while the primer counts per folder (6 folders here, 6 slugs); doctor/validate still use unguarded reads (on-demand only).
