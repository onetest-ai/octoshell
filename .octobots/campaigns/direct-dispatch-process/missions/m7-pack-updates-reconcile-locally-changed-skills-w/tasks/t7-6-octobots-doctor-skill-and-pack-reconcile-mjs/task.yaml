name: T7.6 - octobots-doctor skill and pack-reconcile.mjs
status: draft
role: js-dev
description: 'Depends on T7.3 (staging layout and pending-io.mjs). Scope: a new pack skill resources/octobots-pack/skill/octobots-doctor/SKILL.md (version 57; description in ''Use when...'' form: pack health, a pending pack reconcile, the SessionStart notice, doctor.js or validate.js findings) with the text of mission AC7, and skill/octobots-doctor/scripts/pack-reconcile.mjs (list | done <skill> [--root <dir>]; plain node, dependency-free, sibling package.json {"type":"module"}; workspace resolved from its own location; imports skill-marker.mjs and pending-io.mjs from mission-planner/scripts); OCTOBOTS_SKILLS (octobots-skill.ts) and doctor.js:63 list 5 skills; the store gains the new SKILL.md (`shipped-skills.mjs --write`). Follow writing-skills: a no-skill control micro-test before the wording, recorded in the task notes (does an agent handed base/local/upstream line-merge, or resolve a policy conflict silently?). Out of scope: M4''s and M5''s extensions of the skill (their tasks). Downstream: M7 TC-010..015; M4 T4.3; M5 T5.3, T5.5.'
acceptance_criteria:
  - text: 'apps/vscode-extension/test/skill-conventions.test.ts asserts octobots-doctor states each rule of mission AC7: runs doctor.js --json and validate.js; acts only on folders pending.json names and reads carried-over questions from RECONCILE.md; the four-way change classification; concrete-for-this-project is not a conflict; the full policy-conflict list and ''when unsure, escalate''; a local restatement of a base value is local''s position; ESCALATED with the whole live file untouched; never merge by lines; merged.md, DECISIONS.md with its three sections, entry forms and the no-upstream-change line; the UPSTREAM-CANDIDATES.md entry form, Kept local rules only; `<N>+local` and `reconciled-from:`; writes nothing outside the skill, its staging folder and doctor-acks.json; retired skills always escalated; the answered form `- RESOLVED (user, <date>)` and ask-again-without-re-merging; the reply names the reconciled skills, each DECISIONS.md path and every ESCALATED question verbatim; pack-reconcile.mjs done; workflows/ folders deleted only on a per-folder yes; the config-dir advice; declined findings recorded in doctor-acks.json; no retired skill named outside the legacy-folder paragraph (mission AC7)'
    done: false
  - text: apps/vscode-extension/test/pack-reconcile-script.test.ts proves pack-reconcile.mjs list prints the entries; done exits 3 with the reason when the live marker is not `57+local`, when reconciled-from differs from upstream.md's sha256, when DECISIONS.md is missing, or when it has an open ESCALATED entry, and otherwise removes exactly that entry and leaves the staging folder; an entry answered as `- RESOLVED (user, <date>)` passes; for a retired skill, done exits 3 while its directory is still under .claude/skills and 0 once it is gone with a closed DECISIONS.md; done on a skill with no entry exits 0, prints `no pending reconcile for <skill>` and leaves pending.json byte-identical; run from an unrelated cwd it acts on the workspace it is installed in; the script source names no skill (mission AC7); OCTOBOTS_SKILLS and doctor.js list 5 skills; `pnpm test` and `pnpm coverage:pack` are green
    done: false
  - text: the no-skill control and the with-skill run of the escalation scenario (TC-013's synthetic xfail upstream, 5 reps each) are recorded in this task's notes before the PR, showing the control's failure mode and 5/5 escalation with the skill
    done: false
  - text: mission-planner/SKILL.md's legacy-folder paragraph says legacy workflows/ folders are never changed by the installer or any tooling, and only octobots-doctor may delete one, with the user's explicit OK per folder (consistent with decision 13(d)); skill-conventions.test.ts asserts it (input from the M2 T2.3 review)
    done: false
