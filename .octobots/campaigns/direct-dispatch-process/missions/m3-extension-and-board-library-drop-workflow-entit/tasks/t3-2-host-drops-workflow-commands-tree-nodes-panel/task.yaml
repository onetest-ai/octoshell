notes: |-
  ## QA verification

  Verdict: PASS (qa-engineer, 2026-10-05). PR #137, head 1fb92bff (records: 438292da dev, 1fb92bff review fix). Verified black-box on the built artifact and real board copies, not on prior reports.

  Per AC:
  1. manifest-no-workflows + campaigns-tree-real-board (+ rpc-contract assertion). package.json contributes has no workflow command or menu; the only "workflow" string is the unchanged command id. Tree over copies of octoshell's and solo's .octobots (probe bundles the real CampaignsTree, vscode stubbed): octoshell campaign 4 / mission 18 / task 100 / bug 46; solo campaign 23 / mission 115 / task 323 / bug 114; 0 workflow nodes. Tests: 4 + 1 passed.
  2. panel-serializer (+ panel-restore-activation). The serializer was called with arbitrary state (object, undefined, null): disposed 3/3, no throw, no notification. activationEvents include onWebviewPanel:octoshell.{campaign,mission,task,bug,workflow}. Tests: 3 + 2 passed.
  3. activation-workflows-untouched. The real built openBoard() path (migrateEntitiesToYaml + reconcile) ran on copies of octoshell's .octobots (5 workflow files + planted x/workflow.md with a Runs section) and solo's (7 + planted). sha256 of every file under workflows/ was identical before and after, and the planted workflow.md still existed, in both. Test: 3 passed.
  4. Install command id octoshell.installOctobotsWorkflowSkill unchanged, title "Octobots: Install Octobots Pack"; the pack's doctor.js has 0 'Install Workflow Pack' and 10 'Install Octobots Pack'; grep -i "workflow pack" over src, package.json and resources/octobots-pack gives 0 hits. package.json description says "Octobots pack".

  Positive control: the OLD migrateLegacyWorkflows from feat/direct-dispatch-process (git archive of packages/board, bundled) run on fresh copies of octoshell's and solo's boards with the same planted workflows/x/workflow.md: retired 1, planted file existed before and was DELETED after, in both. So the probe can detect deletion, and the new path does not delete.

  0.0.51 finding: released 0.0.51's activation migration deleted legacy workflow.md files (confirmed by the control above). The new code does not. This is a deliberate change from 0.0.51 and belongs in the T6.6 release note (already recorded there per the T3.2 review follow-ups).

  Gates: pnpm build, typecheck, lint, test (board 412, tokenomics 102, extension 921, graph 653; 0 skips) and coverage:pack all exit 0, run in the foreground. gh pr checks 137: build passes. solo's git status --short unchanged (6 lines, same sha256) after all probes; solo was only read and copied.

  Non-blocking items:
  - DispatchCtx.editor is now unused (dead field; harmless, can go in a cleanup).
  - docs/ wording that still says "workflow pack" or describes the workflow editor goes to T3.4.
  - The install notification reads "Octobots: pack installed" (lowercase p after the colon); cosmetic.
