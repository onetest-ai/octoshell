name: B3 - validate-workflows-warning.test.ts fails when OCTOBOTS_BOARD_COPIES points at a real board that already has workflows/ folders
status: draft
severity: minor
description: 'packages/board/test/validate-workflows-warning.test.ts, test ''over every real board copy: one warning per workflows/ folder...'' (line ~57) plants one workflows/ folder per campaign and per first mission on each board from trackedBoardCopies(), then asserts warnings.length === planted (''exactly the planted folders''). trackedBoardCopies() also copies every .octobots named in OCTOBOTS_BOARD_COPIES (campaign notes, Test conventions rule 2: QA points it at cp -R copies of solo and octoshell). Those real boards already hold 6 (solo) and 5 (octoshell) leftover workflows/ folders, which validateBoard correctly warns about too, so the count is planted + real and the assertion fails. In CI (variable unset) only the tracked archive is used, which has none, so it passes. Found by M3 T3.5 QA running TC-006 as written. Test-only defect: validateBoard itself is right (direct check below).'
steps_to_reproduce: '1. cp -R /Users/arozumenko/Development/auqanautica/.octobots <scratch>/solo-octobots (read-only source). 2. On feat/direct-dispatch-process-m3 (c53c9dcc): OCTOBOTS_BOARD_COPIES=<scratch>/solo-octobots pnpm --filter @octoshell/board exec vitest run test/validate-workflows-warning.test.ts --reporter=verbose. 3. Same with a cp -R copy of octoshell''s .octobots.'
expected: '5/6 or 6/6 pass: the suite counts only the folders the test planted, or counts the board''s real workflows/ folders plus the planted ones, so it passes on a real board copy as TC-006 and Test conventions rule 2 intend (validateBoard: 6 warnings on the solo copy, 5 on the octoshell copy).'
actual: '1 failed | 5 passed. Solo copy: ''expected 51 to be 45'' (45 planted + 6 real). Octoshell copy: ''expected 13 to be 8'' (8 planted + 5 real). With the variable unset: 6 passed.'
rca: ''
environment: 'branch feat/direct-dispatch-process-m3 at c53c9dcc, macOS, node v24.15.0, vitest 2.0.5. Direct product check (QA, evidence/TC-006-direct.txt): validateBoard(solo copy) = 6 warnings, 0 workflow errors, set equal to the validate.js warning lines over all 23 campaign dirs; octoshell copy = 5, equal. Fix direction (not applied by QA): assert against a baseline count taken before planting, or only plant when the board has none.'
