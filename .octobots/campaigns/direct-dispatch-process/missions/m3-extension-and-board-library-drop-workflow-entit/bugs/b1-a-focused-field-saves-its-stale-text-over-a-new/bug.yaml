name: B1 - A focused Field saves its stale text over a newer value that arrived while it was focused
status: done
severity: major
description: 'apps/vscode-extension/src/webview/field.tsx: while a Field is focused it ignores incoming value changes (to protect typing). If the user focuses a field WITHOUT typing, an external change arrives (another agent or a git pull edits the entity file; the board watcher reloads), and the user then blurs, the Field saves its stale local text over the newer value. The external edit is silently lost. Pre-existing (identical on base); found by the M2 B1 fix review (PR #140).'
steps_to_reproduce: Render a Field with value 'a'; focus it; the parent re-renders with value 'b'; blur without typing. onSave is called with 'a'.
expected: Blur saves only when the user changed the text since focus (compare with the value captured at focus). An untouched field adopts the newer value and saves nothing. A field the user did edit keeps the user's text (current behaviour).
actual: onSave('a') overwrites the newer 'b'.
rca: |-
  Cause: Field (field.tsx) and ChecklistField (checklist-field.tsx) ignore incoming prop changes while focused, to protect typing, but blur saved the local text unconditionally. A field focused without typing, with an external edit arriving meanwhile (agent or git pull via the board watcher), therefore saved its stale text over the newer value. ChecklistField had the same defect (its blur commit() re-serialized stale items), so it was affected too, not only Field.

  Fix (9ea6ccec): both components snapshot their text at focus. An untouched blur adopts the newest prop and does not save. An edited blur saves the user's text. An edit reverted to the focus-time text counts as untouched.

  Review regression (found in 3d96a89f review): the first fix adopted the prop on every untouched blur. Right after a save, before the host echoes the new value, the prop still holds the pre-save text. Focusing and blurring another field then reverted the just-saved edit, and a later tick saved the old text. Fix (3d96a89f): both components also snapshot the value prop at focus, and an untouched blur adopts the prop only if it changed while focused.

  Related: NotesBlock's explicit-Save overwrite of a newer notes value is a separate defect, filed as M3 B2.

  QA evidence (PR #141, head 3d96a89f): throwaway probe driving the real TaskView with a stateful mocked rpc (deleted, not committed): (a) focus, no typing, external change, blur: newest value shown, no task:update, for Field and for ChecklistField; (b) focus, type, external change, blur: task:update carries the user's text (Field and ChecklistField); (c) edit criterion 1, blur, focus/blur criterion 2 before the echo (update gated), then tick: the edit survives and every update carries 'alpha EDITED'; (d) tick saves immediately, as '- [x] alpha'. All 5 probe tests green. Mutation check: field.tsx reverted to base turns 4 field.test.tsx tests red; checklist-field.tsx reverted to base turns 4 checklist-field.test.tsx tests red; both restored via git checkout. pnpm build, typecheck, lint, test all green (board 293, tokenomics 102, extension 939, graph 653). PR #141 CI checks green on head 3d96a89f.
environment: 'found by the PR #140 review gate, 2026-10-05; reproduced on base and on the fix'
