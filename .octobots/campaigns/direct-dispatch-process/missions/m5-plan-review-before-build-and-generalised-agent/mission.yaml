name: M5 - Plan review before build, and generalised agent-ops guards
status: done
description: 'Make the BA + tech-lead plan review a structural step, enforced in the script AND the UI: set-status.js and the extension''s status dropdown (BoardHost.setStatus) refuse to move a mission into `executing` (`active` maps to it) until a plan-review sign-off is recorded, with an explicit override (`--force=<reason>`; a confirm dialog). A legacy heading-only record is accepted with a warning (campaign decisions 9-11). Add the agent-ops rules solo learned (no `timeout` binary on macOS, nohup servers with full redirection and bounded readiness polling), a config-driven QA environment guard (qa-env.mjs), a declared test-lanes contract (AGENTS.md § Test lanes) and a parked-test scan. Dogfood in octoshell''s own CLAUDE.md and AGENTS.md.'
acceptance_criteria:
  - text: 'Given a mission and `set-status.js <parent-dir> "M<n> - ..." <state>` whose <state> maps to executing (active, executing, in progress, running) while the stored status is anything other than executing, when no section of the mission''s notes or its campaign''s notes (`<mission dir>/../../campaign.yaml`) satisfies the rule below, then it exits 3, prints to stderr each candidate `## Plan review (...)` heading with what it lacks (or that there is none) and how to record a review or override, and leaves the file byte-identical. Rule (one implementation: planReviewStatus(missionNotes, campaignNotes) in skill/mission-planner/scripts/plan-review.mjs, imported by set-status.js): a candidate section starts at a column-0 line matching `^## Plan review \((.*)\)[ \t]*$` and ends at the next column-0 `## ` line, so `## Plan review overridden (...)` and `## Plan review record shape ...` can never match. (a) Strict record: the section has a column-0 `Reviewers:` line holding the tokens `ba` and `tech-lead`, and a column-0 line `Verdict: approved` or `Verdict: approved with nits` (case-insensitive): allowed, no warning. (b) Legacy record: the section has NO column-0 `Reviewers:` line and NO column-0 `Verdict:` line, and the heading''s parenthesised text names the BA (`ba`, or the persona name `Alex`) and the tech lead (`tech-lead`, or the persona name `Rio`): allowed, exit 0, and stderr prints `warning: legacy plan review "<heading>" (<mission|campaign> notes) has no Reviewers:/Verdict: lines; accepted`. Persona names count only inside a legacy heading, never on a `Reviewers:` line. `ba` and `tech-lead` match case-insensitively, `Alex` and `Rio` case-sensitively, and a token never has a letter, digit, `_` or `-` next to it (tech-leadership, bash and Rion do not count). Indented lines are prose. Everything else is refused, including a section with `Verdict: changes requested` (even under a heading naming both) and a heading that names only one reviewer. A strict record wins over a legacy one, so the warning prints only when a legacy record is the sole match. `--force=<reason>` (non-empty; accepted in any argv position and removed before the state words are joined; a bare `--force` exits 2) flips a refused move and appends `## Plan review overridden (<YYYY-MM-DD UTC>)` followed by the reason to the mission notes; when the rule already allows the move, --force adds nothing. Moves to draft, awaiting approval, done, failed or cancelled, and executing -> executing, are never gated. Exit 1 keeps its meaning (no such entity)'
    done: true
  - text: 'The host enforces the same rule through planReviewStatus exported from @octoshell/board (a TS mirror of plan-review.mjs): `BoardHost.setStatus(kind, id, status, opts?: {force?: string})` returns `{ok: true} | {ok: false, reason: "plan-review-missing", message}`, and `DispatchCtx.dialog.confirm(message, actionLabel): Promise<boolean>` is wired in extension.ts to a modal `vscode.window.showWarningMessage`. Choosing a gated status in the mission dropdown (into executing from another status, as in AC1) without a satisfying review shows the modal naming the missing review. Cancel leaves the YAML byte-identical, and the dropdown re-renders the stored status. Confirm calls setStatus with `force: "confirmed in the extension''s status dropdown"`, which flips the status and appends the same overridden note. A move allowed by a strict or a legacy record flips with no dialog and no other message (the legacy warning is set-status.js output only; campaign decision 12). Campaign, task and bug status changes are unaffected. packages/board/test/plan-review-parity.test.ts feeds both implementations the shared case table (packages/board/test/fixtures/plan-review-cases.json) and every (mission notes, campaign notes) pair of the boards in OCTOBOTS_BOARD_COPIES (else a temp copy of the repo''s own .octobots/), and asserts identical results (ok, legacy, heading, where, candidates)'
    done: false
  - text: 'mission-planner § Plan review says: dispatch ba and tech-lead in parallel (read-only) with explicit model:; each must run the queries, read real rows and grep call sites per AC, and return blocking vs nits; findings are resolved on the board, user decisions go back to the user, and the result is recorded as `## Plan review (<names or roles>, <date>)` with column-0 `Reviewers: ba (<name>), tech-lead (<name>)` and `Verdict: approved | approved with nits | changes requested` lines (the strict shape of AC1; the planner never writes the legacy heading-only form); octobots-doctor (M7) says that when set-status.js warns that a legacy plan-review record lacks its Reviewers:/Verdict: lines, the agent offers to add them (role tokens ba and tech-lead, the verdict the record states) and writes them only with the user''s OK'
    done: true
  - text: 'Given `.octobots/qa-env.json` in the current directory (or `--config <path>`) shaped `{"vars": {"<ENV_NAME>": "<template containing {db}>", ...}, "name_pattern": "<regex>", "probe": "<optional shell command>"}`, `qa-env.mjs <db> -- <cmd...>`: exits 3 without executing <cmd> when <db> does not match name_pattern; exits 3 without executing when any declared template lacks {db}, naming that var; exits 3 naming the expected path when the config file is missing; otherwise exports every declared var with {db} replaced; when probe is set, runs it with those vars and exits 4 without executing <cmd> unless its trimmed stdout equals <db>; then executes <cmd>, passes its exit code through and prints the target DB name to stderr'
    done: true
  - text: 'mission-execution states: start servers with `nohup ... > log 2>&1 < /dev/null &` and poll readiness with a bounded `curl -m 2` loop; macOS has no `timeout`, so use the Bash tool timeout or `perl -e ''alarm shift; exec @ARGV'' N cmd`; never background a test command (the only exceptions are non-terminating servers/watchers); QA server, migration and seed commands run through qa-env.mjs'
    done: true
  - text: 'Given a repo, `scan-parked.js [--root <dir>] [--json]` scans the files `git ls-files` lists under --root (default the repo root) that match test globs (*.test.*, *.spec.*, test_*.py, *_test.py, anything under a tests/ or test/ dir), excluding node_modules/, dist/ and its own test fixtures. Unsigned hits: pytest `@pytest.mark.xfail`/`@pytest.mark.skip` without reason=, any imperative `pytest.xfail(` or `pytest.skip(` call, and vitest/jest `.skip(`, `.todo(`, `.fails(`, `xit(`, `xdescribe(` as call tokens (`process.exit(` and other identifiers that merely end in xit are not hits). Allowed: skipIf/runIf, and pytest skipif with a reason. A `.octobots/parked-signoff.txt` line `<path>:<line> <who> <YYYY-MM-DD>` exempts a hit. It exits 1 on any unsigned hit, else 0; `--json` prints {unsigned: [{file, line, text}], allowed: [{file, line, text}]}. On octoshell it exits 0 and lists packages/graph/test/vault-calibration.test.ts:10 as allowed'
    done: true
  - text: '`doctor.js --json` reports a finding {level: "warn", area: "lanes"} when AGENTS.md has no `## Test lanes` section declaring `fast:` and `coverage:` commands, and none when it does; octoshell''s AGENTS.md declares them (fast: pnpm --filter <pkg> test, coverage: pnpm coverage) and its CLAUDE.md carries the generalised rules; gate phase 1 calls scan-parked.js; primer.mjs''s octobots-doctor line names a missing lanes declaration (M7-AC6); octobots-doctor (M7) says a `lanes` finding is resolved by proposing an AGENTS.md `## Test lanes` section from the project''s documented commands and writing it only with the user''s OK'
    done: true
