notes: |
  ## Plan review record shape (decision, final 2026-10-05)

  Campaign decisions 9-12 settled the open questions. The rule is AC1; in short:
  - Strict record. This is what the planner writes, and it prints no warning. The example below is indented so it is not itself a record:
      ## Plan review (Alex + Rio, 2026-10-05)
      Reviewers: ba (Alex), tech-lead (Rio)
      Verdict: approved with nits
  - Legacy record, accepted with a set-status.js warning: a heading that names both reviewers by role token or by the persona names Alex and Rio, with no column-0 Reviewers: or Verdict: line in its section. The real example is solo uwb-ranging-ingest-vendor-v01's campaign notes.
  - Never counts: `## Plan review overridden (...)`; a Reviewers: line that names only persona names; a Verdict other than approved or approved with nits; a Verdict line without a Reviewers line; a heading that names one reviewer; indented lines; lines after the next `## ` heading.
  - Self-approval check (rule spike, 2026-10-05, scratchpad pr2-spike.mjs, run on these notes after this edit): this section's heading does not match `^## Plan review \(` and its examples are indented, so these M5 notes alone are refused. The campaign's own record is strict and is allowed with no warning.
  - Gated: a move INTO executing from any other stored status (decision 11). A refusal exits 3, because exit 1 already means 'no entity' and exit 2 means usage. Override: `--force=<reason>` on the script, the modal confirm in the UI. Both append `## Plan review overridden (<YYYY-MM-DD UTC>)` plus the reason, so the bypass is on the board.
  - One rule, two implementations: plan-review.mjs (pack, dependency-free, imported by set-status.js) and its mirror planReviewStatus in packages/board (used by BoardHost.setStatus). packages/board/test/plan-review-parity.test.ts holds them together over a shared table and every real notes pair. This is the dual-implementation hazard of entity-io.mjs and entity-schema.ts. The dropdown calls BoardHost.setStatus, never the script. The confirm is a host modal (DispatchCtx.dialog.confirm), not webview UI. The work-log and mission-gate hooks act only on a status change that happened (M2-AC8), so a refused start is never logged.
  - Spike results on real data (2026-10-05): solo has 115 missions, and 6 are allowed (all uwb, legacy, through the campaign notes). This campaign has 6 of 6 allowed (strict, through the campaign notes).

  ## Planning notes (Rio, 2026-10-05)

  User decisions 3 and 6 apply (UI enforcement; AGENTS.md § Test lanes; qa-env.mjs config-driven; mission-input.js retired in M2).
  Solo's .agents/manual-qa/qa-db.sh hard-codes EDGESERVER_* and is the model for qa-env.mjs (exit 3 refused, exit 4 probe mismatch).
  Octoshell's lanes: fast = `pnpm --filter <pkg> test`, coverage = `pnpm coverage`; parked-test baseline is one allowed skip: packages/graph/test/vault-calibration.test.ts:10 describe.skipIf(!HAS_VAULT).
  Real plan-review examples: this campaign's own notes carry the strict record of 2026-10-05 (the allow case). Solo uwb-ranging-ingest-vendor-v01's campaign notes carry a heading-only record from 2026-10-02 (the legacy accept-with-warning case; its M5 is cancelled, and cancelled -> executing is a gated move). Solo epic-013 M10 ('M10 - One setup flow, preset warnings, and edge-side exception authorization') is draft, and neither it nor its campaign has a record (the refuse case).

  ## Spec clarifications (T5.1 review, Rio, 2026-10-06)

  Rulings on AC1 wording, made in the T5.1 review (PR #156, commit bc65bf0e). T5.2's TS mirror copies them; the shared case table packages/board/test/fixtures/plan-review-cases.json encodes each.
  1. "(case-insensitive)" covers the whole Reviewers:/Verdict: line, keys included: `verdict: changes requested` under a heading naming both reviewers is a Verdict line, so the section is refused, not accepted as legacy.
  2. Conflicting verdicts are refused: a strict section needs at least one approving Verdict: line AND every column-0 Verdict: line approving (missing string: "a Verdict: line that is not approved").
  3. Token neighbours are Unicode letters/digits (\p{L}, \p{N}) plus _ and -.
  4. A --force reason that starts with # is written escaped (\#), so an override note can never forge a review heading. BoardHost.setStatus applies the same escape.
  5. An unreadable campaign.yaml (malformed, BOM) is treated as empty campaign notes and named in the refusal; it never exits 1.
  Left literal (non-blocking, would need an AC change): a record inside a fenced code block counts; `**Verdict:**`, `- Verdict:` and `Verdict :` are not Verdict lines.

  ## QA verification (T5.6, qa-engineer, 2026-10-06; full record in the T5.6 task notes)

  Verdict: all 13 cases run; 11 PASS, 2 BLOCKED (TC-004 live half manual, pending the user's F5; TC-008 step 2 UNREACHABLE), 0 FAIL, no bug filed. Run file: `.octobots/campaigns/direct-dispatch-process/tests/m5/runs/RUN-2026-10-06-001.md`; evidence in `tests/m5/evidence/`. Data safety: solo's `git status --short` and its `.octobots` sha256 manifest (1209 files) are identical before and after, octoshell's own `.octobots` (outside this campaign) too; no database created, dropped or written.

  Per case (pre-existing record, observed value):
  - TC-001 PASS: solo epic-013 M10 (draft, 0 review headings): executing, active, in progress, running each exit 3, file unchanged; other states and draft->done/failed exit 0.
  - TC-002 PASS: this campaign's strict plan-review record (copy of octoshell's board), M6: exit 0, empty stderr, status executing.
  - TC-003 PASS: solo M10 (copy): bare --force exit 2; --force=<reason> in last, first and middle argv position exit 0 with 3 dated overridden notes; a plain move after that exit 3.
  - TC-004 BLOCKED (manual): automatable half PASS (board-host + rpc-dispatcher on solo's board copy, 69 passed); the F5 half (modal, Escape, no message on legacy) is pending the user, script `tests/m7/manual/T7.4-F5-script.md` Part C.
  - TC-005 PASS: parity vitest on both board copies, 2 passed; solo 6 of 115 missions allowed (uwb, legacy, via campaign notes); octoshell campaign 7 of 7 strict; M5 notes alone refused.
  - TC-006 PASS: skill-conventions vitest, 141 passed (planner Plan review, doctor legacy + lanes paragraphs, execution rules, gate calls scan-parked.js).
  - TC-007 PASS: solo's real var names, `edgeserver`: exit 3, command not run; no config: exit 3 naming the path.
  - TC-008 BLOCKED: step 1 PASS (both DSNs end /qa_m5), step 3 PASS (probe prints postgres: exit 4, command not run; the signal race fix re-run, qa-env.test.ts 50 passed x3), step 2 UNREACHABLE: a local Postgres runs but has no `qa_m5` database, none may be created, and the probe is never stubbed.
  - TC-009 PASS: SYNC template without {db}: exit 3 naming EDGESERVER_POSTGRES_SYNC_DSN, command not run.
  - TC-010 PASS: octoshell: exit 0, 0 unsigned, 10 allowed incl. vault-calibration.test.ts:10, octograph.mjs not a hit; throwaway clone with it.skip: exit 1, then exit 0 after a signoff line.
  - TC-011 PASS (case text corrected: with --root the path is printed relative to the root): f2e7812d^ edgeserver/tests: .unsigned is test_m6_solve_over_the_wire_e2e.py:474, exit 1, same set as the independent grep; today's solo tree 0/0, exit 0; pytest -rxs not run.
  - TC-012 PASS (case text corrected: octoshell gets one `ok` lanes finding, no warning): solo copy one {warn, lanes}; octoshell copy none; CLAUDE.md carries the rules.
  - TC-013 PASS: uwb legacy heading exit 0 with the exact warning line, status executing; one-reviewer and changes-requested derivations exit 3, status cancelled, file unchanged.

  Mission criteria with evidence (recorded here and in the M5 mission notes; this task ticks only its own criterion): AC1 (TC-001, 002, 003, 005, 013), AC3 and AC5 (TC-006), AC6 (TC-010, 011), AC7 (TC-006, 012; primer line per T5.5 QA). NOT fully evidenced: AC2 (TC-004's live F5 half pending) and AC4 (TC-008 step 2: the matching-probe-then-run path on a real qa_m5 database is UNREACHABLE; exit 3 and 4 refusals and the var export are proved on real var names).

  Not pass: TC-004 (blocked, manual live half pending the user's F5) and TC-008 (blocked, step 2 UNREACHABLE: no `qa_m5` database exists and none may be created).

