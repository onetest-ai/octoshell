name: B1 - set-status.js plan-review refusal prints an indented record template that the gate would refuse if copied
status: done
severity: minor
description: Found by the T5.3 review and T5.3 QA. When set-status.js (T5.1, pack skill/mission-planner/scripts/set-status.js) refuses a move into executing, its stderr shows how to record a plan review, but the record template is printed indented by 2 spaces. AC1 treats indented lines as prose, so an agent or person who copies the template verbatim into the notes gets a record the gate refuses again. Also, when a candidate section exists but its verdict is not approving, the refusal opens with 'no plan review is recorded' before naming the real reason, which misleads.
steps_to_reproduce: 'On a temp board, run set-status.js <campaign> "M<n> - ..." active on a mission with no review; copy the printed template lines verbatim into the mission notes via entity-io; run set-status.js again: exit 3. Separately, record `## Plan review (ba, tech-lead, <date>)` with Reviewers: ba (x), tech-lead (y) and Verdict: changes requested; the refusal''s first line says no plan review is recorded.'
expected: The printed template is column-0 (or clearly fenced so the lines themselves are column-0) and, copied verbatim with a real verdict, passes the gate; the same template text as mission-planner § Plan review's example. The refusal's opening line distinguishes 'no plan review recorded' from 'a plan review is recorded but <what it lacks>'. BoardHost's confirm-dialog message (T5.2) uses the same wording. Tests assert copy-the-template-then-start succeeds.
actual: Template indented by 2 spaces (copied verbatim it is refused); opening line says 'no plan review is recorded' even when a non-approving record exists.
rca: 'Root cause: the refusal builders (set-status.js refuse() and write.ts planReviewRefusal()) emitted the template as ordinary message lines with a 2-space indent in the script, and a fixed "no plan review is recorded" opening regardless of the candidate sections, so copying the printed lines produced indented (prose) lines that the gate does not count and a misleading first line. Fix (PR #159): both builders now pick the opening reason from whether a Plan review section exists, and print the template between marker lines at column 0, with identical wording/template in the script, BoardHost confirm message and mission-planner SKILL example. Tests: copy-template-then-start exits 0 and flips the mission to executing; first-line wording for none vs non-approving; rpc-dispatcher confirm message. QA verified black-box on an installed pack in a shared clone of auqanautica (M10 draft mission).'
environment: pack v57, feat/direct-dispatch-process-m5 at 6b5ebdfe, 2026-10-06
