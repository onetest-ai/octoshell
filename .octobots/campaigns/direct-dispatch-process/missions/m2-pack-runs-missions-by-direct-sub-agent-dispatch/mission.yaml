notes: |-
  ## Planning notes (Rio, 2026-10-05)

  M2 goes before M3: the pack's scripts are dependency-free .mjs with no import edge to packages/board, so the extension keeps compiling while it still reads workflows; M3 then removes the board types and every consumer together.
  Solo-specific text to generalise when porting: solo mission-execution :116 (edgeserver/app search scope), :118-121 (uv run pytest, make edgeserver-test-fast, 'This Mac'), :122-123 (make ci). Defect to fix while porting: the fork has two rules numbered 7. Solo gate :85-86 (make edgeserver-test-fast, make coverage). Gap: the fork never tells QA to run the mission's tests/m<n>/ cases (M4 adds it).
  Retired files must go into RETIRED_SKILLS/RETIRED_FILES (octobots-skill.ts:20,26) or copyTree (:95-105) leaves them forever. mission-planner's create-team.js (solo-only) is not shipped and must survive an upgrade.
  Solo's `version: 57-local` parses to null (parseVersion regex), so packStatus reports solo not-installed today; accepting the re-install prompt BEFORE v57 ships would roll solo back to v56 workflows (tell the user to decline until 0.1.0). From M7 on, a `57-local` skill counts as installed but deviated, and the install offers to reconcile it (decision 13, revised; M7).

  ## Plan-review fixes (2026-10-05)

  - CI must stay green on the M2 branch: packages/board/test/extract-meta-parity.test.ts:11 imports the pack's extract-meta.mjs, which T2.3 deletes, so T2.3 deletes that test too (the TS extract-meta.ts and its own tests go in M3 T3.3).
  - QA calls installPack through the committed harness apps/vscode-extension/scripts/qa/install-pack.mjs (T2.3), never an ad-hoc .qa/ script.
  - AC8 (hooks confirm the status change): hooks/work-log.mjs:85 logs any `active` without checking the result, which would attribute a planning session to a mission once M5 can refuse a start. It is testable before M5 with a set-status.js call for a title that does not exist, chained with `; echo`.
  - AC3's workflow.json half has no real record (neither board has a workflow.json): UNREACHABLE on real data, covered only by the scripts-cli-scenarios case.

  ## Local-fork protection: moved to M7 (2026-10-05)

  The warn-first design that was here (T2.5, AC9/AC10) was superseded the same day by campaign decision 13 (revised): agent-driven reconcile. It is planned as M7, which lands after M2. M2 keeps today's overwrite behaviour; its TCs say so.

  ## QA verification

  T2.5, qa-engineer, 2026-10-05. Run record: `.octobots/campaigns/direct-dispatch-process/tests/m2/runs/RUN-2026-10-05-001.md` (evidence under `tests/m2/evidence/`). 11 of 12 cases pass, 1 fails (TC-012, existing bug B3); no case blocked. TC-009 was executed by the orchestrator (QA agents cannot dispatch sub-agents). All cases ran on copies; baselines of `git status --short` for solo and octoshell compared at the end: solo identical, octoshell shows only the T2.5 board files.

  Mission AC -> test case(s) -> record:
  - M2-AC1 (workflow skill + 7 scripts gone; 4 skills): TC-001 PASS, TC-002 PASS, TC-008 PASS (deviation noted: a second historical-reference paragraph in mission-planner SKILL.md, no execution instruction).
  - M2-AC2 (installPack retires them, keeps create-team.js): TC-001 PASS, TC-002 PASS, TC-010 PASS (before upToDate false, after true, all pack skills v57).
  - M2-AC3 (validate.js warns per workflows/ folder, same exit; workflow.js exits 2): TC-003 PASS, TC-004 PASS (1 mission warning, 5 on the campaign), TC-005 PASS. The workflow.json half is UNREACHABLE on real data (neither board has one); covered only by scripts-cli-scenarios.test.ts.
  - M2-AC4 (doctor.js one warn with count + fix): TC-006 PASS (1 warn, count 6, 0 fail, fix never suggests deleting).
  - M2-AC5 (mission-execution = direct dispatch): TC-008 PASS, TC-009 PASS (5/5 plan an Agent dispatch with model:, 0/5 Workflow), TC-011 PASS.
  - M2-AC6 (gate = 5 dispatched phases + stopping rule): TC-011 PASS.
  - M2-AC7 (gate hook says relay, not 'directly'; coverage:pack passes): TC-007 PASS; `pnpm coverage:pack` exit 0, 96.53/78.79/98.18/96.53 (evidence/AC7-coverage-pack.md; no TC maps it).
  - M2-AC8 (hooks act only on a real status change): TC-012 FAIL. The no-such-mission and control cases pass, but the hooks act when the status EQUALS the request: a repeated `done` re-prints the gate directive and a repeated `active` appends a duplicate work-log line. This is bug B3 (already filed, not re-filed). The AC's literal text (acts when status now equals the requested state) is implemented; the case's Expected Final State (a call that changed nothing is silent) is not.

  Mission ACs are not ticked by this task. Open bugs: B1, B2, B3 (B3 decides AC8).


  ## AC8 tightened (2026-10-05)

  AC8 originally read 'act only when its status now equals the requested state'. M2 TC-012 expected a real transition, and bug B3 (PR #125) delivered that, so AC8 now states the transition contract. The Claude Code payload field was confirmed live: PostToolUse Bash carries tool_response.stdout, with stderr merged in. Known limit: a deliberate double forgery (the set-status command text plus an echoed matching transition line, on an already-done mission) still acts. The hooks are not a security boundary.
