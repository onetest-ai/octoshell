tokenomics:
  effort_days: 3
  size_tshirt: L
  complexity_score: 17
notes: |-
  ## Planning notes (Rio, 2026-10-05)

  M2 goes before M3: the pack's scripts are dependency-free .mjs with no import edge to packages/board, so the extension keeps compiling while it still reads workflows; M3 then removes the board types and every consumer together.
  Solo-specific text to generalise when porting: solo mission-execution :116 (edgeserver/app search scope), :118-121 (uv run pytest, make edgeserver-test-fast, 'This Mac'), :122-123 (make ci). Defect to fix while porting: the fork has two rules numbered 7. Solo gate :85-86 (make edgeserver-test-fast, make coverage). Gap: the fork never tells QA to run the mission's tests/m<n>/ cases (M4 adds it).
  Retired files must go into RETIRED_SKILLS/RETIRED_FILES (octobots-skill.ts:20,26) or copyTree (:95-105) leaves them forever. mission-planner's create-team.js (solo-only) is not shipped and must survive an upgrade.
  Solo's `version: 57-local` parses to null (parseVersion regex), so packStatus reports solo not-installed today; accepting the re-install prompt BEFORE v57 ships would roll solo back to v56 workflows (tell the user to decline until 0.1.0). From T2.5 on, a `57-local` skill counts as installed but locally changed, and the install asks before overwriting it (decision 13, AC9/AC10).

  ## Plan-review fixes (2026-10-05)

  - CI must stay green on the M2 branch: packages/board/test/extract-meta-parity.test.ts:11 imports the pack's extract-meta.mjs, which T2.3 deletes, so T2.3 deletes that test too (the TS extract-meta.ts and its own tests go in M3 T3.3).
  - QA calls installPack through the committed harness apps/vscode-extension/scripts/qa/install-pack.mjs (T2.3), never an ad-hoc .qa/ script.
  - AC8 (hooks confirm the status change): hooks/work-log.mjs:85 logs any `active` without checking the result, which would attribute a planning session to a mission once M5 can refuse a start. It is testable before M5 with a set-status.js call for a title that does not exist, chained with `; echo`.
  - AC3's workflow.json half has no real record (neither board has a workflow.json): UNREACHABLE on real data, covered only by the scripts-cli-scenarios case.

  ## Local-fork protection (decision 13, 2026-10-05)

  Owned by T2.5; the rule is AC9 and AC10.
  - Detection reads only SKILL.md: its first `version:` line, and its sha256. A skill is locally changed when the value is not an integer (reason `label`), or when the table lists hashes for (skill, N) and the file matches none of them (reason `content`). If the table has no entry for (skill, N), the skill cannot be compared and counts as unchanged, which is today's behaviour. Skills are checked in OCTOBOTS_SKILLS order, then RETIRED_SKILLS order.
  - What the extension compares against: the VSIX ships only the current pack, so the reference for older versions is a committed table, apps/vscode-extension/src/host/shipped-skill-hashes.json (`{"<version>": {"<skill>": ["<sha256>", ...]}}`), bundled into dist/extension.js. It is generated by apps/vscode-extension/scripts/shipped-skill-hashes.mjs, which walks the git history of resources/octobots-pack/skill/*/SKILL.md (including workflow-designer and the v18 `octobots`) and adds the current files. test/shipped-skill-hashes.test.ts fails when a shipped SKILL.md's hash is not listed under OCTOBOTS_PACK_VERSION. Lists are appended, not replaced, so intermediate v57 builds from M1-M5 stay recognised as shipped files. This follows the graph-payload-versions.json precedent.
  - The modal is shown by installOctobotsPack before the hooks and tools questions. VS Code adds Cancel itself. The text for solo:
      message: Octobots: 2 pack skill(s) in this workspace were changed locally.
      detail:  Installing the Octobots pack v57 would overwrite or delete these skills:
               • mission-execution: version 57-local (not a pack version)
               • mission-completion-gate: version 57-local (not a pack version)
               Overwrite: replace them with the pack's files.
               Keep my changes: install everything else and leave these skills as they are.
               Cancel: install nothing.
      buttons: Overwrite | Keep my changes (and Cancel)
    A `content` line reads `• <skill>: version <N> (differs from the pack's v<N> file)`. A retired skill's line adds `; retired in v57, so Overwrite deletes it` inside the parentheses. The text is built by a pure localChangesPrompt(changes, packVersion) so a vitest can assert it word for word.
  - The completion notification gains `Kept your local changes to <skills>.` after Keep. That is the install result message that exists today, not a new warning surface (decision 12 is about validation warnings).
  - installPack(srcRoot, repoRoot, opts) gains `localChanges?: "overwrite" | "keep"`, default "keep", so it never destroys a changed skill without an explicit yes, and returns `kept: string[]`. The QA harness takes `--local-changes=overwrite|keep` (default keep) and prints `{before, localChanges, result, after}`.
  - Nag rule: shouldPromptOnActivation(status, kept, packVersion) is true when the pack is not installed, when it would be out of date even ignoring local changes (upToDateExceptLocal false), or when any current local change is not in the kept record (different pack version, or different sha256). So after Keep, the prompt comes back once per new pack version or per new edit, never on every window open for the same fork.
  - Spike (2026-10-05, scratchpad fork-spike/spike.mjs, run on copies): a table built from octoshell's git history covers versions 18-57. Solo's .claude reports exactly mission-execution and mission-completion-gate (label 57-local). Octoshell's .claude reports nothing. A copy with one line appended to workflow-designer/SKILL.md reports workflow-designer (content, version 56, retired).
