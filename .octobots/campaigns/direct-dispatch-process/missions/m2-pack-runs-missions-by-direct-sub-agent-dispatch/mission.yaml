name: M2 - Pack runs missions by direct sub-agent dispatch
status: draft
description: Upstream solo's 57-local mission-execution and mission-completion-gate, with solo-specifics replaced by project-declared test lanes (declaration format lands in M5; until then 'the project's documented commands'). Delete workflow-designer and the 7 workflow scripts (incl. mission-input.js) from the pack, and retire them on install. The installer asks before it overwrites or deletes a locally changed skill (campaign decision 13). Replace workflow validation in validate.js with a non-fatal 'no longer read' warning. Fix the gate hook's directive, and make the gate and work-log hooks act only on a status change that actually happened. Board library and extension are untouched (M3), except the board test that imports a deleted pack script.
acceptance_criteria:
  - text: Given the v57 pack, skill/workflow-designer/ and scripts/{add-workflow,sync-meta,add-run,mission-input}.js, scripts/{extract-meta,workflow-meta}.mjs and scripts/vendor/acorn.mjs do not exist; OCTOBOTS_SKILLS (octobots-skill.ts:14) and doctor.js:63 list 4 skills
    done: false
  - text: Given a workspace with any of those installed, when installPack runs, then they are removed (except a locally changed retired skill kept under AC9), and files the pack never shipped (e.g. create-team.js) are kept
    done: false
  - text: Given a mission or campaign dir holding workflows/<slug>/ (workflow.js or workflow.json), when validate.js <dir> runs, then it prints one `warning:` line per folder naming the path and 'no longer read since pack v57', and the exit code is what the entity alone would produce; validate.js <path>/workflow.js exits 2 with 'not an entity file'
    done: false
  - text: Given a board with N workflows/ folders, doctor.js reports one `warn` (not `fail`) with the count and the fix
    done: false
  - text: 'mission-execution tells the orchestrator to: dispatch one sub-agent per phase with the Agent tool, in the foreground, with explicit model:; require a fenced JSON verdict and treat a missing one as BLOCKED; relay questions instead of nested spawning; resume from board + git and re-dispatch a dead agent; read the project''s fast and coverage lanes, naming no project-specific command (no `make` invocation such as `make ci` or `make <x>-test`, no edgeserver path, no `uv run`). It contains no `Workflow(` or workflow.js execution instruction, and the rules in its § Dispatch rules are numbered without duplicates'
    done: false
  - text: mission-completion-gate defines its 5 phases as orchestrator dispatches; defines blocking as an AC demonstrably unmet, a reproducible defect, or a security exposure with a PoC; allows one review round plus one fix round with residue filed as board bugs; green means 0 failed, 0 xfailed/todo and no skip without an environmental reason; coverage runs on the coverage lane only
    done: false
  - text: Given `set-status.js ... "M1 - ..." done`, hooks/mission-gate.mjs emits a directive that says the orchestrator relays Rio's questions to the devs and does not say 'directly'; `pnpm coverage:pack` still passes (90/90/90/70)
    done: false
  - text: 'Given a set-status.js command whose write did not happen (for example `set-status.js <campaign-dir> "M9 - no such mission" done; echo`, which exits 0 as a whole, or a start that set-status.js refused), hooks/mission-gate.mjs and hooks/work-log.mjs re-read the target entity''s YAML and act only when its status now equals the requested state: no gate directive is printed and no work-log line is written'
    done: false
  - text: 'Given a workspace whose .claude/skills holds a skill from OCTOBOTS_SKILLS or RETIRED_SKILLS (incl. workflow-designer) that is locally changed, meaning its SKILL.md `version:` value is not an integer (solo''s `57-local`), or it is an integer N and the file''s sha256 is none of the hashes apps/vscode-extension/src/host/shipped-skill-hashes.json lists for that skill at N (a version the table does not list cannot be compared and counts as unchanged), when the pack is installed (the Install Octobots Pack command, or Install on the activation prompt), then before any write the extension shows a modal `showWarningMessage` whose message is `Octobots: <n> pack skill(s) in this workspace were changed locally.`, whose detail lists one line per changed skill in the text of M2 notes § Local-fork protection, and whose buttons are `Overwrite` and `Keep my changes` (plus VS Code''s own Cancel). Overwrite installs as before. Keep my changes leaves every listed skill''s directory untouched (a kept retired skill is not deleted, and retired files inside a kept skill are not removed) and installs everything else. Cancel or Escape installs nothing. A workspace with no locally changed skill gets no modal (octoshell''s own v56 install; solo''s workflow-designer, which is byte-identical to the shipped v56 file)'
    done: false
  - text: 'Given a workspace where Keep my changes was chosen, then packStatus reports installed: true, upToDate: false, upToDateExceptLocal: true and localChanges listing the kept skills (skill, version, reason, retired, sha256), and the activation prompt is not shown again until the pack version changes, a kept SKILL.md''s bytes change, or another skill becomes locally changed (the extension records {packVersion, skill -> sha256} in workspaceState on Keep). After Overwrite, packStatus reports upToDate: true and an empty localChanges. The Install Octobots Pack command always asks again; the existing Not now answer on the activation prompt keeps today''s behaviour'
    done: false
