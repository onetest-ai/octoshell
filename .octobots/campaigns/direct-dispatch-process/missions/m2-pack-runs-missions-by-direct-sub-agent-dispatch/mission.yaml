name: M2 - Pack runs missions by direct sub-agent dispatch
status: draft
description: Upstream solo's 57-local mission-execution and mission-completion-gate, with solo-specifics replaced by project-declared test lanes (declaration format lands in M5; until then 'the project's documented commands'). Delete workflow-designer and the 7 workflow scripts (incl. mission-input.js) from the pack, and retire them on install. Protecting locally changed skills during an install is M7 (campaign decision 13, revised); until M7 lands, installPack overwrites them as it does today. Replace workflow validation in validate.js with a non-fatal 'no longer read' warning. Fix the gate hook's directive, and make the gate and work-log hooks act only on a status change that actually happened. Board library and extension are untouched (M3), except the board test that imports a deleted pack script.
acceptance_criteria:
  - text: Given the v57 pack, skill/workflow-designer/ and scripts/{add-workflow,sync-meta,add-run,mission-input}.js, scripts/{extract-meta,workflow-meta}.mjs and scripts/vendor/acorn.mjs do not exist; OCTOBOTS_SKILLS (octobots-skill.ts:14) and doctor.js:63 list 4 skills
    done: false
  - text: Given a workspace with any of those installed, when installPack runs, then they are removed, and files the pack never shipped (e.g. create-team.js) are kept (a locally changed skill's protection is M7's)
    done: false
  - text: Given a mission or campaign dir holding workflows/<slug>/ (workflow.js or workflow.json), when validate.js <dir> runs, then it prints one `warning:` line per folder naming the path and 'no longer read since pack v57', and the exit code is what the entity alone would produce; validate.js <path>/workflow.js exits 2 with 'not an entity file'
    done: false
  - text: Given a board with N workflows/ folders, doctor.js reports one `warn` (not `fail`) with the count and the fix
    done: false
  - text: 'mission-execution tells the orchestrator to: dispatch one sub-agent per phase with the Agent tool, in the foreground, with explicit model:; require a fenced JSON verdict and treat a missing one as BLOCKED; relay questions instead of nested spawning; resume from board + git and re-dispatch a dead agent; read the project''s fast and coverage lanes, naming no project-specific command (no `make` invocation such as `make ci` or `make <x>-test`, no edgeserver path, no `uv run`). It contains no `Workflow(` or workflow.js execution instruction, and the rules in its § Dispatch rules are numbered without duplicates'
    done: false
  - text: mission-completion-gate defines its 5 phases as orchestrator dispatches; defines blocking as an AC demonstrably unmet, a reproducible defect, or a security exposure with a PoC; allows one review round plus one fix round with residue filed as board bugs; green means 0 failed, 0 xfailed/todo and no skip without an environmental reason; coverage runs on the coverage lane only
    done: false
  - text: Given `set-status.js ... "M1 - ..." done`, hooks/mission-gate.mjs emits a directive that says the orchestrator relays Rio's questions to the devs and does not say 'directly'; `pnpm coverage:pack` still passes (90/90/90/70)
    done: false
  - text: 'Given a set-status.js command whose write did not happen (for example `set-status.js <campaign-dir> "M9 - no such mission" done; echo`, which exits 0 as a whole, or a start that set-status.js refused), hooks/mission-gate.mjs and hooks/work-log.mjs re-read the target entity''s YAML and act only when its status now equals the requested state: no gate directive is printed and no work-log line is written'
    done: false
documents:
  - label: M2 functional test cases
    target: .octobots/campaigns/direct-dispatch-process/tests/m2/README.md
tokenomics:
  effort_days: 2.5
  size_tshirt: L
  complexity_score: 15
notes: |-
  ## Planning notes (Rio, 2026-10-05)

  M2 goes before M3: the pack's scripts are dependency-free .mjs with no import edge to packages/board, so the extension keeps compiling while it still reads workflows; M3 then removes the board types and every consumer together.
  Solo-specific text to generalise when porting: solo mission-execution :116 (edgeserver/app search scope), :118-121 (uv run pytest, make edgeserver-test-fast, 'This Mac'), :122-123 (make ci). Defect to fix while porting: the fork has two rules numbered 7. Solo gate :85-86 (make edgeserver-test-fast, make coverage). Gap: the fork never tells QA to run the mission's tests/m<n>/ cases (M4 adds it).
  Retired files must go into RETIRED_SKILLS/RETIRED_FILES (octobots-skill.ts:20,26) or copyTree (:95-105) leaves them forever. mission-planner's create-team.js (solo-only) is not shipped and must survive an upgrade.
  Solo's `version: 57-local` parses to null (parseVersion regex), so packStatus reports solo not-installed today; accepting the re-install prompt BEFORE v57 ships would roll solo back to v56 workflows (tell the user to decline until 0.1.0). From M7 on, a `57-local` skill counts as installed but deviated, and the install offers to reconcile it (decision 13, revised; M7).

  ## Plan-review fixes (2026-10-05)

  - CI must stay green on the M2 branch: packages/board/test/extract-meta-parity.test.ts:11 imports the pack's extract-meta.mjs, which T2.3 deletes, so T2.3 deletes that test too (the TS extract-meta.ts and its own tests go in M3 T3.3).
  - QA calls installPack through the committed harness apps/vscode-extension/scripts/qa/install-pack.mjs (T2.3), never an ad-hoc .qa/ script.
  - AC8 (hooks confirm the status change): hooks/work-log.mjs:85 logs any `active` without checking the result, which would attribute a planning session to a mission once M5 can refuse a start. It is testable before M5 with a set-status.js call for a title that does not exist, chained with `; echo`.
  - AC3's workflow.json half has no real record (neither board has a workflow.json): UNREACHABLE on real data, covered only by the scripts-cli-scenarios case.

  ## Local-fork protection: moved to M7 (2026-10-05)

  The warn-first design that was here (T2.5, AC9/AC10) was superseded the same day by campaign decision 13 (revised): agent-driven reconcile. It is planned as M7, which lands after M2. M2 keeps today's overwrite behaviour; its TCs say so.
