name: T2.5 - installPack warns before overwriting locally changed skills
status: draft
role: js-dev
description: |-
  Depends on T2.3 (same files: octobots-skill.ts and install-pack.mjs). Scope:
  - apps/vscode-extension/src/host/shipped-skill-hashes.json, generated by apps/vscode-extension/scripts/shipped-skill-hashes.mjs [--write] from the git history of resources/octobots-pack/skill/*/SKILL.md plus the current files (M2 notes § Local-fork protection);
  - a new pure module apps/vscode-extension/src/host/pack-local-changes.ts exporting detectLocalChanges(repoRoot) -> LocalChange[] ({skill, version, reason: "label" | "content", retired, sha256}), localChangesPrompt(changes, packVersion) -> {message, detail, buttons} and shouldPromptOnActivation(status, kept, packVersion);
  - octobots-skill.ts: PackStatus gains localChanges and upToDateExceptLocal, and a skill with a non-integer version counts as present; installPack gains `localChanges?: "overwrite" | "keep"` (default keep) and returns kept[];
  - extension.ts installOctobotsPack: the modal before the hooks/tools questions, Cancel returns before any write, Keep records {packVersion, skill -> sha256} in context.workspaceState under `octobots.keptLocalSkills`, and the completion message names the kept skills; the activation prompt asks only when shouldPromptOnActivation is true;
  - install-pack.mjs: `--local-changes=overwrite|keep` (default keep), JSON {before, localChanges, result, after}; update T2.3's octobots-skill.test.ts case to pass overwrite.
  Out of scope: hooks, statusline and tools prompts (unchanged), and any change to how Not now behaves. Downstream: M2 TC-001, 002, 010, 013-015; M6-AC8 / TC-011 pass --local-changes=overwrite.
acceptance_criteria:
  - text: 'apps/vscode-extension/test/pack-local-changes.test.ts, on temp workspaces built from the shipped pack files (a `57-local` relabel, a one-line edit of a numeric-version file, a pristine copy, a version the table does not list, and the same for a retired workflow-designer; a synthetic unit check whose real-data counterparts are TC-013..015), proves: detectLocalChanges reports label and content changes in OCTOBOTS_SKILLS-then-RETIRED_SKILLS order and ignores pristine and unlisted-version skills; installPack with keep leaves each changed skill dir byte-identical (a retired one is not deleted) and installs the rest, with overwrite replaces them, and with no option keeps them; packStatus reports localChanges and upToDateExceptLocal; localChangesPrompt returns the exact message, detail and buttons of M2 notes § Local-fork protection; shouldPromptOnActivation is false after Keep for the same pack version and sha256, and true for a new pack version, a changed sha256 or a new changed skill (mission AC9, AC10)'
    done: false
  - text: apps/vscode-extension/test/shipped-skill-hashes.test.ts asserts every resources/octobots-pack/skill/*/SKILL.md sha256 is listed under OCTOBOTS_PACK_VERSION and the table has entries for workflow-designer at 56; `pnpm test` and `pnpm coverage:pack` are green
    done: false
  - text: apps/vscode-extension/test/qa-install-pack.test.ts runs install-pack.mjs with --local-changes=keep and =overwrite on a temp workspace holding a `57-local` skill and asserts {before, localChanges, result, after} for both
    done: false
  - text: the extension.ts wiring (modal before any write, Cancel writes nothing, Keep recorded in workspaceState, the activation prompt gated by shouldPromptOnActivation) is shown in a manual Extension Development Host run on a copy of solo's workspace, recorded in M2 TC-014 with screenshots
    done: false
