name: B3 - status hooks act when the status equals the request, not when it changed (re-fires the gate, logs refused starts)
status: done
severity: major
description: hooks/status-flip.mjs confirms a flip by checking that the YAML status NOW EQUALS the requested state, not that it CHANGED. Re-running `set-status ... done` on an already-done mission (or an `echo` naming one) re-fires the gate directive and appends a duplicate work-log line. Once M5 makes set-status refuse a start without a plan review, a refused `active` on a mission that is already executing would still be logged. M5 T5.1/T5.2 should settle this together with the refusal exit code (3).
steps_to_reproduce: In a scratch workspace with the shipped pack, set a mission done, then pipe `set-status.js <c> "M1 - x" done` (or `echo` of it) into mission-gate.mjs and work-log.mjs again.
expected: 'The hooks act only on a real transition: the before-state differed (e.g. set-status prints a transition line the hooks parse from tool_response, or exits 0 only on change) and the command''s exit status was 0.'
actual: The directive is printed and a work-log line is appended again.
rca: 'Cause: hooks/status-flip.mjs confirmed a flip by checking the mission YAML now EQUALS the requested state (statusNowEquals), which is also true after a re-run on a mission that is already there, so the gate directive and work-log line fired again; the hooks acted on the command text plus an end-state, never on a transition. Fix (PR #125, commits 0f23212 and 8f181ac): set-status.js writes nothing when the status is unchanged and prints a machine line, `octobots: status <kind> "<json title>" <from> -> <to>` or `... unchanged (<state>)`; the before-state is the canonical BoardModel status (so a hand-written `awaiting approval` is `awaitingApproval`, not a skipped gate). status-flip.mjs now acts only when a transition line in tool_response.stdout matches the call''s title and target AND the YAML holds the target; no tool_response, an unchanged line or a forged echo with an unchanged YAML are silent (fail closed). QA evidence: TC-012 PASS in RUN-2026-10-05-002 (real transition acts: gate 2383 bytes + one work-log line; real re-run prints `unchanged`, YAML byte-identical with same mtime, gate silent, no new line; M9 + `; echo`, forged echo, absent tool_response silent; non-canonical `in progress` and `awaiting approval` -> done act), plus blind probe on a copy of solo, hook vitests 50 passed, pnpm build/typecheck/lint/test/coverage:pack green (0 skipped), PR #125 checks pass. Known residual: a double forgery (command text and transition line echoed) against an already-done mission still acts.'
environment: 'found by the T2.2 review gate (PR #121, 2026-10-05), confirmed by QA'
