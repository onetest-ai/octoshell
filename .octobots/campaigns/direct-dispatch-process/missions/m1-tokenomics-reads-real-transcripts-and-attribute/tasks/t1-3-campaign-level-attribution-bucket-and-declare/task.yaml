notes: |-
  ## QA verification (part A, PR #115)

  Verdict: PASS for ACs 1-4 (part A). Part B (AC5, verify.mjs) is PENDING in a later PR; T1.3 stays executing and AC5 is not ticked. Branch feat/direct-dispatch-process-m1-t3a @ 920296b. QA 2026-10-05, black-box on the built pack first, then tests.

  Real-data probe (copy of solo .octobots/tokenomics + campaigns; nothing written under solo). Baseline = pre-T1.3 rollup.mjs from dbc17e9; new = this branch's rollup.mjs, both --no-gh on identical copies, 1637 segments.
  - Campaign rows (work_item_level=campaign, parent_ref null, _octobots.mission_id null): edge-ops-ui [chore/close-edge-ops-ui-campaign, feat/edge-ops-ui]; emulator-arena-loop [campaign/emulator-arena-loop]; edgeserver-auth [fix/edgeserver-auth-coach-gating-gaps]. Last two are findings beyond campaign Real-data notes (1 segment each, slug in the branch, campaign has >1 mission).
  - campaign/sensor-assignment-uplift stays on sensor-assignment-uplift/M1 (story, M1).
  - unattributed.segments 490 -> 459 (-31 = 29+1+1). After declaring tokenomics.branches [chore/uwb-ranging-plan] on the uwb campaign IN THE COPY (via entity-io): 454, and a 4th row uwb-ranging-ingest-vendor-v01 [chore/uwb-ranging-plan]; unattributed.branches 31 -> 27 -> gone for feat/edge-ops-ui, campaign/emulator-arena-loop, chore/uwb-ranging-plan.
  - All 51 mission rows identical baseline vs new (diff of ref, sorted branches, sessions, turns, tokens, cost): empty, with and without the uwb declaration.
  - Totals invariant: sum(runs[].tokens)+unattributed.tokens = 8,759,714,164 in baseline, new, and new+uwb; matches an independent sum over segments.jsonl tokens_by_model (762,516 in + 11,652,851 out + 8,507,708,514 cache read + 239,590,283 cache create).
  - render.mjs on the new output: HTML has <h2>Campaign-level work</h2> table listing the 4 campaign rows; "Missions measured" tile = 51 (campaign rows excluded; header said 51 missions, 4 campaign rows).

  Gates (root, foreground): pnpm build, typecheck, lint, test, coverage:pack all exit 0. Tests: board 388, extension 476, tokenomics 92, graph 653 passed; no skipped tests in tokenomics. CI on PR #115: build pass (both runs).

  Per-AC evidence:
  1. packages/tokenomics/test/rollup-parity.test.ts: 25/25 passed (verbose). 19 table cases cover steps 1-7 (incl. D2 bad -m falls through to worklog; D1 bare-session worklog ignored, ambiguous label -> unattributed), plus "exercises every one of the 7 steps", runs[] + unattributed identical (mjs spawned vs rollup.ts), totals invariant for both, cost invariant, and a real-board test. That test also passes with OCTOBOTS_TOKENOMICS_COPY=<solo copy> (6.1s) and asserts non-vacuity (mission row, campaign row, unattributed > 0).
  2. packages/board/test/campaign-tokenomics-roundtrip.test.ts 5/5: list form survives add-doc.js, comma-string survives set-status.js, TS dump byte-stable with tokenomics before notes, pack entity-io dump equals TS dump, validate reports no "not a campaign field".
  3. packages/tokenomics/test/render.test.ts 15/15 (campaign-level rows: Missions measured counts mission rows only, own heading, omitted when none, no-sizing finding excludes campaigns, cost-by-size excludes, total includes) and apps/vscode-extension/test/tokenomics-view-campaign-rows.test.tsx 6/6; also tokenomics-render-mjs.test.ts 3/3 for the pack renderer.
  4. After the root build, graph:payload:write left git tree unchanged (octograph.mjs bytes identical) and graph-payload.mjs --verify prints "octograph payload is current"; no versions.json line needed rewriting.

  Reviewer fix: 920296b made the real-board parity test always run (previously permanently skipped); it falls back to this repo's own .octobots. Reviewer's 24 one-sided mutation checks not re-run by QA; I read the parity test adversarially instead (non-vacuity asserts, board-derived synthetic segments, exact token equality).

  Known, not a T1.3 failure: the M2a/M2b row-keying defect (two missions sharing a mission id) predates this work and is filed as bug B4; the parity test merges rows sharing a mission id to account for it.

  Side note: running render.mjs with --help (no such flag) wrote a report.html into this repo's gitignored .octobots/tokenomics; harmless.
