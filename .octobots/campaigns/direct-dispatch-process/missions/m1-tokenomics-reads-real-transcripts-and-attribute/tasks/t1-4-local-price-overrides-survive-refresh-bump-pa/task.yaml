name: T1.4 - Local price overrides survive refresh; bump pack to v57
status: draft
role: js-dev
description: 'Lands FIRST in M1. Scope: (1) prices.local.json contract (mission AC6): the pack ships tokenomics/prices.local.json seeded with claude-opus-5-5 and claude-sonnet-5-5 at solo''s prices.json values; octobots-tokenomics.ts:21 adds it to PRESERVED so a re-install never overwrites a workspace''s copy; rollup.mjs:76-80 reads prices.json and prices.local.json from its own directory and resolves upstream-first; the pack''s update-prices.mjs rewrites only prices.json; packages/tokenomics/scripts/update-prices.mjs merges the pack''s prices.local.json under upstream into src/prices.data.ts (prices.ts:40-43 lookup unchanged; loadPrices() gets no workspace path, so the extension never reads a workspace''s prices.local.json at runtime); document this in the pack''s tokenomics/README.md. (2) The 56->57 bump exactly as ebf5496 did (constant, 5 SKILL.md, 4 markers: primer.mjs, run.mjs, backfill-worklog-sha.mjs, statusline.sh; regenerated graph payload; versions json). Out of scope: the release commit (T6.6). Downstream: every later mission ships under v57; T1.3 regenerates the payload against this 57 entry.'
acceptance_criteria:
