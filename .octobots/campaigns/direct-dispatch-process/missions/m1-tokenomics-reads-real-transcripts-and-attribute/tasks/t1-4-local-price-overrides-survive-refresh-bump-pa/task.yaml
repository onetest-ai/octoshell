name: T1.4 - Local price overrides survive refresh; bump pack to v57
status: done
role: js-dev
description: 'Lands FIRST in M1. Scope: (1) prices.local.json contract (mission AC6): the pack ships tokenomics/prices.local.json seeded with claude-opus-5-5 and claude-sonnet-5-5 at solo''s prices.json values; octobots-tokenomics.ts:21 adds it to PRESERVED so a re-install never overwrites a workspace''s copy; rollup.mjs:76-80 reads prices.json and prices.local.json from its own directory and resolves upstream-first; the pack''s update-prices.mjs rewrites only prices.json; packages/tokenomics/scripts/update-prices.mjs merges the pack''s prices.local.json under upstream into src/prices.data.ts (prices.ts:40-43 lookup unchanged; loadPrices() gets no workspace path, so the extension never reads a workspace''s prices.local.json at runtime); document this in the pack''s tokenomics/README.md. (2) The 56->57 bump exactly as ebf5496 did (constant, 5 SKILL.md, 4 markers: primer.mjs, run.mjs, backfill-worklog-sha.mjs, statusline.sh; regenerated graph payload; versions json). Out of scope: the release commit (T6.6). Downstream: every later mission ships under v57; T1.3 regenerates the payload against this 57 entry.'
acceptance_criteria:
  - text: 'packages/tokenomics/test/prices.test.ts and apps/vscode-extension/test/tokenomics-prices-local.test.ts prove mission AC6: after the pack''s update-prices.mjs refreshes prices.json (fetch stubbed in the test), rollup.mjs prices claude-opus-5-5 and claude-sonnet-5-5 from prices.local.json and prefers prices.json''s value on conflict; installTokenomics leaves an edited prices.local.json byte-identical; prices.data.ts carries both models'
    done: true
  - text: all markers, SKILL.md versions and the constant read 57 and graph-payload-versions.json has a 57 entry; apps/vscode-extension/test/graph-payload.test.ts and `pnpm --filter @octoshell/vscode-extension build` (--verify) are green (mission AC7)
    done: true
notes: |-
  ## QA verification
  Verdict: PASS. PR #112 (https://github.com/onetest-ai/octoshell/pull/112), CI green (both build jobs).
  Real record: solo (auqanautica) .octobots/tokenomics raw/segments.jsonl (1637 lines, 177 mentioning *-5-5), copied to scratch with the board; rollup.mjs from the pack run with --project-dir. Real record named: campaign uwb-ranging-ingest-vendor-v01, mission M2 (segment 011deac1-... feat/uwb-ranging-ingest-vendor-v01-m2-t4, tech-lead on claude-opus-5-5) plus M1, M3, M4, M6.
  Probes (built pack artifact, blind): update-prices.mjs with fetch stubbed (ok -> exit 0, prices.local.json sha unchanged; HTTP 503 -> exit 1, prices.json unchanged). rollup on the pristine pack prices.json + prices.local.json: M2 cost_by_model opus-5-5 = 24.90, sonnet-5-5 = 18.51 (both > 0 across 5 missions). Negative control with prices.local.json removed: all 0. Conflict (prices.json opus-5-5 at 8e-06 vs local 4e-06): M2 opus-5-5 = 49.80 (exactly 2x, upstream wins).
  AC1: tokenomics-prices-local.test.ts "keeps both models priced after update-prices.mjs refreshes prices.json, and prices.json wins on conflict" observed opus 4 / sonnet-before 2 / sonnet-after-conflict 9; "is preserved byte-identical when the pack is re-installed over an edited copy" passed; prices.test.ts "prices the locally-seeded claude-opus-5-5 and claude-sonnet-5-5 from the compiled-in table" passed (9/9); seed values equal solo prices.json (opus 4e-06/2e-05, sonnet 2e-06/1e-05).
  AC2: constant OCTOBOTS_PACK_VERSION = 57; markers primer.mjs, run.mjs, backfill-worklog-sha.mjs, statusline.sh all 57; no 56 pack markers left; graph-payload-versions.json has "57"; graph-payload.test.ts 16 passed and tokenomics-prices-local 5 passed (25 total in the two-file run); pnpm build (with --verify) exit 0. Full root build/typecheck/lint/test exit 0: board 372, tokenomics 44, graph 653, vscode-extension 452.
  Non-blocking findings (reviewer, confirmed): (1) no test for the packages/tokenomics scripts/update-prices.mjs merge precedence; (2) rollup.mjs uses a bare JSON.parse of prices.local.json - probed: a malformed file crashes rollup with an uncaught SyntaxError; (3) library -> app relative path in packages/tokenomics script. Also noted: rollup resolves TOK_DIR from --project-dir, not its own directory as the task description says; identical in an installed workspace.
