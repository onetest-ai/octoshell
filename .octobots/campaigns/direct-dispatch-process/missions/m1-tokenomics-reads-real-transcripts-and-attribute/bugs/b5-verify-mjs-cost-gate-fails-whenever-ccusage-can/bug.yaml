name: B5 - verify.mjs cost gate fails whenever ccusage cannot price the models (opus-5/5-5 at $0)
status: done
severity: major
description: ccusage 20.0.18 has no prices for claude-opus-5 / claude-opus-5-5 and reports $0 cost for those rows offline. The verify.mjs cost comparison then FAILs on any repo that uses current models, even when the token counts match exactly. This predates T1.3; it was exposed once verify read the right population.
steps_to_reproduce: On a COPY of solo with a fresh collect.mjs run on the T1.3b branch, run verify.mjs --project-dir <copy> using the real ccusage at .octobots/tools.
expected: When token totals match, verify passes. Cost is compared only for models ccusage can price; otherwise it is shown as info, naming the unpriced models.
actual: 'Tokens match (cache_read 0.00%, cache_create 0.00%, total 0.24%) but the cost check FAILs: $1388.34 ours vs $503.81 ccusage.'
rca: |-
  ccusage 20.0.18's bundled price table predates the opus-5 family, so it reports $0 for claude-opus-5, claude-opus-5-5 and claude-sonnet-5-5 rows. verify.mjs compared our full cost to ccusage's total unconditionally, so the $0 rows read as a ~176% collector miss even when tokens matched. Fix (0979dc4, 9bd6184): verify.mjs takes per-model cost from ccusage's modelBreakdowns, treats a model with tokens>0 and cost 0 as unpriced, subtracts our cost for those models and gates cost over the priced models only; if every model is unpriced, cost is info only. The notice names the unpriced models. Review fix 9bd6184: the unattributed bucket's cost_by_model existed only in rollup.mjs; mirrored in rollup.ts (+types.ts) and the parity test now compares per-model cost.

  QA evidence: QA 2026-10-05, PR #117 (onetest-ai/octoshell), head 9bd6184 (0979dc4 B5, 2c80a0b B1+B2, 9bd6184 review fix). Real record: solo (auqanautica) transcripts, frozen copies in a scratch project/HOME, real ccusage 20.0.18 from .octobots/tools, fresh collect then rollup then verify with --project-dir. Full gate green (pnpm build, typecheck, lint, test, coverage:pack); PR checks: build pass x2. B5 verified. Blind probe, 662 segments / 9 sessions: tokens 3,267,504,895 vs 3,275,374,949 (0.24%), cache_read and cache_create 0.00%; cost gated over priced models only $461.05 ours vs $503.81 ccusage = 8.49% (limit 10%) -> PASS, exit 0, note 'gated over priced models only (ccusage has no price for claude-opus-5, claude-opus-5-5, claude-sonnet-5-5)'. Negative: claude-sonnet-5 (priced) cost inflated +30% in runs.json -> $599.36 vs $503.81 = 18.97% FAIL, exit 1, COLLECTOR hint fired only there. Inflating unpriced claude-opus-5 by 50% -> still PASS. Mutations: dropping the unpriced subtraction and forcing costGated=false each fail the B5 tests; blanking costByModel in rollup.ts fails the parity tests. Residual (non-blocking): 8.49% leaves 1.5pt headroom; a $0-priced-but-actually-free model would be masked; an old runs.json lacking unattributed.cost_by_model gives a false FAIL.
environment: 'found by the T1.3b review gate (PR #116, 2026-10-05) on a copy of solo with real ccusage 20.0.18 offline'
