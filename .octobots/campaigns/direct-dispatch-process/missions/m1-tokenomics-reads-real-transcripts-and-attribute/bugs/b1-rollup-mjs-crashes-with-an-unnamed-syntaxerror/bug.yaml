name: B1 - rollup.mjs crashes with an unnamed SyntaxError on a malformed prices.local.json
status: done
severity: major
description: rollup.mjs reads the hand-edited workspace tokenomics/prices.local.json with a bare JSON.parse. Meanwhile packages/tokenomics/scripts/update-prices.mjs silently ignores a seed it cannot parse.
steps_to_reproduce: Copy the pack tokenomics dir; put `{` in prices.local.json; run `node rollup.mjs --project-dir <copy>`.
expected: A message naming prices.local.json and the parse error, then either a non-zero exit or pricing from prices.json alone (pick one and test it). The build script reports the same malformed seed.
actual: Uncaught SyntaxError that doesn't name the file; the whole rollup aborts.
rca: |-
  rollup.mjs parsed the hand-edited workspace tokenomics/prices.local.json with a bare JSON.parse, so a malformed file threw an uncaught SyntaxError that named neither the file nor its location and aborted the rollup; update-prices.mjs swallowed an unparseable seed with an empty catch. Fix (2c80a0b): rollup.mjs wraps the read in try/catch and writes 'tokenomics: WARNING ignoring <path>: <parse error>' to stderr, then prices from prices.json alone (exit status unchanged). update-prices.mjs now reports an unreadable seed with the path and parse error (a missing file stays silent) and still writes the upstream table.

  QA evidence: QA 2026-10-05, PR #117 (onetest-ai/octoshell), head 9bd6184 (0979dc4 B5, 2c80a0b B1+B2, 9bd6184 review fix). Real record: solo (auqanautica) transcripts, frozen copies in a scratch project/HOME, real ccusage 20.0.18 from .octobots/tools, fresh collect then rollup then verify with --project-dir. Full gate green (pnpm build, typecheck, lint, test, coverage:pack); PR checks: build pass x2. B1 verified. Scratch copy, `{` in prices.local.json: rollup exit 0, stderr 'tokenomics: WARNING ignoring <scratch>/.octobots/tokenomics/prices.local.json: Expected property name or '}' in JSON at position 1 (line 1 column 2)'; pricing from prices.json alone (cost $1190.37 vs $1388.34 with the seed; opus-5-5 and sonnet-5-5 reported unpriced). Empty file also warns ('Unexpected end of JSON input'). File absent: no warning, exit 0. update-prices.mjs with OCTOSHELL_PRICES_OUT/LOCAL in scratch and a `{` seed: exit 0, '[tokenomics] ignoring unreadable seed <path>: <error>', upstream table (21 models) written to scratch; packages/tokenomics/src/prices.data.ts byte-identical and absent from git status. Mutations: swallowing the warning or rethrowing fails the B1 test; removing the update-prices warning fails the seed test. Observation (non-blocking): valid JSON of the wrong shape ([1,2], {"models":null}) is ignored silently.
environment: 'found by the T1.4 review gate (PR #112, 2026-10-05), confirmed by QA'
