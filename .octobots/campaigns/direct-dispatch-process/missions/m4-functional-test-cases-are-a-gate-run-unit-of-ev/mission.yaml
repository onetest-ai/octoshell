name: M4 - Functional test cases are a gate-run unit of every mission
status: executing
description: 'The planner authors tests/m<n>/ (README with an AC to TC map, shared preconditions, named pre-existing records, TC-NNN_<slug>.md cases driven by API/CLI calls and/or Playwright MCP) for every mission, before build, and links it as a mission document. A new script scaffolds and links it. validate checks it as a WARNING ONLY (never an error, never blocks done). The gate''s QA phase runs the cases live on real pre-existing data, names the record per criterion, writes notes, and ticks only verified ACs. Defines the TC format contract (notes § TC format contract) that M6 parses: frontmatter id, title, mission, covers (list of M<n>-AC<k>), kind (api|ui|cli|unit), status (draft|ready|pass|fail|blocked|unknown), optional last_run {date, evidence}; coverage comes from frontmatter covers; a shared pack module tc-io.mjs.'
acceptance_criteria:
  - text: Given a mission with k ACs and no tests folder, when add-tests.js <mission-dir> runs, then <campaign>/tests/m<n>/README.md exists with an AC map holding rows M<n>-AC1..ACk and sections 'Shared preconditions', 'Pre-existing records' and 'Assumptions to confirm', a TC template with the format frontmatter is available, and the mission gains the document 'M<n> functional test cases' pointing at that README; a second run changes nothing and exits 0; an existing README is never overwritten
    done: false
  - text: Given a mission (any status except cancelled) with a missing tests README, no linked one (no document whose target equals .octobots/campaigns/<c>/tests/m<n>/README.md), or an AC that no TC-NNN_*.md in tests/m<n>/ lists in its frontmatter `covers` (or legacy `requirements`), then validate.js and validateBoard report a `warning` naming the gap (e.g. 'M1-AC11 is not covered by any test case'); a README AC-map row that disagrees with the frontmatter (an AC mapped to a TC that does not list it, a TC file that does not exist, or another mission's AC id such as M4-AC6 under tests/m3) is a separate `warning`; the exit code of validate.js is what the entity alone would produce; the finding is never an error; `set-status.js <campaign-dir> "M<n> - ..." done` is never blocked by it
    done: false
  - text: 'Given a TC file, validate.js and validateBoard warn (never error), per notes § TC format contract, when: the frontmatter is unparseable; id does not match ^TC-\d{3,}$ or the filename prefix; mission does not match the folder''s m<n> token; covers (or legacy requirements) is empty or names an AC id the mission does not have, including another mission''s; kind or status holds a value outside the contract; or `## Steps` / `## Expected Final State` is missing. Extra keys (priority, size, tags, module, type) never warn, and a legacy file with requirements: and no status/kind/mission passes the id/mission/covers/section checks. `validate.js <TC file>` checks that one file and exits 0; a path that is neither an entity nor a tests/m<n>/TC-*.md file exits 2 with ''not an entity file'''
    done: false
  - text: mission-planner documents the TC format contract (frontmatter fields and values, required sections, the PASS/FAIL/BLOCKED/UNREACHABLE -> status mapping), the {{base_url}} rule, the API/CLI/Playwright-MCP execution modes, and 'a pre-existing record per case; say UNREACHABLE rather than fabricate'; it says tests are authored with the mission, before build, and runs add-tests.js; and octobots-doctor (M7) says a tests-pairing warning is resolved by running add-tests.js and authoring the missing TCs with the mission's owner, never by deleting an AC, a TC or a README row
    done: false
  - text: 'The gate''s QA phase and the mission''s last QA task: run every TC in tests/m<n>/; write runs/RUN-YYYY-MM-DD-NNN.md; record each TC as PASS, FAIL, BLOCKED or UNREACHABLE (UNREACHABLE written as status blocked with the reason in the RUN file); name the pre-existing record per criterion (a criterion proved only on QA-created data is not passed); write `## QA verification` into task and mission notes via entity-io.mjs; tick exactly the criteria with evidence; treat ''could not drive the browser / log in'' as BLOCKED'
    done: false
  - text: BoardModel creates no entity from anything under a campaign's tests/. The board watcher skips the rebuild for writes under tests/**/runs/** and tests/**/evidence/**; a write to tests/m<n>/*.md (a TC file or README.md) still triggers the normal debounced rebuild, at most one per debounce window (no reconcile loop)
    done: false
documents:
  - label: M4 functional test cases
    target: .octobots/campaigns/direct-dispatch-process/tests/m4/README.md
tokenomics:
  effort_days: 2.5
  size_tshirt: M
  complexity_score: 15
notes: |-
  ## Planning notes (Rio, 2026-10-05)

  User decision 2: tests pairing is a WARNING ONLY. It never fails validate.js (exit code unchanged), never fails validateBoard, never blocks set-status.js done. A board of old missions is therefore noisy but never broken.
  Real gaps that prove the rule: uwb m1 has 11 ACs and M1-AC11 is covered by neither its README map nor any TC frontmatter; m2 has 10 ACs and M2-AC10 is likewise uncovered; m6 has no README and no TCs.
  Dual implementation: the rule lands in BOTH validate.js (pack) and validate.ts (board) in one task, with a parity vitest. BoardModel creates no entity from tests/; the watcher skips runs/ and evidence/ but still rebuilds on TC/README writes (AC6), because M6 shows TC status changes through the watcher. The watcher glob is .octobots/campaigns/**/*.{md,yaml} (board-watcher.ts:58) and RelativePattern cannot negate, so the skip is a path check in the handler.
  The documents link is stored verbatim by add-doc.js (it does no resolution); use the repo-relative path .octobots/campaigns/<c>/tests/m<n>/README.md, the convention existing boards use.

  ## TC format contract (single definition; M6 references it)

  - File: .octobots/campaigns/<c>/tests/m<n>/TC-NNN_<slug>.md (the folder token may carry a letter suffix, e.g. m3b). README.md, runs/ and evidence/ are not TCs.
  - Frontmatter (YAML between the first two `---` lines):
    - id: matches ^TC-\d{3,}$ and equals the filename prefix before the first `_`.
    - title: string.
    - mission: matches ^M\d+[a-z]*$ and equals the folder token upper-cased (m3b -> M3b).
    - covers: non-empty list of <mission>-AC<k> ids of THIS mission. Legacy alias: requirements (read when covers is absent).
    - kind: api | ui | cli | unit.
    - status: draft | ready | pass | fail | blocked | unknown. A reader reports unknown when status is absent. set-test-status.js (M6) writes draft|ready|pass|fail|blocked; only its --migrate writes unknown, and only when no status is given.
    - last_run (optional): {date: YYYY-MM-DD, evidence: <repo-relative path of the RUN file>}.
    - Any other key (priority, size, tags, module, type, ...) is allowed and ignored silently.
  - Body: must contain the headings `## Steps` and `## Expected Final State`; the other sections (Objective, Preconditions, Real data, Commands, Teardown) are conventional.
  - Result words -> status: PASS -> pass, FAIL -> fail, BLOCKED -> blocked, UNREACHABLE -> blocked with the reason in the RUN file. A manual (F5) execution is noted as manual in the RUN file.
  - Linked: the mission's documents hold an entry whose target equals .octobots/campaigns/<c>/tests/m<n>/README.md exactly; the label may differ (solo's says '(API + Playwright MCP)').
  - Coverage: an AC is covered when some TC in tests/m<n>/ lists it in covers (or requirements). The README AC map is documentation; a README row that disagrees with the frontmatter, names a missing TC file, or names another mission's AC id is a separate warning (AC2).
  - Messages: every finding names paths relative to `.octobots/`, so validate.js and validateBoard produce identical text for the parity tests.
  - validate.js <TC file>: checks that one file, prints its `warning:` lines, exits 0. A path that is neither an entity nor a tests/m<n>/TC-*.md file exits 2 ('not an entity file').
  - Shared module: skill/mission-planner/scripts/tc-io.mjs (split/parse/serialize frontmatter, preserving the body byte-for-byte; the field checks above) is created by T4.2 and imported by validate.js and, in M6, by set-test-status.js. entity-io.mjs has no frontmatter helpers. packages/board mirrors tc-io in TS (dual implementation, parity tests).
