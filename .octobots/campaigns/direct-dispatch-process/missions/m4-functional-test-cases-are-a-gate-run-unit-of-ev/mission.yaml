name: M4 - Functional test cases are a gate-run unit of every mission
status: done
description: 'The planner authors tests/m<n>/ (README with an AC to TC map, shared preconditions, named pre-existing records, TC-NNN_<slug>.md cases driven by API/CLI calls and/or Playwright MCP) for every mission, before build, and links it as a mission document. A new script scaffolds and links it. validate checks it as a WARNING ONLY (never an error, never blocks done). The gate''s QA phase runs the cases live on real pre-existing data, names the record per criterion, writes notes, and ticks only verified ACs. Defines the TC format contract (notes § TC format contract) that M6 parses: frontmatter id, title, mission, covers (list of M<n>-AC<k>), kind (api|ui|cli|unit), status (draft|ready|pass|fail|blocked|unknown), optional last_run {date, evidence}; coverage comes from frontmatter covers; a shared pack module tc-io.mjs.'
acceptance_criteria:
  - text: Given a mission with k ACs and no tests folder, when add-tests.js <mission-dir> runs, then <campaign>/tests/m<n>/README.md exists with an AC map holding rows M<n>-AC1..ACk and sections 'Shared preconditions', 'Pre-existing records' and 'Assumptions to confirm', a TC template with the format frontmatter is available, and the mission gains the document 'M<n> functional test cases' pointing at that README; a second run changes nothing and exits 0; an existing README is never overwritten
    done: true
  - text: Given a mission (any status except cancelled) with a missing tests README, no linked one (no document whose target equals .octobots/campaigns/<c>/tests/m<n>/README.md), or an AC that no TC-NNN_*.md in tests/m<n>/ lists in its frontmatter `covers` (or legacy `requirements`), then validate.js and validateBoard report a `warning` naming the gap (e.g. 'M1-AC11 is not covered by any test case'); a README AC-map row that disagrees with the frontmatter (an AC mapped to a TC that does not list it, a TC file that does not exist, or another mission's AC id such as M4-AC6 under tests/m3) is a separate `warning`; the exit code of validate.js is what the entity alone would produce; the finding is never an error; `set-status.js <campaign-dir> "M<n> - ..." done` is never blocked by it
    done: true
  - text: 'Given a TC file, validate.js and validateBoard warn (never error), per notes § TC format contract, when: the frontmatter is unparseable; id does not match ^TC-\d{3,}$ or the filename prefix; mission does not match the folder''s m<n> token; covers (or legacy requirements) is empty or names an AC id the mission does not have, including another mission''s; kind or status holds a value outside the contract; or `## Steps` / `## Expected Final State` is missing. Extra keys (priority, size, tags, module, type) never warn, and a legacy file with requirements: and no status/kind/mission passes the id/mission/covers/section checks. `validate.js <TC file>` checks that one file and exits 0; a path that is neither an entity nor a tests/m<n>/TC-*.md file exits 2 with ''not an entity file'''
    done: true
  - text: mission-planner documents the TC format contract (frontmatter fields and values, required sections, the PASS/FAIL/BLOCKED/UNREACHABLE -> status mapping), the {{base_url}} rule, the API/CLI/Playwright-MCP execution modes, and 'a pre-existing record per case; say UNREACHABLE rather than fabricate'; it says tests are authored with the mission, before build, and runs add-tests.js; and octobots-doctor (M7) says a tests-pairing warning is resolved by running add-tests.js and authoring the missing TCs with the mission's owner, never by deleting an AC, a TC or a README row
    done: true
  - text: 'The gate''s QA phase and the mission''s last QA task: run every TC in tests/m<n>/; write runs/RUN-YYYY-MM-DD-NNN.md; record each TC as PASS, FAIL, BLOCKED or UNREACHABLE (UNREACHABLE written as status blocked with the reason in the RUN file); name the pre-existing record per criterion (a criterion proved only on QA-created data is not passed); write `## QA verification` into task and mission notes via entity-io.mjs; tick exactly the criteria with evidence; treat ''could not drive the browser / log in'' as BLOCKED'
    done: true
  - text: BoardModel creates no entity from anything under a campaign's tests/. The board watcher skips the rebuild for writes under tests/**/runs/** and tests/**/evidence/**; a write to tests/m<n>/*.md (a TC file or README.md) still triggers the normal debounced rebuild, at most one per debounce window (no reconcile loop)
    done: true
documents:
  - label: M4 functional test cases
    target: .octobots/campaigns/direct-dispatch-process/tests/m4/README.md
tokenomics:
  effort_days: 2.5
  size_tshirt: M
  complexity_score: 15
notes: |
  ## Planning notes (Rio, 2026-10-05)

  User decision 2: tests pairing is a WARNING ONLY. It never fails validate.js (exit code unchanged), never fails validateBoard, never blocks set-status.js done. A board of old missions is therefore noisy but never broken.
  Real gaps that prove the rule: uwb m1 has 11 ACs and M1-AC11 is covered by neither its README map nor any TC frontmatter; m2 has 10 ACs and M2-AC10 is likewise uncovered; m6 has no README and no TCs.
  Dual implementation: the rule lands in BOTH validate.js (pack) and validate.ts (board) in one task, with a parity vitest. BoardModel creates no entity from tests/; the watcher skips runs/ and evidence/ but still rebuilds on TC/README writes (AC6), because M6 shows TC status changes through the watcher. The watcher glob is .octobots/campaigns/**/*.{md,yaml} (board-watcher.ts:58) and RelativePattern cannot negate, so the skip is a path check in the handler.
  The documents link is stored verbatim by add-doc.js (it does no resolution); use the repo-relative path .octobots/campaigns/<c>/tests/m<n>/README.md, the convention existing boards use.

  ## TC format contract (single definition; M6 references it)

  - File: .octobots/campaigns/<c>/tests/m<n>/TC-NNN_<slug>.md (the folder token may carry a letter suffix, e.g. m3b). README.md, runs/ and evidence/ are not TCs.
  - Frontmatter (YAML between the first two `---` lines):
    - id: matches ^TC-\d{3,}$ and equals the filename prefix before the first `_`.
    - title: string.
    - mission: matches ^M\d+[a-z]*$ and equals the folder token upper-cased (m3b -> M3b).
    - covers: non-empty list of <mission>-AC<k> ids of THIS mission. Legacy alias: requirements (read when covers is absent).
    - kind: api | ui | cli | unit.
    - status: draft | ready | pass | fail | blocked | unknown. A reader reports unknown when status is absent. set-test-status.js (M6) writes draft|ready|pass|fail|blocked; only its --migrate writes unknown, and only when no status is given.
    - last_run (optional): {date: YYYY-MM-DD, evidence: <repo-relative path of the RUN file>}.
    - Any other key (priority, size, tags, module, type, ...) is allowed and ignored silently.
  - Body: must contain the headings `## Steps` and `## Expected Final State`; the other sections (Objective, Preconditions, Real data, Commands, Teardown) are conventional.
  - Result words -> status: PASS -> pass, FAIL -> fail, BLOCKED -> blocked, UNREACHABLE -> blocked with the reason in the RUN file. A manual (F5) execution is noted as manual in the RUN file.
  - Linked: the mission's documents hold an entry whose target equals .octobots/campaigns/<c>/tests/m<n>/README.md exactly; the label may differ (solo's says '(API + Playwright MCP)').
  - Coverage: an AC is covered when some TC in tests/m<n>/ lists it in covers (or requirements). The README AC map is documentation; a README row that disagrees with the frontmatter, names a missing TC file, or names another mission's AC id is a separate warning (AC2).
  - Messages: every finding names paths relative to `.octobots/`, so validate.js and validateBoard produce identical text for the parity tests.
  - validate.js <TC file>: checks that one file, prints its `warning:` lines, exits 0. A path that is neither an entity nor a tests/m<n>/TC-*.md file exits 2 ('not an entity file').
  - Shared module: skill/mission-planner/scripts/tc-io.mjs (split/parse/serialize frontmatter, preserving the body byte-for-byte; the field checks above) is created by T4.2 and imported by validate.js and, in M6, by set-test-status.js. entity-io.mjs has no frontmatter helpers. packages/board mirrors tc-io in TS (dual implementation, parity tests).

  ## QA verification (T4.5, 2026-10-06)

  Verdict: GREEN for the suite, recorded in the mission notes; the mission's own criteria stay unticked for the gate. Run file: .octobots/campaigns/direct-dispatch-process/tests/m4/runs/RUN-2026-10-06-001.md. All 12 TC files in tests/m4 were run on the m4 head (b2a1e094, built) against cp -R copies; every TC status is pass and last_run is set by hand.

  Per case, with the pre-existing record it was proved on:
  - TC-001 PASS: octoshell octograph m6-extension-bridge (copy; 5 real ACs, no tests/): README rows M6-AC1..5, 3 sections, document linked, nothing else changed.
  - TC-002 PASS: solo uwb m1 (copy; real README, doc linked): add-tests.js twice, exit 0, git diff --no-index empty.
  - TC-003 PASS: solo uwb m1 (copy): one warning for M1-AC11, exit 0; set-status draft/active/done all exit 0 with the warning at every status.
  - TC-004 PASS: solo uwb m2 (copy): one warning for M2-AC10, exit 0.
  - TC-005 PASS: solo uwb m6 (copy; done, no README, no TCs): warning "missing", exit 0.
  - TC-006 PASS: solo uwb m1 real TC-003 (copy): clean (legacy requirements accepted); id mismatch warns once; missing section warns once. The case text was wrong at step 3 (the awk copy kept id TC-003 under TC-098, so the product rightly gave 2 warnings); the case was corrected (copy named TC-003_nosection.md), not the result.
  - TC-007 PASS: solo copy via OCTOBOTS_BOARD_COPIES: validate-tests-parity 15 passed.
  - TC-008 PASS: solo uwb campaign copy: tests-folder-ignored 3 passed, board-watcher 11 passed.
  - TC-009 PASS: octoshell's real board, 5 completed fresh sonnet sub-agents each in its own shared clone with the v57 pack: 5/5 conform (README maps every AC, linked, valid TCs, named record or UNREACHABLE, validate.js silent). 6 were dispatched: the ws2 agent hung with no TC files and was replaced by a fresh one (ws6); recorded in the RUN file.
  - TC-010 PASS and TC-012 PASS: the real shipped SKILL.md files: skill-conventions 108 passed.
  - TC-011 PASS: solo uwb m6 and m1 (fresh copy): active then done exit 0, status done, warning never blocks.

  TCs that are not pass: none. Sub-point UNREACHABLE on real data (recorded, not substituted): the README-map-disagreement half of M4-AC2 (README assumption A4); it is proved only by the synthetic cases inside validate-tests-parity.test.ts. Bugs filed: none.

  Data safety: solo's git status --short and its .octobots sha256 manifest (1209 files) are identical before and after; octoshell's .octobots outside this campaign (209 files) is identical; the only octoshell writes are tests/m4 status/runs/evidence and the T4.5 and M4 notes (evidence/data-safety.txt).

  Mission criteria with evidence (the completion gate ticks them in phase 5; this task ticks none of them):
  - M4-AC1: TC-001, TC-002.
  - M4-AC2: TC-003, TC-004, TC-005, TC-011 (real data) and TC-007 (parity; also the synthetic README-disagreement cases). Disagreement half only synthetic, see above.
  - M4-AC3: TC-006 (real and corrected-copy cases) and TC-007.
  - M4-AC4: TC-009 (behaviour, 5/5) and TC-012 (doctor paragraph), with the planner text assertions in TC-010's vitest.
  - M4-AC5: TC-010 (text of both skills) and this run itself as the last-task live run on real copies; the gate repeats it on a fresh tree.
  - M4-AC6: TC-008.

  ## Completion gate (2026-10-06): GREEN

  - **Base:** feat/direct-dispatch-process.
  - **Mission branch:** feat/direct-dispatch-process-m4.
  - **PRs:**
    - #147 T4.1 add-tests.js scaffolds and links a mission's tests folder
    - #148 T4.2 validate.js and validateBoard warn on tests pairing and TC format
    - #149 M4 B1 (graph e2e-gate teardown ENOTEMPTY flake)
    - #150 T4.3 the planner authors tests with the mission
    - #151 T4.4 the gate and the last QA task run the cases on real data
    - #152 M4 B2 (mission-execution and the gate disagreed on the last-task live run, notes writes and AC ticking)
    - #153 T4.5 mission QA run (tests/m4; RUN-2026-10-06-001)
    - #154 the gate fixes GATE-1 and GATE-2 (below), each with a regression test that was red before

  1. **Tests + coverage:** 0 failed. build, typecheck, lint and test all exit 0 on the fix head f715251c.
     - Counts: m4 head board 424 / tokenomics 102 / extension 1004 / graph 655; fix head 426 / 102 / 1005 / 655.
     - Changed-line coverage 97.88% (97.91% with the fix); no file is under 80%.
     - The only skip is `it.skipIf(win32)` on the FIFO test, which has a reason.
     - Payload is byte-identical (the 57 hash matches). The shipped-skill store is append-only (414 to 450 entries, 0 removed). validate.js and validateBoard agree, tc-io.mjs and tc-io.ts agree, and the hardened reader is used everywhere.
  2. **Black-box QA (Sage):** see T4.5's `## QA verification` block above (12/12 TCs pass, RUN-2026-10-06-001) rather than a copy of it. Two additions made at the gate, both appended to that RUN file:
     - TC-009 corrected to 6/6: the ws2 agent finished later and conforms (installed validate.js plus score.sh re-run at the gate). The T4.5 text that excluded it as hung stands as written; the dated correction follows it.
     - Gate re-verification of #154: GATE-1 reproduced on the base pack (validate.js on the campaign dir and on a TC file exits 1 with a YAMLException when a sibling mission.yaml is malformed), exit 0 on the fix pack, the corrupt mission still fails on its own; GATE-2 shown through the watcher harness with the board under `campaigns/x/tests/y/runs/` (fix: one rebuild; base: none). TC-003, TC-006, TC-007 and TC-008 re-run on fresh copies, all PASS. Evidence: tests/m4/evidence/GATE-154-*.txt. Not a live VS Code run.
     - Data safety: solo was read only (git status identical before and after); every run used cp -R copies.
  3. **Critical review (Rio):** all six criteria met; AC2's README-map-disagreement half is synthetic-only (see Open).
     - GATE-1 (fixed in #154): a malformed SIBLING mission.yaml made `validate.js <campaign>` and `validate.js <TC file>` exit 1 with a YAMLException while base exits 0, breaking M4-AC2 ("exit code is what the entity alone would produce") and AC3 ("a TC file exits 0"). The pairing scan now skips an unparseable sibling.
     - GATE-2 (fixed in #154): the board watcher matched the `tests/**/runs|evidence` pattern anywhere in the absolute path, so a workspace checked out under e.g. `/x/campaigns/a/tests/b/runs/repo` skipped every board event (M4-AC6). It now judges only the part below the last `.octobots/campaigns/`.
     - Per-task review fixes, landed before the gate: symlink write-through, the FIFO hang, an unreachable doctor section, two skill contradictions, and bugs B1 and B2.
     - #149 and #152 are sound.
  4. **Tokenomics:** M4 cost $33.44 API-equivalent, 721 turns, orchestrator 18% (42 sub-agent dispatches).
     - Command (shipped v57 scripts): for s in collect rollup render; do node apps/vscode-extension/resources/octobots-pack/tokenomics/$s.mjs --project-dir /Users/arozumenko/Development/octoshell; done. Read from .octobots/tokenomics/runs.json, row direct-dispatch-process/M4. Collected at the moment of the gate, so the turns after it (this record, the mission PR) are not in it. The tokenomics files are not committed.

  **Open, not blocking:**
  - The gate's phase 5 writes the description when there is no tracker, while notes get `## Completion gate`: two places for one thing.
  - mission-execution's "Functional verification is manual QA" predates M4 and collides with the contract's "manual" (F5).
  - A mission with no last QA task: the gate's "ticked criterion without a matching QA verification line" rule should also accept `## Completion gate`.
  - `validateBoard` throws on any malformed entity YAML (predates M4).
  - `setup-git-env.ts` overwrites an ambient `GIT_CONFIG_COUNT`.
  - add-tests.js copies the mission-id regex instead of importing it from tc-io.
  - AC2's README-map-disagreement half is proven only synthetically: assumption A4 holds, there are 0 map-row warnings on any real campaign, and a real case would require fabricating data. Ticking AC2 is acceptable on that basis and is recorded here.
