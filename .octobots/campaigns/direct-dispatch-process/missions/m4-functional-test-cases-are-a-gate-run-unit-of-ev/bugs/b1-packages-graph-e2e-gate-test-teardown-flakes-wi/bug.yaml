name: B1 - packages/graph e2e-gate test teardown flakes with ENOTEMPTY removing its temp .git
status: done
severity: minor
description: 'packages/graph/test/e2e-gate.test.ts (''end-to-end: a one-module change confines the map.md and clusters.json diff...'') failed in CI with ENOTEMPTY: directory not empty, rmdir ''/tmp/octograph-*/.git'', thrown from the onTestFinished cleanup in test/fixtures/tmpdir.ts:31 (rmSync recursive+force). The assertions themselves did not fail: the teardown raced with something still writing into .git (likely a background git process: auto-gc/maintenance or an un-awaited child). packages/graph is unchanged by this campaign, so this is a pre-existing flake; it turned the M3 mission PR''s push CI red on a board-only commit (run 37363971883, 2026-10-05). A red cleanup step makes CI red for an unrelated change, which erodes the gate.'
steps_to_reproduce: 'Seen once in CI (ubuntu runner, run 37363971883 job 111955505661). Likely repro: loop `pnpm --filter @octoshell/graph exec vitest run test/e2e-gate.test.ts` under CPU load.'
expected: 'Test cleanup never fails the test: every git child the test spawns is awaited before teardown, git runs with gc.auto=0 / maintenance.auto=false in fixtures, and rmSync uses maxRetries (or the fixture tolerates ENOTEMPTY with a retry).'
actual: The cleanup rmSync throws ENOTEMPTY and fails the test.
rca: |-
  Cause: every fixture `git commit` ends by launching a detached `git maintenance run --auto --quiet --detach`. That child daemonizes before deciding whether any task is due, then takes .git/objects/maintenance.lock (and may touch gc.log). It is not a child the test awaits, so the onTestFinished rmSync of the temp repo races it and fails with ENOTEMPTY on a slow CI runner, after the assertions already passed.
  Fix: packages/graph/test/setup-git-env.ts, wired as vitest setupFiles (per worker), sets gc.auto=0, maintenance.auto=false, core.fsmonitor=false via GIT_CONFIG_COUNT/KEY_n/VALUE_n, so every git process the suite spawns (fixtures, inline execFileSync, the CLI's own children) inherits it. tmpdir.ts rmSync gains maxRetries/retryDelay as a backstop only. test/git-hygiene.test.ts was red before the fix.
  Evidence: GIT_TRACE2_EVENT over 3 commits in a scratch repo: without the env, 3 commit + 3 maintenance cmd_name events; with the env, 3 commit and no maintenance. Removing the setupFiles line turns both git-hygiene tests red; restoring it turns them green. Full pnpm build/typecheck/lint/test green; PR #149 CI green.
  Not reproduced locally (0/50 on macOS); proved by trace of the mechanism, not by observing the ENOTEMPTY. Residual risk: another late writer would be absorbed only by the retry backstop.
environment: GitHub Actions ubuntu runner, push CI on feat/direct-dispatch-process-m3 at 9f9c2519
