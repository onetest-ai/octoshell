name: B2 - mission-execution and the gate still disagree on the last-task live run, mission-notes writes and when mission ACs are ticked
status: done
severity: minor
description: 'Found by T4.4 QA (PR #151, merged 4b88ddd7) reading the installed v57 skills end to end. Agents follow these texts literally, so a contradiction makes them pick a side at random. In resources/octobots-pack/skill/mission-execution/SKILL.md (line numbers at 4b88ddd7): (1) L14 ''gated once, with a live E2E'' and L452 ''ONE dynamic gate per mission'' do not mention the last-task live run that L219 and L540-542 define; (2) L516-520 say a task never writes board state for a different entity, but the last task writes the mission''s notes (L229; gate L152); (3) L511 says mission criteria are checked off before done, while mission-completion-gate phase 5 (L121-122) ticks them after the gate is green (pre-dates T4.4); (4) both gate L152 and execution L229 write a ''## QA verification'' block into the mission notes, so the heading can be duplicated.'
steps_to_reproduce: Read the installed mission-execution and mission-completion-gate SKILL.md at feat/direct-dispatch-process-m4 4b88ddd7 at the cited lines.
expected: 'One consistent story across both skills: (1) the summary lines name the two live runs (the last Mission QA task and the gate); (2) the never-write-another-entity rule names the last task''s mission-notes write as its exception; (3) mission criteria are ticked only by gate phase 5 (the last task marks evidenced criteria in its notes, does not tick mission ACs); (4) the last task writes ''## QA verification'' and the gate writes a distinct heading (e.g. ''## Completion gate (<date>)'', matching the M3/M7 records) or appends under the existing one. skill-conventions.test.ts asserts each.'
actual: The four statements above contradict each other.
rca: 'Root cause: T4.4 added the last-task live run (mission-execution L219, L540-542; gate ''QA on the test cases'') after the summary lines (L14, L452), the never-write-another-entity rule (L519) and the mission-done flip wording (L511) were written, and nobody re-read those against the new section. The two skills restate the same rules in two places with no shared source, and the notes heading was not partitioned between the last task and the gate. Fixed in PR #152 by editing both skills together: (1) summary lines name both live runs; (2) the rule names the last task''s mission-notes write as its exception; (3) only gate phase 5 ticks mission criteria, the last task ticks its own and records evidence; (4) the last task writes ''## QA verification'', the gate writes ''## Completion gate (<date>): GREEN|RED'' that refers to it. skill-conventions.test.ts asserts each. QA (PR #152): installed v57 skills read end to end, all four resolutions confirmed, shipped-skills store current, build/typecheck/lint/test/coverage:pack green, CI green. Non-blocking residue noted: gate phase 5 offers the mission description as a fallback mirror for gate results while the QA section puts them in notes; execution L130-131 ''Functional verification is manual QA against the mission''s test cases'' does not say it is the last task and the gate, not per build task.'
environment: pack v57, feat/direct-dispatch-process-m4 at 4b88ddd7, 2026-10-06
